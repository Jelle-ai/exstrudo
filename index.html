   Winkelgegevens, voorwaarden en privacy
   Een webshop hoort te zeggen wie hij is, wat de regels zijn en wat er met je
   gegevens gebeurt. De tekst hieronder wordt opgebouwd uit wat er in
   Shopbeheer → Winkelgegevens staat; wat daar leeg is, blijft hier zichtbaar
   leeg met de reden erbij. Verzinnen is geen optie.
   ===================================================================== */
const INFO_DELEN = [
  ["contact",     "envelope"],
  ["materialen",  "palette"],
  ["voorwaarden", "file-lines"],
  ["retour",      "rotate-left"],
  ["privacy",     "shield-halved"],
];
/* Alleen een land is geen adres — dan hoort er niets te staan, geen "België"
   dat doet alsof het compleet is. */
function adresRegel(w){
  if (!w.straat || !w.gemeente) return null;
  return [w.straat, [w.postcode, w.gemeente].filter(Boolean).join(" "), w.land].filter(Boolean).join(", ");
}
function ontbreektRegel(sleutel){
  return `<span class="ontbreekt" title="Vul dit in bij Shopbeheer → Winkelgegevens">${t("info.ontbreekt", { wat: t(sleutel) })}</span>`;
}
function viewInfo(){
  const w = winkel();
  const deel = INFO_DELEN.some(([id]) => id === state.__infoDeel) ? state.__infoDeel : "contact";
  const mist = winkelOntbreekt();
  const adres = adresRegel(w);
  const kop = (sleutel) => `<h3 class="info-kop">${t(sleutel)}</h3>`;
  const mail = w.email ? `<a href="mailto:${esc(w.email)}" style="color:inherit;">${esc(w.email)}</a>` : "";
  const inhoud = {
    materialen: `
      ${kop("gids.titel")}
      ${materiaalGids()}`,

    contact: `
      <p style="font-size:14px;line-height:1.75;margin:0 0 14px;">${t("info.contactIntro", { winkel: esc(w.naam) })}</p>
      <div class="kv"><span>${t("info.winkel")}</span><span>${esc(w.naam)}</span></div>
      <div class="kv"><span>${t("info.wie")}</span><span>${w.eigenaar ? esc(w.eigenaar) : ontbreektRegel("info.deNaam")}</span></div>
      <div class="kv"><span>${t("info.adres")}</span><span style="text-align:right;">${adres ? esc(adres) : ontbreektRegel("info.hetAdres")}</span></div>
      <div class="kv"><span>${t("info.email")}</span><span>${mail || ontbreektRegel("info.eenMail")}</span></div>
      ${w.telefoon ? `<div class="kv"><span>${t("info.telefoon")}</span><span>${esc(w.telefoon)}</span></div>` : ``}
      <div class="kv"><span>${t("info.ondernemingsnummer")}</span><span>${w.ondernemingsnummer ? esc(w.ondernemingsnummer) : ontbreektRegel("info.hetNummer")}</span></div>
      ${w.btw ? `<div class="kv"><span>${t("info.btw")}</span><span>${esc(w.btw)}</span></div>` : ``}`,

    voorwaarden: `
      ${kop("vw.vanWie")}
      <p>${esc(w.naam)}${w.eigenaar ? `, ${esc(w.eigenaar)}` : ``}${adres ? `, ${esc(adres)}` : ``}.
      ${w.ondernemingsnummer ? t("vw.ondernemingsnummer", { nr: esc(w.ondernemingsnummer) }) : ``}</p>

      ${kop("vw.watJeKoopt")}
      <p>${t("vw.watJeKooptTekst")}</p>

      ${kop("vw.prijzen")}
      <p>${t("vw.prijzenTekst")}</p>

      ${kop("vw.betalen")}
      <p>${t("vw.betalenTekst")}</p>

      ${kop("vw.levering")}
      <p>${t("vw.leveringTekst", { tijd: esc(levertijdTekst()) })}</p>

      ${kop("vw.misgaat")}
      <p>${t("vw.misgaatTekst", { via: mail ? t("vw.viaMail", { mail }) : "" })}</p>`,

    retour: `
      ${kop("ret.bedenktijd")}
      <p>${t("ret.bedenktijdTekst", { dagen: esc(String(w.retourdagen)), via: mail ? t("vw.viaMail", { mail }) : "" })}</p>

      ${kop("ret.behalve")}
      <p>${t("ret.behalveTekst")}</p>

      ${kop("ret.misPrint")}
      <p>${t("ret.misPrintTekst")}</p>`,

    privacy: `
      ${kop("pri.watWeBijhouden")}
      <p>${t("pri.watWeBijhoudenTekst")}</p>

      ${kop("pri.waarHetStaat")}
      <p>${t("pri.waarHetStaatTekst")}</p>

      ${kop("pri.jeModellen")}
      <p>${t("pri.jeModellenTekst")}</p>

      ${kop("pri.watJeKuntVragen")}
      <p>${t("pri.watJeKuntVragenTekst", { via: mail ? t("pri.stuurNaar", { mail }) : "" })}</p>`,
  };
  return `
    <div style="padding:32px 0;max-width:640px;">
      <button class="back" onclick="go('shop')">${ic("arrow-left")} ${t("alg.terugCollectie")}</button>
      <h1 class="font-display" style="font-size:24px;margin:0 0 14px;">${esc(w.naam)}</h1>
      <div class="fil-types" style="margin-bottom:16px;">
        ${INFO_DELEN.map(([id, icoon]) => `
          <button class="fil-type ${id === deel ? "active" : ""}" data-info="${esc(id)}">${ic(icoon)} ${t("info." + id)}</button>`).join("")}
      </div>
      ${state.profile?.isAdmin && mist.length ? `
        <div class="notice" style="margin-bottom:16px;">
          <p class="notice-title">${ic("triangle-exclamation")} Alleen jij ziet dit</p>
          <p class="muted" style="font-size:13px;line-height:1.65;margin:0 0 10px;">
            Hier ontbreekt nog ${mist.join(", ").replace(/,([^,]*)$/, " en$1")}. Zonder die gegevens
            zijn je voorwaarden niet volledig — een webshop hoort te zeggen wie erachter zit.
          </p>
          <button class="btn btn-accent btn-sm" onclick="go('admin', { __adminTab: 'winkel' })">Vul ze in</button>
        </div>` : ``}
      <div class="cart-item info-blok">${inhoud[deel]}</div>
      <p class="footer-note">${ic("scale-balanced")} ${t("info.gewoneTaal")}</p>
    </div>`;
}
function attachInfoHandlers(){
  document.querySelectorAll('[data-info]').forEach(b => {
    b.onclick = () => { state.__infoDeel = b.dataset.info; render(); };
  });
}

/* =====================================================================
   Instellingen
   Alles wat je over jezelf kunt zeggen, op één plek. Bewust bereikbaar zonder
   account: taal en thema horen bij de browser waarin je zit, niet bij een
   inlog. Wie wél ingelogd is, krijgt er zijn gegevens en zijn bewaarde
   producten bij — en zijn taalkeuze verhuist dan mee naar zijn telefoon.
   ===================================================================== */
function keuzeRij(sleutel, opties, nu, attr){
  return `
    <div class="inst-rij">
      <span class="inst-label">${t(sleutel)}</span>
      <div class="fil-types" style="margin:0;">
        ${opties.map(([k, label]) => `
          <button class="fil-type ${k === nu ? "active" : ""}" ${attr}="${esc(k)}">${esc(label)}</button>`).join("")}
      </div>
    </div>`;
}
function viewInstellingen(){
  const p = state.profile || {};
  const a = p.address || bewaardAdres() || {};
  const bew = bewaardeProducten();
  const mail = p.mail || {};
  return `
    <div style="padding:32px 0;max-width:520px;">
      <button class="back" onclick="go('${state.user ? "account" : "shop"}')">${ic("arrow-left")} ${t("alg.terug")}</button>
      <h1 class="font-display" style="font-size:22px;margin:0 0 4px;">${t("inst.kop")}</h1>
      <p class="muted" style="font-size:13px;line-height:1.6;margin:0 0 18px;">${t("inst.sub")}</p>

      <div class="cart-item">
        ${keuzeRij("inst.taal", TALEN, taal(), "data-kiestaal")}
        ${keuzeRij("inst.thema", THEMAS.map(k => [k, t("thema." + k)]), themaKeuze(), "data-kiesthema")}
        <p class="muted" style="font-size:12px;line-height:1.65;margin:2px 0 0;">
          ${t(state.user ? "inst.bijAccount" : "inst.bijBrowser")}
        </p>
      </div>

      ${state.user ? `
        <h2 class="font-display" style="font-size:16px;margin:22px 0 8px;">${t("inst.gegevens")}</h2>
        <div class="cart-item">
          <label class="field-label" style="margin-top:0;">${t("auth.naam")}</label>
          <input id="instNaam" value="${esc(p.name || "")}" autocomplete="name" name="name" />
          <label class="field-label">${t("ck.bezorgadres")}</label>
          <input id="instStraat" placeholder="${esc(t("ck.straat"))}" autocomplete="street-address" value="${esc(a.street || "")}" />
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <input id="instPostcode" placeholder="${esc(t("ck.postcode"))}" autocomplete="postal-code" inputmode="numeric" value="${esc(a.zip || "")}" />
            <input id="instGemeente" placeholder="${esc(t("ck.gemeente"))}" autocomplete="address-level2" value="${esc(a.city || "")}" />
          </div>
          <label class="field-label">${t("ck.land")}</label>
          <select class="field" id="instLand">
            ${SHIPPING_RATES.map(r => `<option value="${esc(r.country)}"${r.country === (p.shippingCountry || bekendLand()) ? " selected" : ""}>${esc(landTekst(r.country))}</option>`).join("")}
          </select>
          <p class="muted" style="font-size:12px;line-height:1.65;margin:0 0 12px;">${t("inst.adresUitleg")}</p>
          <button class="btn btn-accent" id="instBewaarBtn" style="width:100%;">${t("inst.bewaren")}</button>
        </div>

        <h2 class="font-display" style="font-size:16px;margin:22px 0 8px;">${t("inst.berichten")}</h2>
        <div class="cart-item">
          <label class="checkbox-row" style="margin:0 0 6px;">
            <input type="checkbox" id="mailVerzonden" style="width:auto;margin:0;" ${mail.verzonden === false ? "" : "checked"} />
            ${t("inst.mailVerzonden")}
          </label>
          <label class="checkbox-row" style="margin:0;">
            <input type="checkbox" id="mailGeleverd" style="width:auto;margin:0;" ${mail.geleverd === false ? "" : "checked"} />
            ${t("inst.mailGeleverd")}
          </label>
          <p class="muted" style="font-size:12px;line-height:1.65;margin:8px 0 0;">${t("inst.mailUitleg")}</p>
        </div>` : `
        <div class="cart-item" style="margin-top:18px;text-align:center;">
          <p style="font-size:13px;line-height:1.65;margin:0 0 12px;">${t("inst.logInVoorMeer")}</p>
          <button class="btn btn-accent" onclick="go('login')">${t("nav.inlogRegistreer")}</button>
        </div>`}

      <h2 class="font-display" style="font-size:16px;margin:22px 0 8px;">
        ${t("bewaar.kop")}${bew.length ? ` <span class="muted font-mono" style="font-size:12px;">${bew.length}</span>` : ``}
      </h2>
      ${bew.length ? `
        <div class="grid grid-klein">
          ${bew.map(productKaart).join("")}
        </div>` : `
        <div class="cart-item">
          <p class="muted" style="font-size:13px;line-height:1.65;margin:0;">${t("bewaar.leeg")}</p>
        </div>`}
    </div>`;
}
function attachInstellingenHandlers(){
  attachShopHandlers();                       // de kaarten en de hartjes
  document.querySelectorAll('[data-kiestaal]').forEach(b => {
    b.onclick = () => zetTaal(b.dataset.kiestaal);
  });
  document.querySelectorAll('[data-kiesthema]').forEach(b => {
    b.onclick = () => zetThema(b.dataset.kiesthema);
  });
  const bewaar = document.getElementById('instBewaarBtn');
  if (bewaar) bewaar.onclick = async () => {
    const val = id => (document.getElementById(id)?.value || "").trim();
    const adres = { street: val('instStraat'), zip: val('instPostcode'), city: val('instGemeente') };
    const land = document.getElementById('instLand')?.value || null;
    bewaar.disabled = true;
    try{
      await updateDoc(doc(db, "users", state.user.uid), {
        name: val('instNaam'), address: adres, shippingCountry: land,
      });
      state.profile = { ...(state.profile || {}), name: val('instNaam'), address: adres, shippingCountry: land };
      try{ localStorage.setItem(ADRES_SLEUTEL, JSON.stringify({ ...adres, land })); }catch(e){}
      notify(t("inst.bewaard"));
      render();
    }catch(err){ notify(t("inst.mislukt") + " " + firestoreHint(err)); bewaar.disabled = false; }
  };
  for (const [id, veld] of [["mailVerzonden", "verzonden"], ["mailGeleverd", "geleverd"]]){
    const el = document.getElementById(id);
    if (!el) continue;
    el.onchange = () => {
      const mail = { ...(state.profile?.mail || {}), [veld]: el.checked };
      state.profile = { ...(state.profile || {}), mail };
      updateDoc(doc(db, "users", state.user.uid), { mail }).catch(() => {});
    };
  }
}

function viewAccount(){
  if (!state.user){
    return `<div style="padding:32px 0;"><p class="muted">${t("acc.nietIngelogd")}</p><button class="btn btn-accent" onclick="go('login')">${t("auth.inloggen")}</button></div>`;
  }
  const a = state.profile?.address || {};
  const naam = state.profile?.name || (state.user.email || "").split("@")[0];
  // Alleen wat van dit account is. Als beheerder haalt de shop álle
  // bestellingen op voor Shopbeheer — die horen hier niet tussen te staan.
  const mijne = state.orders.filter(o => o.uid === state.user.uid);
  const actief = mijne.filter(o => o.status !== "Geleverd" && !o.hiddenForUser);
  const afgerond = mijne.filter(o => o.status === "Geleverd" && !o.hiddenForUser);
  const verborgen = mijne.filter(o => o.hiddenForUser).length;
  return `
    <div style="padding:32px 0;max-width:520px;">
      <h1 class="font-display" style="font-size:22px;margin-bottom:2px;">${t("acc.hallo", { naam: esc(naam) })}</h1>
      <p class="muted" style="font-size:13px;margin:0 0 4px;">${esc(state.user.email || '')}</p>
      ${state.profile?.isAdmin ? `<span class="badge badge-accent">${t("acc.beheerder")}</span>` : ``}
      ${a.street ? `<p class="muted" style="font-size:12px;margin:8px 0 0;">${esc(a.street)}, ${esc(a.zip||'')} ${esc(a.city||'')}</p>` : ``}
      ${state.profileError ? `<p class="muted" style="font-size:12px;margin-top:8px;color:var(--accent);">${t("acc.profielFout")}</p>` : ``}
      ${state.ordersError ? `
        <div class="cart-item" style="border-color:var(--accent);margin-top:14px;">
          <p style="font-size:13px;margin:0 0 6px;color:var(--accent);font-weight:600;">${t("acc.bestelFout")}</p>
          <p class="muted" style="font-size:13px;margin:0 0 6px;">${esc(firestoreHint(state.ordersError))}</p>
          <p class="muted font-mono" style="font-size:11px;margin:0;">${esc(state.ordersError.code || state.ordersError.message || '')}</p>
        </div>` : ``}

      <h2 class="font-display" style="font-size:16px;margin:24px 0 10px;">
        ${t(actief.length ? "acc.lopende" : "nav.bestellingen")}
      </h2>
      ${actief.map(orderCard).join("") || `<p class="muted" style="font-size:13px;">${t("acc.geenLopende")}</p>`}

      ${afgerond.length ? `
        <h2 class="font-display" style="font-size:16px;margin:24px 0 4px;">${t("acc.geschiedenis")}</h2>
        <p class="muted" style="font-size:12px;margin:0 0 10px;">${t("acc.geschiedenisUit")}</p>
        ${afgerond.map(orderCard).join("")}` : ``}
      ${verborgen ? `<p class="muted" style="font-size:12px;margin-top:10px;">
        ${t(verborgen > 1 ? "acc.verborgenMeer" : "acc.verborgen", { n: verborgen })}
        <button class="btn btn-ghost btn-sm" onclick="go('archief')" style="margin-left:6px;">${t("acc.naarArchief")}</button>
      </p>` : ``}

      <div class="row" style="margin-top:20px;flex-wrap:wrap;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="go('shop')"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> ${t("acc.naarShop")}</button>
        <button class="btn btn-ghost btn-sm" onclick="go('instellingen')">${ic("gear")} ${t("acc.instellingen")}</button>
        <button class="btn btn-ghost btn-sm" onclick="window.__logout()">${t("nav.uitloggen")}</button>
      </div>
    </div>`;
}

/* Een setje samenstellen uit andere producten. */
function bundelAdminBlock(ed){
  const gekozen = Array.isArray(state.__draftBundel) ? state.__draftBundel
    : (Array.isArray(ed?.bundelVan) ? ed.bundelVan : []);
  const andere = (state.products || []).filter(p => p.id !== ed?.id && !Array.isArray(p.bundelVan));
  return `
    <details class="vak"${gekozen.length ? " open" : ""}>
      <summary>${ic("boxes-stacked")} Setje${gekozen.length ? ` <span class="badge">${gekozen.length}</span>` : ""}</summary>
      <div class="vak-body">
        <p class="muted" style="font-size:12px;line-height:1.65;margin:0 0 10px;">
          Vink aan wat er in dit setje zit. De prijs volgt uit wat je aanvinkt, min de korting
          hieronder — je hoeft er dus zelf geen prijs voor te verzinnen. De klant kiest voor elk
          stuk apart een kleur.
        </p>
        ${andere.length ? andere.map(p => `
          <label class="checkbox-row">
            <input type="checkbox" class="bundelvink" value="${esc(p.id)}" style="width:auto;margin:0;"

        <label class="field-label">Korting op het setje (%)</label>
        <input id="pBundelKorting" type="number" min="0" max="90" value="${esc(String(ed?.bundelKorting ?? 10))}" />
      </div>
    </details>`;
}

/* Het printbestand bij een product instellen. undefined = laten staan wat er
   staat, een lijst = vervangen, null = weghalen bij het opslaan. */
function printAdminBlock(ed){
  const bestaand = printBestanden(ed);
  const nieuw = state.__draftPrint;                  // undefined | File[] | null
  const toont = nieuw === undefined ? bestaand
    : nieuw === null ? []
    : nieuw.map(f => ({ name: f.name, size: f.size }));
  const weg = nieuw === null && bestaand.length;
  return `
    <details class="vak"${toont.length || weg ? " open" : ""}>
      <summary>
        ${ic("file-arrow-down")} Printbestand${toont.length ? ` <span class="badge">${toont.length}</span>` : ""}
      </summary>
      <div class="vak-body">
        <p class="muted" style="font-size:12px;line-height:1.65;margin:0 0 10px;">
          Het échte bestand om te printen — de STL of de 3mf zoals hij uit je ontwerpprogramma
          komt. Komt er een bestelling binnen, dan staat hij daar klaar om te downloaden.
          Alleen jij kunt erbij; klanten kunnen hem niet ophalen.
        </p>
        <p class="muted" style="font-size:12px;line-height:1.65;margin:0 0 10px;">
          Dit staat los van het 3D-voorbeeld hierboven: dat is uitgedund om snel te tonen,
          dit is het bestand op ware grootte. Meerdere mag — bijvoorbeeld een stuk per kleur.
          Maximaal ${MAX_PRINTBESTANDEN} bestanden van ${MAX_FIRESTORE_BYTES/1024/1024}MB.
        </p>
        <input type="file" id="pPrintFiles" accept=".stl,.3mf,.obj,.gcode,.zip" multiple style="display:none;" />
        ${toont.length ? `
          <div style="margin-bottom:10px;">
            ${toont.map((f, i) => `
              <div class="between" style="gap:10px;padding:8px 0;border-top:${i ? "1px solid var(--line)" : "none"};">
                <span style="min-width:0;font-size:13px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                  ${ic("file")} ${esc(f.name)}
                </span>
                <span class="muted font-mono" style="font-size:11px;flex-shrink:0;">${fmtBytes(f.bytes || f.size)}</span>
              </div>`).join("")}
          </div>` : ``}
        <div class="row" style="gap:8px;flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" id="pickPrintBtn">${ic("arrow-up-from-bracket")} Bestand kiezen</button>
          <span class="muted font-mono" style="font-size:11px;" id="printStand">${
            nieuw !== undefined && nieuw !== null ? "klaar om te bewaren"
            : weg ? "wordt verwijderd bij opslaan"
            : bestaand.length ? "staat er al"
            : "nog geen bestand"
          }</span>
          ${(toont.length || weg) ? `` : ``}
          ${(nieuw !== null && (bestaand.length || (nieuw && nieuw.length))) ? `
            <button class="btn btn-ghost btn-sm" id="wisPrintBtn" style="margin-left:auto;">${ic("trash")}</button>` : ``}
        </div>
      </div>
    </details>`;
}

/* =====================================================================
   Archief
   Alles blijft bewaard. Hier staat elke bestelling, ook wat uit het gewone
   overzicht is gehaald: op datum gesorteerd, doorzoekbaar op naam of nummer,
   en te filteren op status.
   ===================================================================== */
function archiefTotaal(){
  return state.profile?.isAdmin
    ? state.orders.length
    : state.orders.filter(o => o.uid === state.user?.uid).length;
}
function archiefRijen(){
  const zoek = (state.__archZoek || "").trim().toLowerCase();
  const status = state.__archStatus || "alles";
  const oud = state.__archOud === true;
  // Als beheerder staat hier alles; als klant alleen wat van jou is.
  const bron = state.profile?.isAdmin
    ? state.orders
    : state.orders.filter(o => o.uid === state.user?.uid);
  return bron
    .filter(o => status === "alles" ? true : o.status === status)
    .filter(o => {
      if (!zoek) return true;
      const hooi = [
        o.userEmail, orderNumber(o),
        ...(o.items || []).map(i => i.name),
        o.shippingAddress?.city, o.shippingAddress?.street,
      ].filter(Boolean).join(" ").toLowerCase();
      return hooi.includes(zoek);
    })
    .sort((a,b) => oud ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);
}
function viewArchief(){
  if (!state.user) return `<div style="padding:32px 0;"><p class="muted">${t("acc.nietIngelogd")}</p></div>`;
  const beheer = !!state.profile?.isAdmin;

  const status = state.__archStatus || "alles";
  return `
    <div style="padding:32px 0;">
      <button class="back" onclick="go('${beheer ? "admin" : "account"}')">${ic("arrow-left")} ${t("alg.terug")}</button>
      <h1 class="font-display" style="font-size:24px;margin:0 0 4px;">${t("nav.archief")}</h1>
      <p class="muted" style="font-size:13px;margin:0 0 18px;max-width:60ch;">

      <div class="cart-item" style="margin-bottom:14px;">

        <div class="fil-types" style="margin:0;">
          ${["alles", ...ORDER_STEPS].map(x=>`
            <button class="fil-type ${x===status?'active':''}" data-archstatus="${esc(x)}">${esc(x === "alles" ? t("shop.alles") : statusTekst(x))}</button>`).join("")}
        </div>
        <div class="between" style="margin-top:10px;">
          <span class="muted font-mono" style="font-size:11px;">${t("shop.vanTotaal", { n: rijen.length, t: archiefTotaal() })}</span>
          <button class="btn btn-ghost btn-sm" id="archSort">

          </button>
        </div>
        ${beheer && rijen.length ? `
          <div class="between" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
            <span class="muted" style="font-size:12px;">Proefbestellingen opruimen?</span>

      ${rijen.length ? rijen.map(o => `
        <div class="order-card" style="margin-bottom:10px;${(beheer ? o.hiddenForShop : o.hiddenForUser) ? "opacity:.6;" : ""}">

            </div>

              <span class="badge${o.receivedAt ? " badge-accent" : ""}">${esc(o.receivedAt ? t("order.ontvangen") : statusTekst(o.status))}</span>
              <div class="price" style="font-size:14px;">${fmtEUR(o.total)}</div>

            ${(beheer ? o.hiddenForShop : o.hiddenForUser) ? `
              <button class="detail-toggle" onclick="window.__unhideOrder('${o.id}','${beheer ? "shop" : "klant"}')">
                ${ic("eye")} ${t("arch.terugzetten")}
              </button>` : ``}
            ${beheer ? `
              <button class="detail-toggle" style="color:var(--muted);margin-left:auto;"
                      data-wisorder="${esc(o.id)}">${ic("trash")} Wissen</button>` : ``}

/* Wissen kan alleen hier, en alleen als beheerder: in het gewone overzicht
   berg je een bestelling op, hier haal je hem echt weg. Bedoeld om je eigen
   proefbestellingen op te ruimen — een echte bestelling hoor je te bewaren. */
window.__wisBestelling = async (id) => {
  try{
    await deleteDoc(doc(db, "orders", id));
    notify("Bestelling gewist");
  }catch(err){ notify("Wissen mislukt: " + firestoreHint(err)); }
};

function attachArchiefHandlers(){
  document.querySelectorAll('[data-wisorder]').forEach(b => {
    b.onclick = () => {
      if (!confirm("Deze bestelling definitief wissen? Dit kan niet ongedaan gemaakt worden.")) return;
      window.__wisBestelling(b.dataset.wisorder);
    };
  });
  const wisAlles = document.getElementById('wisAllesBtn');
  if (wisAlles) wisAlles.onclick = async () => {
    const lijst = archiefRijen();
    if (!confirm(`${lijst.length} bestelling${lijst.length === 1 ? "" : "en"} definitief wissen? Dit kan niet ongedaan gemaakt worden.`)) return;
    wisAlles.disabled = true;
    let fout = null, weg = 0;
    for (const o of lijst){
      try{ await deleteDoc(doc(db, "orders", o.id)); weg++; }
      catch(err){ fout = err; break; }
    }
    notify(fout ? `${weg} gewist, daarna mislukt: ${firestoreHint(fout)}`
                : `${weg} bestelling${weg === 1 ? "" : "en"} gewist`);
    wisAlles.disabled = false;
  };
  const z = document.getElementById('archZoek');
  if (z){
    z.oninput = () => {
      state.__archZoek = z.value;
      // alleen de lijst verversen, zodat de cursor in het zoekveld blijft staan
      const app = document.getElementById('app');
      const pos = z.selectionStart;
      app.innerHTML = viewArchief();
      attachArchiefHandlers();
      const n = document.getElementById('archZoek');
      if (n){ n.focus(); n.setSelectionRange(pos, pos); }
    };
  }
  document.querySelectorAll('[data-archstatus]').forEach(b=>{
    b.onclick = () => { state.__archStatus = b.dataset.archstatus; render(); };
  });
  const sort = document.getElementById('archSort');
  if (sort) sort.onclick = () => { state.__archOud = !state.__archOud; render(); };
}

const ORDER_STEPS = ["In verwerking", "Wordt geprint", "Verzonden", "Geleverd"];

/* "net binnen", "2 uur geleden", "gisteren" — dat leest sneller dan een datum
   met uren en minuten erbij. */
function hoeLang(t){
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 2) return "net binnen";
  if (m < 60) return m + " min geleden";
  const u = Math.round(m / 60);
  if (u < 24) return u + (u === 1 ? " uur geleden" : " uur geleden");
  const d = Math.round(u / 24);
  if (d === 1) return "gisteren";
  if (d < 8) return d + " dagen geleden";
  return new Date(t).toLocaleDateString('nl-BE', { day: 'numeric', month: 'long' });
}
/* Kopje boven een groepje bestellingen van dezelfde dag. */
function dagKop(t){
  const d = new Date(t); d.setHours(0,0,0,0);
  const vandaag = new Date(); vandaag.setHours(0,0,0,0);
  const verschil = Math.round((vandaag - d) / 864e5);
  if (verschil === 0) return "Vandaag";
  if (verschil === 1) return "Gisteren";
  return new Date(t).toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' });
}

/* =====================================================================
   Wat er per pakje moet gebeuren
   Een bestelling is meer dan een status: printen, nakijken, inpakken, label,
   wegbrengen. Die stappen vink je hier af, per bestelling. De status volgt
   vanzelf mee — vink je "verzonden" af, dan springt de bestelling mee op
   Verzonden en krijgt de klant zijn bericht.
   ===================================================================== */
const STANDAARD_STAPPEN = [
  { id: "gesneden",  naam: "Model klaargezet",     icoon: "layer-group" },
  { id: "geprint",   naam: "Geprint",              icoon: "print",       status: "Wordt geprint" },
  { id: "nagekeken", naam: "Nagekeken en bijgewerkt", icoon: "magnifying-glass" },
  { id: "ingepakt",  naam: "Ingepakt",             icoon: "box" },
  { id: "label",     naam: "Label geprint",        icoon: "tag" },
  { id: "weg",       naam: "Weggebracht",          icoon: "truck",       status: "Verzonden" },
];
function stappenVan(o){
  // afhalen hoeft geen label en gaat niet naar de post
  const uit = o.pickupAt ? ["label", "weg"] : [];
  const lijst = STANDAARD_STAPPEN.filter(st => !uit.includes(st.id));
  return o.pickupAt
    ? [...lijst, { id: "klaargezet", naam: "Klaargezet om af te halen", icoon: "shop", status: "Verzonden" }]
    : lijst;
}
function stapKlaar(o, id){ return !!(o.steps || {})[id]; }
function stappenTeller(o){
  const l = stappenVan(o);
  return { klaar: l.filter(st => stapKlaar(o, st.id)).length, totaal: l.length };
}
/* Bij een bestelling met zeven verschillende dingen print je stuk voor stuk.
   Daarom houdt elk onderdeel zijn eigen stand bij. Zijn ze allemaal geprint,
   dan vinkt de stap "Geprint" van de hele bestelling zichzelf af. */
function itemGeprint(o, idx){ return !!(o.printed || {})[idx]; }
function itemsGeprint(o){
  const n = (o.items || []).length;
  let k = 0;
  for (let i = 0; i < n; i++) if (itemGeprint(o, i)) k++;
  return { klaar: k, totaal: n };
}
window.__zetGeprint = async (orderId, idx, aan) => {
  const o = state.orders.find(x => x.id === orderId);
  if (!o) return;
  const printed = { ...(o.printed || {}) };
  if (aan) printed[idx] = true; else delete printed[idx];
  const patch = { printed };
  // alles geprint? dan hoort de stap van de bestelling ook aangevinkt te staan
  const alles = (o.items || []).every((_, i) => !!printed[i]);
  const steps = { ...(o.steps || {}) };
  if (alles) steps.geprint = true; else delete steps.geprint;
  patch.steps = steps;
  if (alles && ORDER_STEPS.indexOf("Wordt geprint") > ORDER_STEPS.indexOf(o.status)){
    patch.status = "Wordt geprint";
  }
  try{
    await updateDoc(doc(db, "orders", orderId), patch);
    // wat geprint is, is van de spoel; haal je het vinkje weg, dan komt het terug
    await boekFilamentAf(o.items[idx], aan ? 1 : -1);
  }
  catch(err){ notify("Bijwerken mislukt: " + err.message); }
};

window.__zetStap = async (orderId, stapId, aan) => {
  const o = state.orders.find(x => x.id === orderId);
  if (!o) return;
  const stap = stappenVan(o).find(st => st.id === stapId);
  const steps = { ...(o.steps || {}), [stapId]: aan };
  if (!aan) delete steps[stapId];
  const patch = { steps };
  // Hoort er een status bij deze stap, dan schuift die mee — maar nooit terug.
  if (aan && stap?.status && ORDER_STEPS.indexOf(stap.status) > ORDER_STEPS.indexOf(o.status)){
    patch.status = stap.status;
  }
  try{
    await updateDoc(doc(db, "orders", orderId), patch);
    if (patch.status === "Verzonden") mailVerzonden({ ...o, ...patch });
  }catch(err){ notify("Bijwerken mislukt: " + err.message); }
};

/* De lijst zit weggeklapt: opengeslagen bij elke bestelling maakt het
   overzicht onleesbaar. De kop zegt al hoe ver je bent. */
function stappenBlok(o){
  const lijst = stappenVan(o);
  const t = stappenTeller(o);
  const af = t.klaar === t.totaal;
  const open = state.__openStappen === o.id;
  return `
    <details class="stappen${af ? " af" : ""}"${open ? " open" : ""} data-stapvak="${esc(o.id)}">
      <summary>
        <span class="stap-vink${af ? " ja" : ""}">${af ? ic("check") : ""}</span>
        <span style="font-size:13px;font-weight:600;">
          ${af ? "Alles gedaan" : `${t.klaar} van ${t.totaal} gedaan`}
        </span>
        <span class="stappen-balk"><span style="width:${Math.round(t.klaar / t.totaal * 100)}%;"></span></span>
      </summary>
      <div class="stappen-body">
        ${lijst.map(st => {
          const ja = stapKlaar(o, st.id);
          return `
            <button class="stap${ja ? " ja" : ""}" data-stap="${esc(o.id)}|${esc(st.id)}">
              <span class="stap-vink">${ja ? ic("check") : ""}</span>
              ${ic(st.icoon)}
              <span>${esc(st.naam)}</span>
            </button>`;
        }).join("")}
      </div>
    </details>`;
}

/* Eén regel per besteld ding. Dicht zie je waar het over gaat; klap je hem
   open, dan staat er alles bij wat je nodig hebt om het te printen — élke
   gekozen kleur, de maat, het gewicht, en de bestanden.

   Vroeger stond hier alleen `filament`. Bij een model met kleurvakken is dat
   de kleur van het eerste vak, dus zag je er maar één van de drie. */
function kleurRegel(f, kop){
  return `
    <div class="detail-regel">
      <span class="sleutel">${esc(kop)}</span>
      <span class="waarde">
        <span class="fil-chip ${finishClass(f.finish)}" style="background-color:${esc(f.hex || "#888")};"></span>
        <span>${esc([f.type, f.name].filter(Boolean).join(" · "))}</span>
      </span>
    </div>`;
}
/* "0.0 MB" bij een bestand van een halve megabyte leest als leeg. */
function fmtBytes(n){
  const b = Number(n) || 0;
  return b >= 1048576 ? (b / 1048576).toFixed(1) + " MB"
    : b >= 1024 ? Math.round(b / 1024) + " KB"
    : b + " B";
}

/* Het printbestand dat bij dit besteld ding hoort, klaar om te downloaden.
   Dat is het bestand van het product zelf — bij een eigen opdracht van een
   klant staan de bestanden al bij "Onderdelen" hieronder. */
function printRegel(i){
  if (i.kind === "custom") return ``;
  const p = state.products.find(x => x.id === (i.productId || i.id));
  if (!p){
    return `<div class="detail-regel"><span class="sleutel">Bestand</span>
      <span class="waarde muted">Dit product staat niet meer in de collectie</span></div>`;
  }
  const files = printBestanden(p);
  if (!files.length){
    return `<div class="detail-regel"><span class="sleutel">Bestand</span>
      <span class="waarde muted" style="flex-direction:column;align-items:flex-start;gap:4px;">
        <span>Er hangt nog geen printbestand aan dit product.</span>
        <button class="detail-toggle" onclick="window.__editProduct('${esc(p.id)}')">Zet er een bij</button>
      </span></div>`;
  }
  return `
    <div class="detail-regel" style="align-items:flex-start;">
      <span class="sleutel">Bestand</span>
      <span class="waarde" style="flex-direction:column;align-items:stretch;gap:6px;">
        ${files.map((f, n) => `
          <button class="btn btn-ghost btn-sm" style="justify-content:flex-start;"
                  data-file="${esc(p.id)}" data-hok="products" data-index="${n}"
                  data-chunks="${f.chunks}" data-gz="0" data-bytes="${f.bytes || 0}"
                  data-sha="${esc(f.sha || '')}" data-name="${esc(f.name || 'model.stl')}"
                  title="${esc(f.name || '')}${f.sha ? ' · SHA-256 ' + f.sha.slice(0,12) : ''}">
            ${ic("download")} ${esc(f.name)}
            <span class="muted font-mono" style="font-size:10px;margin-left:auto;">${fmtBytes(f.bytes || f.size)}</span>
          </button>`).join("")}
      </span>
    </div>`;
}

function bestelRegel(o, i, idx){
  const sleutel = o.id + "|" + idx;
  const open = state.__openRegel === sleutel;
  const beheer = !!state.profile?.isAdmin;
  const geprint = itemGeprint(o, idx);
  const vakken = Array.isArray(i.colorChoices) ? i.colorChoices : [];
  const delen = Array.isArray(i.jobParts) ? i.jobParts : [];
  const bolletjes = (vakken.length ? vakken : (i.filament ? [i.filament] : []))
    .slice(0, 6)
    .map(f => `<span class="fil-chip ${finishClass(f.finish)}" style="width:18px;height:18px;border-radius:6px;background-color:${esc(f.hex || "#888")};flex-shrink:0;"></span>`)
    .join("");

/* =====================================================================
   De productlijst in Shopbeheer
   Met vier producten scrol je er zo langs, met dertig niet meer. Zoeken werkt
   zoals bij de klant: elk los woord moet ergens voorkomen. Wat je aanvinkt
   onthouden we los van de lijst, zodat een selectie een filter overleeft.
   ===================================================================== */
function beheerProducten(){
  const zoek = (state.__pZoek || "").trim().toLowerCase();
  const lijst = eigenVolgorde(state.products || []);
  if (!zoek) return lijst;
  return lijst.filter(p => {
    const hooi = [p.name, p.description, p.category, p.material, p.color].filter(Boolean).join(" ").toLowerCase();
    return zoek.split(/\s+/).every(w => hooi.includes(w));
  });
}
/* De volgorde die jij zelf sleepte. Een product zonder volgnummer is nieuw en
   hoort vooraan, want daar ben je net mee bezig. */
function eigenVolgorde(lijst){
  return [...lijst].sort((a, b) => {
    const va = Number.isFinite(a.volgorde) ? a.volgorde : -1;
    const vb = Number.isFinite(b.volgorde) ? b.volgorde : -1;
    if (va !== vb) return va - vb;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
}

/* =====================================================================
   Wat heb je deze maand verdiend
   Omzet alleen zegt niet zo veel: er gaat filament in, en de verzending die je
   aan de klant aanrekent gaat gewoon door naar de post. Hier staat wat er
   binnenkwam, wat het plastic ongeveer gekost heeft en wat er dus overblijft.
   Het is een schatting — het gewicht van een print kennen we bij benadering en
   de verzendkosten die jij écht betaalt kunnen anders liggen. Daarom staat dat
   er ook bij: een cijfer waarvan je denkt dat het exact is, is gevaarlijker
   dan een cijfer waarvan je weet dat het een schatting is.
   ===================================================================== */
function maandGrens(terug){
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(1);
  d.setMonth(d.getMonth() - terug);
  return d.getTime();
}
function filamentKost(o){
  let kost = 0;
  for (const i of (o.items || [])){
    const gram = itemGram(i) * (i.qty || 1);
    if (!gram) continue;
    const kleuren = itemKleuren(i);
    // de kiloprijs van wat er gekozen is; kennen we die niet, dan de standaard
    const perKilo = kleuren.length
      ? kleuren.reduce((s, f) => s + kiloPrijs(findFilament(f.id) || f), 0) / kleuren.length
      : pricing().pricePerKg;
    kost += gram / 1000 * perKilo;
  }
  return kost;
}
function maandTelling(van, tot){
  const rijen = (state.orders || []).filter(o => o.createdAt >= van && o.createdAt < tot);
  const omzet = rijen.reduce((s, o) => s + (o.total || 0), 0);
  const verzend = rijen.reduce((s, o) => s + (o.shippingCost || 0), 0);
  const korting = rijen.reduce((s, o) => s + (o.discountAmount || 0), 0);
  const plastic = rijen.reduce((s, o) => s + filamentKost(o), 0);
  const gram = rijen.reduce((s, o) => s + (o.items || [])
    .reduce((g, i) => g + itemGram(i) * (i.qty || 1), 0), 0);
  return { n: rijen.length, omzet, verzend, korting, plastic, gram, over: omzet - verzend - plastic };
}
function maandNaam(t){
  return new Date(t).toLocaleDateString('nl-BE', { month: 'long', year: 'numeric' });
}
function maandCijfers(){
  const nu = maandGrens(0), vorigVan = maandGrens(1);
  const deze = maandTelling(nu, Date.now() + 1);
  const vorige = maandTelling(vorigVan, nu);
  if (!deze.n && !vorige.n) return ``;
  const pijl = (a, b) => {
    if (!b) return ``;
    const pct = Math.round((a - b) / b * 100);
    if (!isFinite(pct) || pct === 0) return `<span class="muted" style="font-size:11px;">gelijk aan vorige maand</span>`;
    return `<span style="font-size:11px;color:${pct > 0 ? "var(--accent)" : "var(--muted)"};">
      ${pct > 0 ? "▲" : "▼"} ${Math.abs(pct)}% tegenover vorige maand</span>`;
  };
  const regel = (kop, waarde, extra) => `
    <div class="kv"><span>${esc(kop)}</span><span class="font-mono">${waarde}${
      extra ? `<span class="muted" style="font-weight:400;"> ${extra}</span>` : ``}</span></div>`;
  return `
    <details class="vak" style="margin-bottom:12px;"${deze.n ? " open" : ""}>
      <summary>${ic("euro-sign")} Deze maand <span class="badge">${fmtEUR(deze.over)}</span></summary>
      <div class="vak-body">
        <p class="muted" style="font-size:12px;line-height:1.65;margin:0 0 10px;">
          ${esc(maandNaam(nu))} — ${deze.n} ${deze.n === 1 ? "bestelling" : "bestellingen"}.
          ${pijl(deze.omzet, vorige.omzet)}
        </p>
        ${regel("Omzet", fmtEUR(deze.omzet))}
        ${deze.korting ? regel("Waarvan korting gegeven", "−" + fmtEUR(deze.korting)) : ``}
        ${regel("Verzending doorbetaald", "−" + fmtEUR(deze.verzend))}
        ${regel("Filament", "−" + fmtEUR(deze.plastic), `≈ ${Math.round(deze.gram)} g`)}
        <div class="kv" style="border-top:1px solid var(--line-strong);margin-top:6px;padding-top:8px;">
          <span style="font-weight:600;">Blijft over</span>
          <span class="font-mono" style="font-weight:600;color:var(--accent);">${fmtEUR(deze.over)}</span>
        </div>
        ${vorige.n ? `
          <p class="muted" style="font-size:12px;line-height:1.65;margin:10px 0 0;">
            ${esc(maandNaam(vorigVan))}: ${fmtEUR(vorige.omzet)} omzet, ${fmtEUR(vorige.over)} over
            uit ${vorige.n} ${vorige.n === 1 ? "bestelling" : "bestellingen"}.
          </p>` : ``}
        <p class="muted" style="font-size:11.5px;line-height:1.65;margin:10px 0 0;">
          Een schatting. Het gewicht van een print kennen we bij benadering, en wat de post
          jou aanrekent kan afwijken van wat de klant betaalde. Machinetijd en stroom zitten
          er niet in.
        </p>
      </div>
    </details>`;
}

function attachFilamentHandlers(){
  const reset = document.getElementById('resetFilamentsBtn');
  if (reset) reset.onclick = async () => {
    reset.disabled = true;
    try{ await saveFilaments(buildDefaultFilaments()); notify("Catalogus geladen"); }
    catch(err){ notify("Mislukt: " + err.message); reset.disabled = false; }
  };

  document.querySelectorAll('[data-filtoggle]').forEach(btn=>{
    btn.onclick = async () => {
      const items = (state.filaments || []).map(f =>
        f.id === btn.dataset.filtoggle ? { ...f, enabled: !f.enabled } : f);
      state.filaments = items;                       // meteen zichtbaar
      btn.classList.toggle('on');
      try{ await saveFilaments(items); }catch(err){ notify("Opslaan mislukt: " + err.message); }
    };
  });

  document.querySelectorAll('[data-filtypetoggle]').forEach(btn=>{
    btn.onclick = async () => {
      const on = btn.dataset.target === 'on';
      const items = (state.filaments || []).map(f =>
        f.type === btn.dataset.filtypetoggle ? { ...f, enabled: on } : f);
      try{ await saveFilaments(items); }catch(err){ notify("Opslaan mislukt: " + err.message); }
    };
  });

  document.querySelectorAll('.kgfield').forEach(el=>{
    el.onchange = async () => {
      const v = parseFloat(el.value);
      if (!isFinite(v) || v < 0){ notify("Vul een geldig bedrag in"); return; }
      const items = (state.filaments || []).map(f =>
        f.type === el.dataset.type ? { ...f, pricePerKg: v } : f);
      try{ await saveFilaments(items); notify(`${el.dataset.type}: ${fmtEUR(v)} per kilo`); }
      catch(err){ notify("Opslaan mislukt: " + err.message); }
    };
  });

  document.querySelectorAll('.gramfield').forEach(el=>{
    el.onchange = async () => {
      const leeg = el.value.trim() === "";
      const v = parseFloat(el.value);
      if (!leeg && (!isFinite(v) || v < 0)){ notify("Vul een aantal gram in, of laat het leeg"); return; }
      const items = (state.filaments || []).map(f => {
        if (f.id !== el.dataset.fil) return f;
        const kopie = { ...f };
        // leeg betekent: ik houd dit niet bij. Dan hoort het veld ook echt weg
        // te zijn, niet op nul te staan — nul is "op" en dat is iets anders.
        if (leeg) delete kopie.voorraad; else kopie.voorraad = v;
        return kopie;
      });
      try{ await saveFilaments(items); }
      catch(err){ notify("Opslaan mislukt: " + err.message); }
    };
  });

  document.querySelectorAll('[data-fildelete]').forEach(btn=>{
    btn.onclick = async () => {
      const items = (state.filaments || []).filter(f => f.id !== btn.dataset.fildelete);
      try{ await saveFilaments(items); notify("Filament verwijderd"); }
      catch(err){ notify("Verwijderen mislukt: " + err.message); }
    };
  });

  const add = document.getElementById('addFilamentBtn');
  if (add) add.onclick = async () => {
    const v = id => (document.getElementById(id)?.value || "").trim();
    const type = v('nfType'), name = v('nfName');
    let hex = v('nfHex');
    if (!type || !name){ notify("Vul type en kleurnaam in"); return; }
    if (!hex.startsWith("#")) hex = "#" + hex;
    if (!/^#[0-9a-f]{6}$/i.test(hex)){ notify("Gebruik een kleurcode als #00AE42"); return; }
    const id = slug(type) + "--" + slug(name);
    if ((state.filaments || []).some(f => f.id === id)){ notify("Dat filament staat er al in"); return; }
    const items = [...(state.filaments || []), {
      id, type, name, hex: hex.toUpperCase(), finish: v('nfFinish') || "basic",
      enabled: true, custom: true,
    }];
    try{ await saveFilaments(items); notify("Filament toegevoegd"); }
    catch(err){ notify("Opslaan mislukt: " + err.message); }
  };
}

/* Het model moet er weer uit kunnen om te printen. Staat het in Storage, dan
   is er een gewone link; staat het in Firestore, dan zetten we de stukken
   hier weer aan elkaar. */
function jobFileButton(item, part){
  if (part.storageUrl){
    return `<a class="btn btn-ghost btn-sm" href="${esc(part.storageUrl)}" target="_blank" rel="noopener" download>
      ${ic("download")} Bestand</a>`;
  }
  if (part.storage?.kind === "firestore" && item.uploadId){
    return `<button class="btn btn-ghost btn-sm" data-file="${esc(item.uploadId)}"
      data-index="${part.index}" data-chunks="${part.storage.chunks}"
      data-gz="${part.storage.gz ? 1 : 0}" data-bytes="${part.storage.bytes || 0}"
      data-sha="${esc(part.storage.sha || '')}" data-name="${esc(part.fileName || 'model.stl')}"
      title="${esc(part.fileName || '')}${part.storage.sha ? ' · SHA-256 ' + part.storage.sha.slice(0,12) : ''}">
      ${ic("download")} Bestand</button>`;
  }
  return ``;
}
function attachFileHandlers(){
  document.querySelectorAll('[data-file]').forEach(btn=>{
    btn.onclick = async () => {
      const was = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `${ic("spinner")} Ophalen…`;
      try{
        await downloadStoredFile(btn.dataset.file, +btn.dataset.index, {
          chunks: +btn.dataset.chunks,
          gz: btn.dataset.gz === "1",
          bytes: +btn.dataset.bytes || 0,
          sha: btn.dataset.sha || null,
        }, btn.dataset.name, btn.dataset.hok || "uploads");
      }catch(err){ notify("Ophalen mislukt: " + err.message); }
      finally{ btn.disabled = false; btn.innerHTML = was; }
    };
  });
}

/* Elk onderdeel van het beheer heeft zijn eigen scherm met een eigen
   opslaanknop. Vroeger hing alles onder Prijzen: e-mail, afhalen en codes
   erbij, met één knop onderaan die je makkelijk over het hoofd zag. */
/* =====================================================================
   Wat moet er op de printer
   Je werkt niet per bestelling, je werkt per kleur: één keer filament wisselen
   en dan alles printen wat die kleur nodig heeft. Dit scherm draait de zaak
   dus om — het loopt over álle openstaande bestellingen heen en groepeert wat
   er nog geprint moet worden op de kleuren die het vraagt. Daarna kijkt het of
   er stukken samen op één plaat passen, want dat scheelt hele printbeurten.
   Afvinken doe je hier ook; dat werkt door naar de bestelling zelf.
   ===================================================================== */

/* Welke filamenten dit besteld stuk nodig heeft. */
function itemKleuren(i){
  const vakken = Array.isArray(i.colorChoices) ? i.colorChoices : [];
  if (vakken.length) return vakken;
  const delen = Array.isArray(i.jobParts) ? i.jobParts : [];
  if (delen.length){
    const uniek = new Map();
    for (const j of delen) if (j.filament) uniek.set(j.filament.id || j.filament.name, j.filament);
    if (uniek.size) return [...uniek.values()];
  }
  return i.filament ? [i.filament] : [];
}
/* Twee stukken horen bij elkaar als ze precies dezelfde kleuren vragen. */
function kleurSleutel(kleuren){
  if (!kleuren.length) return "?";
  return kleuren.map(f => f.id || `${f.type || ""}·${f.name || ""}`).sort().join(" + ");
}
function kleurNaam(kleuren){
  if (!kleuren.length) return "Kleur nog onbekend";
  return kleuren.map(f => [f.type, f.name].filter(Boolean).join(" ")).join(" + ");
}

/* De echte maat van een besteld stuk, in millimeter. Bij maatwerk staat ze in
   de bestelling; anders komt ze uit het 3D-model dat bij het product hoort, en
   als laatste redmiddel uit wat je zelf bij afmetingen getypt hebt. */
function maatUitTekst(t){
  if (!t) return null;
  const g = (String(t).match(/\d+(?:[.,]\d+)?/g) || []).map(v => parseFloat(v.replace(",", ".")));
  if (g.length >= 3) return g.slice(0, 3);
  // "Ø 90 x 180 mm": een doorsnede en een hoogte
  if (g.length === 2 && /ø|⌀|diam|^\s*o\s/i.test(String(t))) return [g[0], g[0], g[1]];
  return null;
}
function itemMaat(i){
  if (Array.isArray(i.dims) && i.dims.length === 3) return i.dims.map(Number);
  const p = state.products.find(x => x.id === (i.productId || i.id));
  if (Array.isArray(p?.modelSize) && p.modelSize.length === 3) return p.modelSize.map(Number);
  return maatUitTekst(p?.dimensions);
}
/* Het gewicht van één stuk, zo goed als we het weten. */
function itemGram(i){
  if (i.grams) return Number(i.grams);
  const p = state.products.find(x => x.id === (i.productId || i.id));
  return Number(p?.weight) || 0;
}
/* De printtijd. Bij maatwerk en eigen modellen staat ze in seconden in de
   bestelling; bij een gewoon product heb je zelf iets als "5u 40m" of "38m"
   ingetypt. Zonder dit las de printlijst overal nul. */
function tijdUitTekst(t){
  if (!t) return 0;
  const s = String(t).toLowerCase();
  const uur = s.match(/(\d+(?:[.,]\d+)?)\s*(?:u|h)/);
  const min = s.match(/(\d+(?:[.,]\d+)?)\s*m/);
  let sec = 0;
  if (uur) sec += parseFloat(uur[1].replace(",", ".")) * 3600;
  if (min) sec += parseFloat(min[1].replace(",", ".")) * 60;
  // alleen een getal, zonder eenheid: dan zijn het minuten
  if (!uur && !min){
    const n = s.match(/\d+(?:[.,]\d+)?/);
    if (n) sec = parseFloat(n[0].replace(",", ".")) * 60;
  }
  return Math.round(sec);
}
function itemTijd(i){
  if (i.printTime) return Number(i.printTime);
  const p = state.products.find(x => x.id === (i.productId || i.id));
  return tijdUitTekst(p?.printTime);
}

/* Hoe leg je een stapel stukken op zo weinig mogelijk platen?
   Een eenvoudige planken-indeling: leg het diepste stuk eerst, vul de rij naar
   rechts aan tot ze vol is, begin dan een nieuwe rij erboven, en pas als de
   plaat vol is een nieuwe plaat. Dat is niet de allerbeste indeling die
   bestaat, maar wel eentje die klopt: wat hier op één plaat staat, past er ook
   echt op. Beloven dat er meer op past dan waar is, zou erger zijn. */
const PLAAT_RAND = 5;        // marge tot de rand van de plaat
const PLAAT_TUSSEN = 4;      // ruimte tussen twee stukken
function plaatIndeling(stukken){
  const bx = PLATE.x - 2 * PLAAT_RAND, by = PLATE.y - 2 * PLAAT_RAND;
  const teGroot = [], lijst = [];
  for (const s of stukken){
    // liggend met de lange kant mee bespaart plaats
    const w = Math.max(s.w, s.d), d = Math.min(s.w, s.d);
    if (w > bx || d > by) teGroot.push(s); else lijst.push({ ...s, w, d });
  }
  lijst.sort((a, b) => b.d - a.d);
  const platen = [];
  for (const s of lijst){
    let gezet = false;
    for (const plaat of platen){
      for (const rij of plaat.rijen){
        if (rij.breed + PLAAT_TUSSEN + s.w <= bx){
          rij.breed += PLAAT_TUSSEN + s.w;
          rij.stukken.push(s);
          gezet = true; break;
        }
      }
      if (gezet) break;
      const hoog = plaat.rijen.reduce((h, r) => h + r.diep + PLAAT_TUSSEN, 0);
      if (hoog + s.d <= by){
        plaat.rijen.push({ diep: s.d, breed: s.w, stukken: [s] });
        gezet = true; break;
      }
    }
    if (!gezet) platen.push({ rijen: [{ diep: s.d, breed: s.w, stukken: [s] }] });
  }
  return { platen, teGroot };
}

/* Welke kleurgroep er nú op de printer ligt. Eén kleur tegelijk, dus één
   waarde volstaat. Het staat bij de winkelinstellingen zodat het je herlaad-
   beurt en je telefoon overleeft — je zet hem aan in de keuken en kijkt later
   op je gsm of hij al klaar was. */
const opDePrinter = () => winkel().opDePrinter || null;
window.__zetOpDePrinter = async (sleutel) => {
  const nu = opDePrinter() === sleutel ? null : sleutel;
  state.winkel = { ...(state.winkel || DEFAULT_WINKEL), opDePrinter: nu };
  render();
  try{ await updateDoc(WINKEL_DOC(), { opDePrinter: nu }); }
  catch(err){
    // het document bestaat misschien nog niet; dan schrijven we het in zijn geheel
    try{ await saveWinkel({ ...winkel(), opDePrinter: nu }); }
    catch(e){ notify("Niet bewaard: " + firestoreHint(e)); }
  }
};

/* Alles wat nog geprint moet worden, gegroepeerd op de kleuren die het vraagt. */
function printRij(){
  const groepen = new Map();
  const open = (state.orders || [])
    .filter(o => o.status !== "Geleverd" && !o.hiddenForShop)
    .sort((a, b) => a.createdAt - b.createdAt);        // oudste eerst: die wacht het langst
  for (const o of open){
    (o.items || []).forEach((i, idx) => {
      if (itemGeprint(o, idx)) return;
      const kleuren = itemKleuren(i);
      const sleutel = kleurSleutel(kleuren);
      if (!groepen.has(sleutel)) groepen.set(sleutel, { sleutel, kleuren, stukken: [], qty: 0, gram: 0, tijd: 0 });
      const g = groepen.get(sleutel);
      const maat = itemMaat(i);
      g.stukken.push({ order: o, item: i, idx, maat });
      g.qty += i.qty || 1;
      g.gram += itemGram(i) * (i.qty || 1);
      g.tijd += itemTijd(i) * (i.qty || 1);
    });
  }
  // meeste werk bovenaan: daar valt de meeste tijd te winnen door te bundelen
  return [...groepen.values()].sort((a, b) => b.qty - a.qty);
}

function viewPrintQueue(){
  const groepen = printRij();
  const stuks = groepen.reduce((s, g) => s + g.qty, 0);
  const tijd = groepen.reduce((s, g) => s + g.tijd, 0);
  const gram = groepen.reduce((s, g) => s + g.gram, 0);
  if (!groepen.length){
    return `
      <div class="paneel-kop">
        <h2>Op de printer</h2>
        <p>Alles wat nog geprint moet worden, gegroepeerd per kleur.</p>
      </div>

        <p style="font-size:14px;line-height:1.65;margin:0;">${ic("circle-check")} Er staat niets meer te wachten. Alles is geprint.</p>
      </div>`;
  }
  return `
    <div class="paneel-kop">
      <h2>Op de printer</h2>
      <p>Alles wat nog geprint moet worden, over alle bestellingen heen en gegroepeerd
         op de kleuren die het vraagt. Werk een groep af, wissel één keer van filament,
         en ga door naar de volgende. Wat je hier afvinkt, staat ook bij de bestelling zelf.</p>
    </div>

    <div class="kpi-grid" style="margin-bottom:14px;">
      <div class="kpi${stuks ? " let" : ""}"><div class="cijfer">${stuks}</div><div class="naam">te printen</div></div>
      <div class="kpi"><div class="cijfer">${groepen.length}</div><div class="naam">${groepen.length === 1 ? "kleurwissel" : "kleurwissels"}</div></div>
      <div class="kpi"><div class="cijfer">${esc(fmtDuration(tijd))}</div><div class="naam">printtijd</div></div>
      <div class="kpi"><div class="cijfer">${Math.round(gram)} g</div><div class="naam">filament</div></div>
    </div>

    ${groepen.map((g, n) => printGroep(g, n)).join("")}`;
}

function printGroep(g, n){
  // stukken met een bekende maat kunnen we indelen; de rest noemen we apart
  const metMaat = [], zonderMaat = [];
  for (const s of g.stukken){
    for (let k = 0; k < (s.item.qty || 1); k++){
      const naam = `${esc(s.item.name)}`;
      if (s.maat) metMaat.push({ naam, w: s.maat[0], d: s.maat[1] });
      else zonderMaat.push(naam);
    }
  }
  const indeling = metMaat.length ? plaatIndeling(metMaat) : null;
  const platen = indeling?.platen || [];
  const samen = platen.length && platen[0].rijen.reduce((n2, r) => n2 + r.stukken.length, 0);
  const bezig = opDePrinter() === g.sleutel;
  return `
    <details class="bestelvak${bezig ? " nubezig" : ""}"${n === 0 || bezig ? " open" : ""}>
      <summary class="bestelvak-kop">
        <span class="row" style="gap:5px;flex-shrink:0;">
          ${g.kleuren.slice(0, 4).map(f => `
            <span class="fil-chip ${finishClass(f.finish)}" style="width:22px;height:22px;border-radius:7px;background-color:${esc(f.hex || "#888")};"></span>`).join("")
            || `<span class="fil-chip" style="width:22px;height:22px;border-radius:7px;background:var(--surface2);"></span>`}
        </span>
        <span class="bestelvak-wie">
          <span class="bestelvak-mail">${esc(kleurNaam(g.kleuren))}${
            bezig ? ` <span class="nu-vlag">NU OP DE PRINTER</span>` : ``}</span>
          <span class="muted font-mono" style="font-size:11px;">
            ${g.qty} ${g.qty === 1 ? "stuk" : "stuks"} · ${esc(fmtDuration(g.tijd))} · ${Math.round(g.gram)} g
          </span>

function plaatAdvies(indeling, samen){
  const { platen, teGroot } = indeling;
  if (!platen.length && !teGroot.length) return ``;
  return `
    <div class="cart-item" style="padding:12px 13px;margin:2px 0 0;">
      <p style="font-size:13px;line-height:1.6;margin:0 0 ${platen.length ? "8px" : "0"};">
        ${ic("layer-group")}
        ${platen.length === 1
          ? `Deze ${samen} ${samen === 1 ? "gaat" : "passen samen"} op <strong>één plaat</strong>.`
          : `Dit vraagt <strong>${platen.length} platen</strong> — de eerste met ${samen} ${samen === 1 ? "stuk" : "stuks"}.`}
      </p>
      ${platen.map((plaat, i) => {
        const namen = plaat.rijen.flatMap(r => r.stukken.map(s => s.naam));
        return `<p class="muted" style="font-size:12px;line-height:1.65;margin:0 0 3px;">
          <strong>Plaat ${i + 1}</strong> — ${namen.join(", ")}
        </p>`;
      }).join("")}
      ${teGroot.length ? `
        <p style="font-size:12px;line-height:1.65;margin:8px 0 0;color:var(--accent);">
          ${ic("triangle-exclamation")} ${teGroot.length} ${teGroot.length === 1 ? "stuk past" : "stuks passen"}
          niet op de plaat van ${PLATE.x} mm. Kijk die apart na.
        </p>` : ``}
    </div>`;
}

function attachPrintQueueHandlers(){
  document.querySelectorAll('[data-qprint]').forEach(b => {
    b.onclick = () => {
      const [orderId, idx] = b.dataset.qprint.split("|");
      const o = state.orders.find(x => x.id === orderId);
      if (!o) return;
      window.__zetGeprint(orderId, +idx, !itemGeprint(o, +idx));
    };
  });
  document.querySelectorAll('[data-bezig]').forEach(b => {
    b.onclick = () => window.__zetOpDePrinter(b.dataset.bezig);
  });
}

function attachWinkelHandlers(){
  const btn = document.getElementById('saveWinkelBtn');
  if (!btn) return;
  btn.onclick = async () => {
    const val = id => (document.getElementById('wk_' + id)?.value || "").trim();
    const uit = {};
    for (const [id] of WINKEL_VELDEN) uit[id] = val(id);
    uit.retourdagen = Math.max(0, Math.min(90, parseInt(val('retourdagen'), 10) || 14));
    uit.beheerders = val('beheerders').split(/[,;\s]+/)
      .map(e => e.trim().toLowerCase())
      .filter(e => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))
      .filter(e => e !== HOOFD_BEHEERDER);
    uit.taal = document.getElementById('wk_taal')?.value || STANDAARDTAAL;
    // Dit document wordt in zijn geheel weggeschreven, dus wat niet in dit
    // formulier staat moet je hier meenemen — anders vergeet de shop bij het
    // opslaan van je adres welke kleur er op de printer ligt.
    uit.opDePrinter = winkel().opDePrinter || null;
    uit.pauze = !!document.getElementById('wk_pauze')?.checked;
    uit.pauzeBericht = val('pauzeBericht');
    uit.pauzeTot = val('pauzeTot');
    uit.pauzeBestellen = !!document.getElementById('wk_pauzeBestellen')?.checked;
    if (!uit.naam) uit.naam = DEFAULT_WINKEL.naam;
    btn.disabled = true;
    try{
      await saveWinkel(uit);
      state.winkel = uit;
      notify("Winkelgegevens bewaard");
      render();
    }catch(err){ notify("Opslaan mislukt: " + firestoreHint(err)); btn.disabled = false; }
  };
}

function renderImageTray(){
  const tray = document.getElementById('imgTray');
  if (!tray) return;
  const imgs = state.__draftImages || [];
  tray.innerHTML = imgs.map((src,i)=>`
    <div class="img-slot" draggable="true" data-img-i="${i}">
      <img src="${esc(src)}" alt="Afbeelding ${i+1}" />
      ${i === 0 ? `<span class="img-eerste">EERSTE</span>` : ``}
      <button onclick="window.__removeDraftImage(${i})" title="Verwijderen"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>`).join("")
    + (imgs.length < MAX_PRODUCT_IMAGES ? `<button class="img-add" id="pickImgBtn" title="Afbeelding kiezen"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>` : ``);
  const pick = document.getElementById('pickImgBtn');
  if (pick) pick.onclick = () => document.getElementById('pImgFile').click();

  /* Slepen om de volgorde te wijzigen. De eerste foto is wat een klant op de
     kaart in de collectie ziet, dus welke vooraan staat maakt uit — en die
     kiezen door te herhalen wat je uploadt is geen manier van werken. */
  tray.querySelectorAll('[data-img-i]').forEach(slot => {
    slot.ondragstart = (e) => {
      state.__sleepImg = +slot.dataset.imgI;
      slot.classList.add('sleept');
      try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", slot.dataset.imgI); }catch(err){}
    };
    slot.ondragend = () => {
      slot.classList.remove('sleept');
      tray.querySelectorAll('.sleepdoel').forEach(x => x.classList.remove('sleepdoel'));
    };
    slot.ondragover = (e) => {
      if (state.__sleepImg === null || state.__sleepImg === undefined) return;
      if (state.__sleepImg === +slot.dataset.imgI) return;
      e.preventDefault();
      slot.classList.add('sleepdoel');
    };
    slot.ondragleave = () => slot.classList.remove('sleepdoel');
    slot.ondrop = (e) => {
      e.preventDefault();
      const van = state.__sleepImg, naar = +slot.dataset.imgI;
      state.__sleepImg = null;
      if (van === null || van === undefined || van === naar) return;
      const lijst = state.__draftImages;
      lijst.splice(naar, 0, ...lijst.splice(van, 1));
      renderImageTray();
    };
  });
}

/* Leest de maatwerkinstellingen uit het beheerformulier. */
function sizingFromForm(){
  if (!document.getElementById('pSizing')?.checked) return { enabled: false };
  const trio = key => [0,1,2].map(i =>
    parseInt(document.querySelector(`.sz[data-sz="${key}"][data-i="${i}"]`)?.value, 10) || 0);
  const num = (id, d) => { const v = parseInt(document.getElementById(id)?.value, 10); return isFinite(v) ? v : d; };
  return {
    enabled: true,
    def: trio('def'), min: trio('min'), max: trio('max'),
    solidity: Math.min(100, Math.max(1, num('pSolidity', 35))),
    infill: Math.min(100, Math.max(0, num('pSizeInfill', 20))),
    layerHeight: document.getElementById('pSizeLayer')?.value || "0.20mm",
  };
}

/* Het productformulier wordt opnieuw getekend zodra je een kleurvak toevoegt
   of een model kiest. Zonder dit was je dan kwijt wat je al ingetypt had. */
const PRODUCT_VELDEN = ['pName','pPrice','pDesc','pPersLabel','pPersHint','pPersMax','pPersPrijs','pBundelKorting','pCategory','pColor','pMaterial',
  'pInfill','pLayer','pDim','pTime','pWeight','pDiscount','pDiscountUntil',

  const d = state.__draftProduct;

    el.addEventListener('input', () => {
      (state.__draftProduct ||= {})[id] = el.value;
    });

     waar je het loslaat; het opnieuw nummeren gebeurt in één keer bij het
     loslaten, zodat er niet bij elke muisbeweging naar Firestore geschreven
     wordt. */
  document.querySelectorAll('[data-rij]').forEach(rij => {
    rij.ondragstart = (e) => {
      state.__sleep = rij.dataset.rij;
      rij.classList.add('sleept');
      try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", rij.dataset.rij); }catch(err){}
    };
    rij.ondragend = () => {
      rij.classList.remove('sleept');
      document.querySelectorAll('.sleepdoel').forEach(x => x.classList.remove('sleepdoel'));

      e.preventDefault();
      rij.classList.add('sleepdoel');
    };
    rij.ondragleave = () => rij.classList.remove('sleepdoel');
    rij.ondrop = (e) => {
      e.preventDefault();
      rij.classList.remove('sleepdoel');
      const van = state.__sleep;
      state.__sleep = null;
      if (van && van !== rij.dataset.rij) verplaatsProduct(van, rij.dataset.rij);
    };

/* Het gesleepte product komt op de plek van het product waar je het loslaat;
   de rest schuift op. Daarna krijgt iedereen een vers volgnummer — met gaten
   werken loont niet, een lijst van dertig herschrijf je zo. */
async function verplaatsProduct(vanId, naarId){
  const lijst = eigenVolgorde(state.products || []).map(p => p.id);
  const van = lijst.indexOf(vanId);
  if (van < 0 || vanId === naarId) return;
  // Eerst weghalen, dán pas kijken waar het doel nu staat. Doe je dat in één
  // beweging, dan is die index al opgeschoven zodra je iets van boven naar
  // beneden sleept en belandt het één plek te laag.
  lijst.splice(van, 1);
  const naar = lijst.indexOf(naarId);
  if (naar < 0) return;
  lijst.splice(naar, 0, vanId);
  // meteen op het scherm, zonder te wachten op de databank
  for (const p of state.products) p.volgorde = lijst.indexOf(p.id);
  render();
  try{
    await Promise.all(lijst.map((id, i) => updateDoc(doc(db, "products", id), { volgorde: i })));
  }catch(err){ notify("Volgorde niet bewaard: " + firestoreHint(err)); }
}

/* Eén handeling voor alles wat je aangevinkt hebt. */
async function bulkActie(wat, waarde){
  const ids = gekozenProducten();
  if (wat === "niets"){ state.__pGekozen = []; render(); return; }
  if (!ids.length) return;
  let velden = null;
  if (wat === "verberg") velden = { hidden: true };
  else if (wat === "toon") velden = { hidden: false };
  else if (wat === "categorie") velden = { category: waarde };
  else if (wat === "korting"){
    const pct = prompt(`Hoeveel procent korting op ${ids.length} product${ids.length === 1 ? "" : "en"}?\n\nVul 0 in om de korting weg te halen.`, "10");
    if (pct === null) return;
    const n = Math.max(0, Math.min(90, parseInt(pct, 10) || 0));
    velden = { discountPct: n, discountUntil: null };
  }
  if (!velden) return;
  try{
    await Promise.all(ids.map(id => updateDoc(doc(db, "products", id), velden)));
    notify(`${ids.length} product${ids.length === 1 ? "" : "en"} bijgewerkt`);
    state.__pGekozen = [];
    render();
  }catch(err){ notify("Bijwerken mislukt: " + firestoreHint(err)); }
}

   en de verkoopteller begint bij nul. Het staat meteen op verborgen, zodat een

/* Je bestellingen als CSV, voor je boekhouding. Eén regel per bestelling met
   wat erin zat; puntkomma's omdat Excel in het Nederlands daarop rekent. */
function exporteerBestellingen(){
  const rijen = [...state.orders].sort((a, b) => a.createdAt - b.createdAt);
  if (!rijen.length){ notify("Er zijn nog geen bestellingen"); return; }
  const veld = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const kop = ["Datum","Bestelnummer","Klant","Status","Land","Artikelen","Subtotaal","Korting","Code","Verzending","Totaal","Betaalwijze","Referentie"];
  const regels = rijen.map(o => [
    new Date(o.createdAt).toLocaleString('nl-BE'),
    orderNumber(o), o.userEmail, o.status, o.pickupAt ? "afhalen" : (o.shippingCountry || ""),
    (o.items || []).map(i => `${i.qty}x ${i.name}`).join(" | "),
    (o.subtotal ?? 0).toFixed(2), (o.discountAmount ?? 0).toFixed(2), o.discountCode || "",
    (o.shippingCost ?? 0).toFixed(2), (o.total ?? 0).toFixed(2),
    o.paymentMethod || "", o.paymentRef || "",
  ].map(veld).join(";"));
  // ﻿ zodat Excel de accenten juist leest
  const blob = new Blob(["﻿" + [kop.map(veld).join(";"), ...regels].join("\r\n")],
    { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `bestellingen-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  notify(`${rijen.length} bestelling${rijen.length === 1 ? "" : "en"} geëxporteerd`);
}

    el.oninput = () => { state.__draftSlots[+el.dataset.i].name = el.value; };   // geen render: cursor blijft staan
  });
  document.querySelectorAll('.slotfil').forEach(el=>{
    el.onchange = () => { state.__draftSlots[+el.dataset.i].filamentId = el.value || null; };
  });
  document.querySelectorAll('.slotdel').forEach(el=>{
    el.onclick = () => { state.__draftSlots.splice(+el.dataset.i, 1); render(); };
  });
  renderImageTray();

  const fileInput = document.getElementById('pImgFile');
  if (fileInput) fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    for (const f of files){
      if ((state.__draftImages || []).length >= MAX_PRODUCT_IMAGES){ notify(`Maximaal ${MAX_PRODUCT_IMAGES} afbeeldingen`); break; }
      try{
        state.__draftImages.push(await fileToCompressedDataUrl(f));
        renderImageTray();
      }catch(err){ notify(err.message); }
    }
  };

  // 3D-voorbeeld: inlezen gebeurt hier, bewaren pas bij het opslaan van het
  // product — anders staat er een model bij een product dat nooit ontstaat.
  const modelKies = document.getElementById('pickModelBtn');
  if (modelKies) modelKies.onclick = () => document.getElementById('pModelFile').click();
  const modelInput = document.getElementById('pModelFile');
  if (modelInput) modelInput.onchange = async (e) => {
    const f = (e.target.files || [])[0];
    e.target.value = "";
    if (!f) return;
    const stand = document.getElementById('modelStand');
    if (stand) stand.textContent = "inlezen…";
    try{
      const delen = await analyzeFile(f);
      state.__draftModel = voorbeeldUitDelen(delen);
      render();
      notify(delen[0]?.__alsStl
        ? `Het 3mf wilde niet, maar ${delen[0].__alsStl} — als STL ingelezen`
        : `Model ingelezen — ${state.__draftModel.parts.length} ${state.__draftModel.parts.length > 1 ? "onderdelen" : "onderdeel"}`);
    }catch(err){
      state.__draftModel = undefined;
      render();
      notify("Kon dit model niet inlezen: " + (err.message || err));
    }
  };
  const modelWis = document.getElementById('wisModelBtn');
  if (modelWis) modelWis.onclick = () => { state.__draftModel = null; render(); };

  // Printbestand: hier alleen onthouden welk bestand je koos. Wegschrijven
  // gebeurt bij het opslaan, want pas dan bestaat het product zeker.
  const printKies = document.getElementById('pickPrintBtn');
  if (printKies) printKies.onclick = () => document.getElementById('pPrintFiles').click();
  const printInput = document.getElementById('pPrintFiles');
  if (printInput) printInput.onchange = (e) => {
    const gekozen = Array.from(e.target.files || []);
    e.target.value = "";
    if (!gekozen.length) return;
    const teGroot = gekozen.find(f => f.size > MAX_FIRESTORE_BYTES);
    if (teGroot){
      notify(`"${teGroot.name}" is ${(teGroot.size/1024/1024).toFixed(1)}MB — dat past niet (max ${MAX_FIRESTORE_BYTES/1024/1024}MB)`);
      return;
    }
    state.__draftPrint = gekozen.slice(0, MAX_PRINTBESTANDEN);
    if (gekozen.length > MAX_PRINTBESTANDEN) notify(`Maximaal ${MAX_PRINTBESTANDEN} bestanden — de rest is weggelaten`);
    render();
  };
  const printWis = document.getElementById('wisPrintBtn');
  if (printWis) printWis.onclick = () => { state.__draftPrint = null; render(); };

  const urlBtn = document.getElementById('addImgUrlBtn');
  if (urlBtn) urlBtn.onclick = () => {
    const input = document.getElementById('pImgUrl');
    const url = input.value.trim();
    if (!url) return;
    if (!isSafeImageSrc(url)){ notify("Gebruik een https-adres van een afbeelding"); return; }
    if (state.__draftImages.length >= MAX_PRODUCT_IMAGES){ notify(`Maximaal ${MAX_PRODUCT_IMAGES} afbeeldingen`); return; }
    state.__draftImages.push(url);
    input.value = "";
    renderImageTray();
  };

  const btn = document.getElementById('addProductBtn');
  if (btn) btn.onclick = async () => {
    const val = id => (document.getElementById(id)?.value || "").trim();
    const name = val('pName');
    const price = parseFloat(val('pPrice'));
    const isSet = document.querySelectorAll('.bundelvink:checked').length > 0;
    if (!name){ notify("Vul een naam in"); return; }
    // Een setje rekent zijn prijs uit wat erin zit; daar hoef je er dus geen
    // voor in te vullen.
    if (!isSet && (!isFinite(price) || price <= 0)){ notify("Vul een geldige prijs in"); return; }

    const weight = parseInt(val('pWeight'),10);
    const data = {
      name, price: isFinite(price) && price > 0 ? price : 0,
      description: val('pDesc'),
      hidden: !!document.getElementById('pHidden')?.checked,
      discountPct: Math.min(90, Math.max(0, parseInt(val('pDiscount'),10) || 0)),
      discountUntil: val('pDiscountUntil') ? new Date(val('pDiscountUntil') + "T23:59:59").getTime() : null,
      colorSlots: (state.__draftSlots || [])
        .map(sl => ({ name: (sl.name || "").trim(), filamentId: sl.filamentId || null }))
        .filter(sl => sl.name)
        .slice(0, 10),
      category: val('pCategory'),
      color: val('pColor'),
      material: val('pMaterial'),
      infill: val('pInfill') || "20%",
      layerHeight: val('pLayer') || "0.2mm",
      dimensions: val('pDim'),
      printTime: val('pTime'),
      weight: isFinite(weight) ? weight : 0,
      sizing: sizingFromForm(),
      filamentTypes: [...document.querySelectorAll('.ptype:checked')].map(c => c.value),
      featured: !!document.getElementById('pFeatured')?.checked,
      personalisatie: {
        aan: !!document.getElementById('pPersAan')?.checked,
        label: val('pPersLabel'),
        hint: val('pPersHint'),
        max: Math.max(1, Math.min(60, parseInt(val('pPersMax'), 10) || 16)),
        prijs: Math.max(0, parseFloat(val('pPersPrijs')) || 0),
        verplicht: !!document.getElementById('pPersVerplicht')?.checked,
      },
      bundelVan: [...document.querySelectorAll('.bundelvink:checked')].map(c => c.value),
      bundelKorting: Math.max(0, Math.min(90, parseInt(val('pBundelKorting'), 10) || 0)),
      images: (state.__draftImages || []).filter(isSafeImageSrc).slice(0, MAX_PRODUCT_IMAGES),
      icon: "cube",
    };
    // undefined = ongemoeid laten, een model = vervangen, null = weghalen
    const model = state.__draftModel;
    if (model !== undefined){
      data.has3d = !!model;
      // De echte maat van het model bewaren we bij het product zelf. Zo weet de
      // printlijst hoe groot een stuk is zonder het 3D-model op te halen, en
      // kan de productpagina hem naast een bankkaart zetten.
      data.modelSize = model ? model.size.map(v => Math.round(v * 10) / 10) : null;
    }

    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = "Opslaan…";
    try{
      let id;
      if (state.__editing){
        id = state.__editing;
        await updateProduct(id, data);
        state.__editing = null;
      } else {
        id = await addProduct(data);
      }
      // Het 3D-voorbeeld staat in een eigen collectie. Weigert Firestore die —
      // omdat de regels hem nog niet kennen — dan zou het product blijven
      // beweren dat er een model bij zit terwijl dat er niet is. Daarom zetten
      // we dat vlaggetje in dat geval meteen weer terug, en zeggen we wat er
      // moet gebeuren in plaats van alleen "insufficient permissions".
      if (model !== undefined) voorbeeldCache.delete(id);
      if (model || model === null){
        try{
          if (model) await bewaarVoorbeeld(id, model);
          else await wisVoorbeeld(id);
        }catch(err){
          if (model) await updateProduct(id, { has3d: false }).catch(()=>{});
          notify("Het product is bewaard, maar het 3D-model niet: " + firestoreHint(err));
          state.__draftImages = []; state.__draftSlots = null;
          state.__draftModel = undefined; state.__draftProduct = null;
          state.__draftPrint = undefined;
          render();
          return;
        }
      }

      // Het printbestand. Ook hier: undefined = laten staan, een lijst =
      // vervangen, null = weghalen. De oude stukken gaan er eerst af, anders
      // blijft de staart van een langer bestand achter.
      const printNieuw = state.__draftPrint;
      if (printNieuw !== undefined){
        const oude = printBestanden(state.products.find(p => p.id === id));
        try{
          await wisPrintBestanden(id, oude);
          const lijst = printNieuw ? await bewaarPrintBestanden(id, printNieuw, t => { btn.innerHTML = t; }) : [];
          await updateProduct(id, { printFiles: lijst });
        }catch(err){
          // Het product staat er wel; alleen het bestand niet. Dat moet je
          // weten, anders denk je dat je het kunt downloaden bij een bestelling.
          await updateProduct(id, { printFiles: [] }).catch(()=>{});
          notify("Het product is bewaard, maar het printbestand niet: " + firestoreHint(err));
          state.__draftImages = []; state.__draftSlots = null;
          state.__draftModel = undefined; state.__draftProduct = null;
          state.__draftPrint = undefined;
          render();
          return;
        }
      }

      state.__draftImages = [];
      state.__draftSlots = null;
      state.__draftModel = undefined;
      state.__draftPrint = undefined;
      state.__draftProduct = null;
      render();
      window.scrollTo(0,0);
    }catch(err){
      notify("Opslaan mislukt: " + err.message);
      btn.disabled = false;
      btn.textContent = original;
    }
  };
}

/* Een handvat om in de console (of in een test) te kunnen nakijken wat de
   slicer van een model maakt: window.__lc.partSlice(__lc.state.parts[0]) */
window.__lc = {
  get state(){ return state; },
  sliceMesh, partSlice, partEstimate, projectTotals,
  pricing, slicerSettings, render,
  slotFilament, currentFilament,
  plaatIndeling, printRij, maatUitTekst, itemMaat, tijdUitTekst,
  MAAT_REFS, productMaat, autoReferentie,
  get snijders(){ return snijders; },
};

/* --------------------------- boot --------------------------- */
listenMail();     // ook een klant moet post kunnen krijgen
listenProducts();
listenFilaments();
listenPricing();
listenPickup();
listenWinkel();
// De voet staat buiten #app en wordt dus nooit opnieuw getekend: één keer
// aanhaken volstaat.
document.querySelectorAll('[data-info-ga]').forEach(b => {
  b.onclick = () => go("info", { __infoDeel: b.dataset.infoGa });
});
renderAuthNav();
render();
</script>
