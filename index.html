<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Extrudo — 3D-prints op maat</title>
<meta name="theme-color" content="#F5F4F0" />
<meta name="description" content="3D-prints op maat. Kies uit de collectie of upload je eigen model — wij printen het in Bambu Lab-filament en sturen het op." />
<script>
  (function(){
    var t;
    try{ t = localStorage.getItem('lc_theme'); }catch(e){}
    if (t !== 'light' && t !== 'dark'){
      t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</noscript>
<style>
  /* =================================================================
     Technisch, niet zacht. Haarlijnen in plaats van schaduwen, bijna
     rechte hoeken, cijfers altijd in mono, en één signaalkleur die
     spaarzaam gebruikt wordt.
     ================================================================= */
  :root{
    --paper:#F5F4F0; --surface:#FFFFFF; --surface2:#EDECE6; --line:#DEDCD3; --line-strong:#C6C3B7;
    --ink:#111214; --muted:#6E6C64;
    --accent:#FF3B00; --accent-ink:#FFFFFF; --signal:#0F766E;
    --plate:#16171A;
    --grid:rgba(17,18,20,.05);
  }
  :root[data-theme="dark"]{
    --paper:#0F1012; --surface:#16171A; --surface2:#1D1F23; --line:#26282C; --line-strong:#3A3D43;
    --ink:#F0EFEA; --muted:#8E8C84;
    --accent:#FF5A2B; --accent-ink:#111214; --signal:#2DD4BF;
    --plate:#16171A;
    --grid:rgba(240,239,234,.05);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .font-display{font-family:'Archivo','IBM Plex Sans',sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1.05;}
  .font-mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
  a{color:inherit;text-decoration:none;}
  button, select, input, textarea{font-family:inherit;font-size:14px;color:inherit;}
  /* dubbeltikken op een knop zoomt anders in op een telefoon */
  button, a, label, select, .card, summary{touch-action:manipulation;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .muted{color:var(--muted);}
  .hidden{display:none !important;}
  .rel{position:relative;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px;}

  /* ---------- strook + kop ---------- */
    background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',monospace;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  }

  header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--ink);}
  .header-inner{max-width:1140px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  @media(max-width:640px){.header-inner{padding:12px 16px;}}
  .brand{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--ink);padding:0;}
  .brand-mark{width:22px;height:22px;flex-shrink:0;}
  .brand-name{font-family:'Archivo',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.02em;text-transform:uppercase;}
  .nav-right{display:flex;align-items:center;gap:8px;}
  .iconbtn{
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    border-radius:10px;font-size:15px;transition:background .12s,border-color .12s;
  }
  .iconbtn:hover{background:var(--surface2);border-color:var(--ink);}
  .iconbtn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .cart-count{
    position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;padding:0 5px;
    background:var(--accent);color:var(--accent-ink);border-radius:999px;
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- uitklapmenu ---------- */
  .menu-wrap{position:relative;}
  .menu-panel{
    position:absolute;right:0;top:calc(100% + 9px);min-width:250px;z-index:50;
    background:var(--surface);border:1px solid var(--ink);border-radius:14px;
    box-shadow:6px 6px 0 var(--ink);padding:6px;
  }
  :root[data-theme="dark"] .menu-panel{box-shadow:6px 6px 0 var(--line-strong);}
  .menu-item{
    display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;
    background:none;border:none;border-radius:9px;font-size:14px;text-align:left;color:var(--ink);
  }
  .menu-item:hover{background:var(--surface2);}
  .menu-item i{width:16px;text-align:center;color:var(--muted);}
  .menu-item:hover i{color:var(--accent);}
  .menu-sep{height:1px;background:var(--line);margin:6px 4px;}
  .menu-label{
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);padding:9px 11px 5px;
  }

  /* ---------- raamwerk ---------- */
  main{max-width:1140px;margin:0 auto;padding:0 24px 120px;}
  @media(max-width:640px){main{padding:0 16px 96px;}}
  .rule{height:1px;background:var(--line);margin:0;}
  .section-head{
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    padding-bottom:12px;border-bottom:1px solid var(--ink);margin-bottom:22px;
  }
  .label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  }
  .label-accent{color:var(--accent);}

  /* ---------- hero ---------- */
  .hero{padding:56px 0 44px;border-bottom:1px solid var(--ink);margin-bottom:32px;}
  .hero-grid{display:grid;grid-template-columns:1fr;gap:28px;align-items:end;}
  @media(min-width:820px){.hero-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;}}
  .hero h1{font-size:clamp(34px,7vw,66px);margin:14px 0 0;max-width:15ch;}
  .hero-sub{color:var(--muted);max-width:46ch;margin:18px 0 0;font-size:15px;}
  .hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
  .spec-strip{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:34px;}
  .spec-strip div{padding:14px 0 0;border-right:1px solid var(--line);}
  .spec-strip div:last-child{border-right:none;}
  .spec-strip dt{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;}
  .spec-strip dd{margin:0;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;}

  /* ---------- knoppen ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    padding:12px 20px;border-radius:10px;border:1px solid var(--ink);
    font-weight:600;font-size:14px;background:var(--surface);color:var(--ink);
    transition:transform .1s, box-shadow .1s, background .12s;
  }
  .btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
  .btn-accent:hover{box-shadow:3px 3px 0 var(--ink);}
  .btn:active{transform:none;box-shadow:none;}
  .btn:disabled{opacity:.45;pointer-events:none;}
  .btn-ghost{border-color:var(--line-strong);}
  .btn-sm{padding:8px 13px;font-size:13px;}
  .back{background:none;border:none;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:7px;padding:0;margin-bottom:20px;}
  .back:hover{color:var(--accent);}

  /* ---------- collectie ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:16px;overflow:hidden;}
  @media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);}}
  .card{
    text-align:left;border:none;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);color:var(--ink);
    padding:14px;display:flex;flex-direction:column;gap:12px;transition:background .14s;
  }
  .card:hover{background:var(--surface);}
  .thumb{position:relative;width:100%;aspect-ratio:4/3;border-radius:10px;background:var(--plate);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb i{font-size:30px;color:var(--muted);}
  .card-title{font-size:14px;font-weight:600;line-height:1.3;}
  .price{font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:-.02em;}
  .card .price{white-space:nowrap;font-size:15px;}
  .flag{
    position:absolute;top:8px;left:8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    padding:4px 8px;
  }

  /* ---------- panelen ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .panel + .panel{margin-top:14px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .panel-title{font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;letter-spacing:-.01em;}
  .cart-item, .order-card, .admin-row, .fil-block, .part-card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;
  }
  /* ---------- winkelwagen ----------
     Dicht zie je in één regel wát het is, welke kleuren en wat het kost; klap
     je het open, dan staat er per onderdeel bij welke kleur waar komt — net
     als bij een bestelling in Shopbeheer. Het aantal blijft altijd staan, dat
     wil je kunnen wijzigen zonder eerst iets open te doen.
     Ruim gezet: regels mogen ademen, anders leest het als een propje. */
  .wagen-kaart{padding:0;overflow:hidden;margin-bottom:12px;}
  .wagenvak > summary{
    display:flex;align-items:center;gap:13px;padding:15px;cursor:pointer;list-style:none;min-height:64px;
  }
  .wagenvak > summary::-webkit-details-marker{display:none;}
  .wagenvak > summary:hover{background:var(--surface2);}
  .wagenvak-tekst{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;}
  .wagenvak-naam{font-size:15.5px;font-weight:600;line-height:1.4;word-break:break-word;}
  .wagenvak-kort{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:12.5px;color:var(--muted);line-height:1.6;
  }
  .wagenvak-kort .fil-chip{width:22px;height:22px;border-radius:7px;flex-shrink:0;}
  .wagenvak-prijs{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;flex-shrink:0;}
  .wagenvak-meer{
    display:flex;align-items:center;gap:5px;flex-shrink:0;color:var(--muted);
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  }
  .wagenvak[open] > summary .bestelvak-pijl{transform:rotate(180deg);}
  /* op een smal scherm is er geen plaats voor het woord; het pijltje volstaat */
  @media(max-width:520px){
    .wagenvak-meer{font-size:0;gap:0;}
    .wagenvak-meer .bestelvak-pijl{font-size:15px;}
  }
  .wagenvak-body{padding:2px 15px 6px;}
  .wagen-tekst{min-width:0;flex:1;}
  .wagen-naam{font-size:15px;font-weight:600;line-height:1.4;word-break:break-word;}
  .wagen-specs{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .wagen-spec{display:flex;align-items:center;gap:12px;font-size:14px;line-height:1.5;min-height:30px;}
  .wagen-spec .sleutel{
    color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.05em;text-transform:uppercase;flex:0 0 84px;padding-top:2px;line-height:1.5;
  }
  .wagen-spec .waarde{min-width:0;flex:1;word-break:break-word;font-size:14px;line-height:1.5;
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .wagen-spec .fil-chip{width:24px;height:24px;border-radius:8px;flex-shrink:0;}
  .wagen-deel{display:flex;align-items:center;gap:9px;flex-wrap:wrap;width:100%;line-height:1.5;}
  .wagen-voet{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:13px 15px 14px;border-top:1px solid var(--line);
  }
  .wagen-prijs{font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.6;}
  .wagen-prijs .totaal{font-size:15px;font-weight:600;}
  @media(max-width:420px){
    .wagen-spec{flex-direction:column;align-items:flex-start;gap:4px;}
    .wagen-spec .sleutel{flex:none;}
    .wagenvak > summary{gap:11px;padding:13px;}
    .wagenvak-prijs{font-size:14px;}
  }
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0;}
  .kv span:first-child{color:var(--muted);}
  .kv span:last-child{font-family:'IBM Plex Mono',monospace;}

  /* ---------- formulieren ---------- */
  input, textarea, select.field{
    width:100%;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);
    border-radius:9px;padding:10px 12px;margin-bottom:10px;transition:border-color .12s;
  }
  input:focus, textarea:focus, select.field:focus{outline:none;border-color:var(--accent);}
  /* Op een telefoon zoomt de browser vanzelf in zodra je een invoerveld
     aantikt dat kleiner is dan 16px — en hij zoomt daarna niet terug uit.
     Daarom zijn de velden daar een maat groter. */
  @media (pointer: coarse){
    input, textarea, select, button, select.field{font-size:16px;}
    .btn-sm{font-size:14px;}
  }
  label.field-label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);display:block;margin-bottom:5px;
  }
  .checkbox-row{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);margin-bottom:10px;}
  .form-grid{display:grid;grid-template-columns:1fr;gap:0 12px;}
  @media(min-width:400px){.form-grid{grid-template-columns:1fr 1fr;}}
  .stepper{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface);}
  .stepper button{width:36px;height:40px;background:transparent;border:none;color:var(--ink);font-size:12px;}
  .stepper button:hover{background:var(--surface2);}
  .stepper span{width:34px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:14px;}
  input[type=range]{accent-color:var(--accent);padding:0;background:none;border:none;}
  .tabs{display:flex;gap:0;margin-bottom:22px;border-bottom:1px solid var(--ink);flex-wrap:wrap;}
  .tab{
    padding:9px 15px;font-size:13px;background:none;border:none;border-bottom:2px solid transparent;
    color:var(--muted);margin-bottom:-1px;font-weight:500;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--accent);}

  /* ---------- meldingen ---------- */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    border-radius:12px;padding:11px 12px 11px 16px;font-size:13px;z-index:60;max-width:calc(100vw - 32px);
    display:flex;align-items:center;gap:11px;line-height:1.45;
  }
  /* Op een telefoon brak de tekst hiernaast in drie stukjes af. Eén regel die
     netjes eindigt met … leest een stuk rustiger. */
  .toast > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .toast i{color:var(--accent);}
  .notice{border:1px solid var(--accent);border-left-width:3px;border-radius:12px;padding:13px 15px;background:var(--surface);}
  .notice-title{color:var(--accent);font-weight:600;font-size:13px;margin:0 0 6px;display:flex;align-items:center;gap:8px;}
  .badge{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 10px;border:1px solid var(--line-strong);border-radius:999px;color:var(--muted);
  }
  .badge-accent{border-color:var(--accent);color:var(--accent);}
  .footer-note{font-size:12px;line-height:1.65;color:var(--muted);margin-top:14px;display:flex;align-items:center;gap:8px;}

  /* ---------- de voet van elke pagina ---------- */
  .voet{border-top:1px solid var(--line);margin-top:48px;padding:22px 20px 34px;}
  .voet-binnen{
    max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;
  }
  .voet-naam{font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;letter-spacing:-.01em;}
  .voet-links{display:flex;gap:4px;flex-wrap:wrap;}
  .voet-links button{
    background:none;border:none;color:var(--muted);font-size:13px;line-height:1.6;
    padding:4px 8px;border-radius:8px;transition:color .16s, background .16s;
  }
  .voet-links button:hover{color:var(--ink);background:var(--surface2);}
  .voet-klein{color:var(--muted);font-size:12px;line-height:1.6;margin-left:auto;}
  .img-slot[draggable="true"]{cursor:grab;}
  .img-slot.sleept{opacity:.4;}
  .img-slot.sleepdoel{outline:2px solid var(--accent);outline-offset:1px;}
  .img-eerste{
    position:absolute;left:4px;bottom:4px;z-index:2;
    background:var(--accent);color:#fff;border-radius:5px;
    font-size:8.5px;font-weight:700;letter-spacing:.06em;padding:2px 4px;
    font-family:var(--mono);pointer-events:none;
  }

  .voorraadvak{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .voorraadvak input{
    width:64px;margin:0;padding:5px 7px;font-size:12px;text-align:right;
    font-family:var(--mono);
  }
  .voorraadvak .muted{font-size:11px;}

  .bestelvak.nubezig{border-color:var(--accent);}
  .nu-vlag{
    background:var(--accent);color:#fff;border-radius:5px;margin-left:6px;
    font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 5px;
    font-family:var(--mono);white-space:nowrap;
  }

  .notitievak{
    background:var(--surface2);border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;margin:0 0 12px;
  }
  .notitievak textarea{margin:0;min-height:0;font-size:13px;line-height:1.55;}

  /* ---------- productlijst in het beheer ---------- */
  .sleepgreep{
    cursor:grab;color:var(--muted);font-size:13px;flex-shrink:0;
    padding:2px 1px;touch-action:none;
  }
  .sleepgreep:active{cursor:grabbing;}
  .admin-row[draggable="true"]{transition:opacity .14s, box-shadow .14s, transform .14s;}
  .admin-row.sleept{opacity:.4;}
  .admin-row.sleepdoel{box-shadow:0 -3px 0 var(--accent);}
  .admin-row.rij-gekozen{border-color:var(--accent);}
  .bulkbalk{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    background:var(--surface2);border:1px solid var(--line-strong);border-radius:12px;
    padding:9px 12px;margin:0 0 10px;position:sticky;top:78px;z-index:3;
  }
  .bulk-tel{font-size:12.5px;font-weight:600;}

  /* ---------- instellingen ---------- */
  .inst-rij{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
  .inst-label{font-size:13px;font-weight:600;color:var(--ink);}

  /* ---------- bewaard: het hartje ---------- */
  .hart, .hart-knop{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:999px;border:none;cursor:pointer;
    color:var(--muted);font-size:15px;
    background:color-mix(in srgb, var(--surface) 82%, transparent);
    transition:color .16s, transform .16s, background .16s;
  }
  .hart{position:absolute;top:8px;right:8px;z-index:2;}
  .hart:hover, .hart-knop:hover{color:var(--accent);background:var(--surface);}
  .hart.aan, .hart-knop.aan{color:var(--accent);}
  .hart:active, .hart-knop:active{transform:scale(.88);}
  .hart-knop{flex-shrink:0;background:var(--surface2);}
  /* Even opspringen als je iets opzij legt, zodat je ziet dat het aankwam. */
  .hart.aan i, .hart-knop.aan i{animation:hartje .32s ease-out;}
  @keyframes hartje{ 0%{transform:scale(.6);} 60%{transform:scale(1.25);} 100%{transform:scale(1);} }
  .grid-klein{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .collectie-kop{
    font-family:var(--display);font-size:15px;font-weight:700;
    margin:26px 0 10px;display:flex;align-items:baseline;gap:9px;
  }
  .collectie-kop:first-of-type{margin-top:4px;}
  .collectie-kop .muted{font-size:12px;font-weight:400;}
  @media(prefers-reduced-motion:reduce){ .hart.aan i, .hart-knop.aan i{animation:none;} }
  @media(max-width:640px){ .voet-klein{margin-left:0;flex-basis:100%;} }

  /* ---------- materiaalgids ---------- */
  .gids-knop{
    display:inline-flex;align-items:center;gap:6px;background:none;border:none;
    color:var(--muted);font-size:12px;line-height:1.5;padding:4px 8px;border-radius:8px;
    flex-shrink:0;transition:color .16s, background .16s;
  }
  .gids-knop:hover{color:var(--accent);background:var(--surface2);}
  .gids{
    background:var(--surface2);border-radius:12px;padding:13px 14px;margin:0 0 14px;
    animation:uitvouwen .3s cubic-bezier(.22,.7,.3,1) both;
  }
  .gids-blok + .gids-blok{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;}
  .gids-naam{font-size:13.5px;font-weight:600;line-height:1.5;margin:0 0 4px;}
  .gids .kv{font-size:12.5px;line-height:1.6;padding:3px 0;gap:16px;}
  .gids .kv span:last-child{font-family:inherit;max-width:60%;}

  /* ---------- de winkel staat even op pauze ---------- */
  .pauzevak{margin:0 0 22px;}

  /* ---------- hoe groot is het echt ---------- */
  .maatvak{margin:14px 0 0;padding:14px 15px 12px;}
  .maatvak-kop{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);margin:0 0 10px;
  }
  .maatdoek{
    position:relative;width:100%;aspect-ratio:16/10;background:var(--plate);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;
  }
  /* Het bijschrift op zijn eigen regel: met vijf knopjes ernaast brak de rij
     anders af en stond er eentje verweesd onderaan. */
  .maatkiezer{ display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0; }
  .maatkiezer-kop{
    flex-basis:100%;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted);
  }

  /* ---------- zoeken en filteren in de collectie ---------- */
  .zoekbalk{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px;}
  .zoekvak{
    position:relative;display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:0;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;padding:0 12px;
    transition:border-color .16s;
  }
  .zoekvak:focus-within{border-color:var(--accent);}
  .zoekvak > i{color:var(--muted);font-size:13px;flex-shrink:0;}
  .zoekvak input{
    border:none;background:none;margin:0;padding:11px 0;flex:1;min-width:0;font-size:14px;
  }
  /* Op een telefoon een maat groter: onder 16px zoomt iOS in zodra je het
     vakje aantikt, en daarna niet meer uit. */
  @media (pointer: coarse){ .zoekvak input{font-size:16px;} }
  .zoekvak input:focus{outline:none;}
  .zoekvak input::-webkit-search-cancel-button{display:none;}
  .zoekvak > button{
    background:none;border:none;color:var(--muted);padding:6px;border-radius:8px;flex-shrink:0;
    transition:color .16s, background .16s;
  }
  .zoekvak > button:hover{color:var(--ink);background:var(--surface2);}
  .zoeksorteer{width:auto;margin:0;flex-shrink:0;font-size:13px;padding:10px 12px;}
  .zoekchips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    background:var(--surface);border:1px solid var(--line-strong);color:var(--muted);
    border-radius:999px;padding:7px 14px;font-size:12.5px;line-height:1.4;
    transition:background .16s, color .16s, border-color .16s, transform .14s cubic-bezier(.3,1.3,.5,1);
  }
  .chip:hover{color:var(--ink);}
  .chip:active{transform:scale(.96);}
  .chip.active{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600;}

  /* ---------- wat er op de printer moet ---------- */
  .printrij{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:none;border:none;border-top:1px solid var(--line);padding:11px 2px;
    transition:background .14s;
  }
  .printrij:first-of-type{border-top:none;}
  .printrij:hover{background:var(--surface2);border-radius:10px;}
  .printrij-naam{flex:1;min-width:0;font-size:13.5px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .printrij-bij{font-size:10.5px;flex-shrink:0;}
  .printrij.af .printrij-naam{color:var(--muted);text-decoration:line-through;}
  @media(max-width:520px){ .printrij-bij{display:none;} }

  /* ---------- bedankt ---------- */
  .bedankt-kop{display:flex;align-items:flex-start;gap:14px;}
  .bedankt-vink{
    width:44px;height:44px;border-radius:999px;flex-shrink:0;
    background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;
  }
  .bedankt-stap{display:flex;align-items:flex-start;gap:12px;padding:9px 0;}
  .bedankt-stap + .bedankt-stap{border-top:1px solid var(--line);}
  .bedankt-stap-bol{
    width:30px;height:30px;border-radius:999px;flex-shrink:0;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;
  }
  .bedankt-stap.later .bedankt-stap-bol{background:var(--surface2);color:var(--muted);}

  /* ---------- winkelgegevens en voorwaarden ---------- */
  .info-blok{line-height:1.75;font-size:14px;}
  .info-blok p{margin:0 0 14px;}
  .info-kop{font-family:'Archivo',sans-serif;font-size:14px;font-weight:700;margin:20px 0 7px;}
  .info-kop:first-child{margin-top:0;}
  .info-blok .kv{padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.6;}
  .info-blok .kv:first-of-type{border-top:none;}
  .ontbreekt{color:var(--accent);font-size:12.5px;}

  /* ---------- product ---------- */
  .product-layout{display:grid;grid-template-columns:1fr;gap:30px;}
  @media(min-width:820px){.product-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:52px;align-items:start;}}
  .viewer{width:100%;aspect-ratio:1/1;background:var(--plate);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;}
  .viewer img{width:100%;height:100%;object-fit:cover;display:block;}
  .viewer canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  .viewer canvas:active{cursor:grabbing;}
  .viewer-leeg{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px;color:var(--paper);opacity:.62;
  }
  .viewer-tag{
    position:absolute;left:10px;bottom:10px;border-radius:999px;background:var(--ink);color:var(--paper);
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;
  }
  .viewer-hint{
    position:absolute;right:8px;bottom:8px;color:var(--paper);opacity:.55;
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  }
    /* kleurvakken: één per benoemd stuk van het model */
  .slot{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden;background:var(--surface);}
  .slot.open{border-color:var(--accent);}
  .slot-head{
    display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;
    background:none;border:none;cursor:pointer;color:inherit;text-align:left;
  }
  .slot-head:hover{background:var(--surface2);}
  .slot-head .fil-chip{width:22px;height:22px;border-radius:7px;flex-shrink:0;}
  .slot-name{display:block;font-size:13px;font-weight:600;}
  .slot-fil{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);}
  .slot-caret{color:var(--muted);flex-shrink:0;}
  /* kleur kiezen per onderdeel: één uitklapper per stuk */
  .kleurkiezer{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface);overflow:hidden;}
  .kleurkiezer.leeg{border-style:dashed;border-color:var(--line-strong);}
  .kleurkiezer.gekozen{border-color:var(--line);}
  .kleurkiezer.open{border-color:var(--ink);}
  .kleurkiezer-knop{
    display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 12px;
    background:none;border:none;text-align:left;color:var(--ink);
  }
  .kleurkiezer-nr{
    width:24px;height:24px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;
    background:var(--surface2);color:var(--muted);
  }
  .kleurkiezer.gekozen .kleurkiezer-nr{background:var(--accent);color:#fff;font-size:10px;}
  .kleurkiezer-naam{font-size:15px;font-weight:600;flex-shrink:0;}
  .kleurkiezer-keuze{
    display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0;justify-content:flex-end;
  }
  .kleurkiezer-keuze .fil-chip{width:26px;height:26px;border-radius:8px;flex-shrink:0;}
  .kleurkiezer-tekst{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kleurkiezer-tekst.leeg{color:var(--accent);font-weight:600;}
  .kleurkiezer-lade{padding:0 12px 12px;}
  @media(max-width:380px){ .kleurkiezer-naam{font-size:14px;} .kleurkiezer-tekst{max-width:96px;} }
  .slot-body{padding:0 12px 12px;}
  /* korting */
  /* de bestelling waar een link uit een bericht naartoe wees */
  .aangewezen{
    border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    transition:box-shadow .3s, border-color .3s;
  }
  .sale-flag{
    display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
    padding:2px 8px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.06em;
  }
  .was{color:var(--muted);text-decoration:line-through;font-weight:400;margin-right:6px;}
  .strip{display:flex;gap:8px;margin-top:8px;}
  .strip button{
    width:60px;height:60px;overflow:hidden;border:none;border-radius:9px;background:var(--plate);padding:0;flex-shrink:0;
    position:relative;opacity:.5;transition:opacity .12s;
  }
  .strip button.active{opacity:1;}
  .strip button.active::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:var(--accent);}
  .strip img{width:100%;height:100%;object-fit:cover;display:block;}
  .strip i{color:var(--muted);}
  .spec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:20px 0;}
  .spec{background:var(--surface);padding:11px 12px;}
  .spec .label{display:block;margin-bottom:3px;}
  .spec-val{font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .stock-dot{display:inline-block;width:6px;height:6px;border-radius:999px;margin-right:7px;}

  /* ---------- filament ---------- */
  .fil-types{display:flex;flex-wrap:wrap;gap:0;margin-bottom:14px;border:1px solid var(--line-strong);border-radius:11px;overflow:hidden;}
  .fil-type{
    padding:8px 13px;font-size:12px;background:var(--surface);border:none;
    border-right:1px solid var(--line);color:var(--muted);flex:1 1 auto;
  }
  .fil-type:last-child{border-right:none;}
  .fil-type.active{background:var(--ink);color:var(--paper);font-weight:600;}
  /* Twee regels: de soort, en wat het extra kost. Zo zie je vóór het klikken
     al wat een wissel met je prijs doet. Alleen deze knoppen — dezelfde klasse
     draagt elders een icoontje naast tekst, en dat hoort op één regel. */
  .fil-type.met-extra{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    line-height:1.35;padding:7px 11px;
  }
  .fil-type-extra{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.02em;opacity:.7;
  }
  .fil-type.active .fil-type-extra{opacity:.82;font-weight:400;}
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
  .swatch{position:relative;aspect-ratio:1/1;border:none;padding:0;}
  .swatch.active::after{content:"";position:absolute;inset:0;border:2px solid var(--accent);}
  .swatch .tick{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .fil-chosen{display:flex;align-items:center;gap:13px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);}
  .fil-chip{width:44px;height:44px;border-radius:9px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);}
  .fil-sheen{background-image:linear-gradient(115deg,rgba(255,255,255,0) 28%,rgba(255,255,255,.5) 44%,rgba(255,255,255,0) 60%);}
  .fil-gloss{background-image:linear-gradient(115deg,rgba(255,255,255,0) 32%,rgba(255,255,255,.11) 46%,rgba(255,255,255,0) 60%);}
  .fil-row{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line);}
  .fil-row:first-of-type{border-top:none;}
  .fil-dot{width:26px;height:26px;border-radius:7px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);}
  .toggle{width:42px;height:23px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface2);position:relative;flex-shrink:0;padding:0;}
  .toggle.on{background:var(--accent);border-color:var(--accent);}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:17px;border-radius:999px;background:var(--surface);transition:left .12s;}
  .toggle.on::after{left:22px;background:var(--accent-ink);}

  /* ---------- opdracht met onderdelen ---------- */
  .job-layout{display:grid;grid-template-columns:1fr;gap:24px;align-items:start;}
  @media(min-width:960px){.job-layout{grid-template-columns:minmax(0,1fr) 330px;gap:32px;}}
  .part-card{margin-bottom:14px;}
  /* voortgang van het snijden; het rekenen gebeurt in een aparte draad */
  .snijbalk{height:4px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:0 0 2px;}
  .snijbalk > span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .2s linear;}
  .part-name{font-size:15px;font-weight:600;margin:0;padding:9px 11px;}
  .part-body{display:grid;grid-template-columns:1fr;gap:18px;}
  @media(min-width:640px){.part-body{grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;}}
  .part-price{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .dropzone{
    border:1px dashed var(--line-strong);border-radius:16px;padding:40px 24px;text-align:center;
    background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:border-color .12s,background .12s;
  }
  .dropzone:hover{border-color:var(--accent);}
  .dropzone i{font-size:26px;color:var(--muted);}
  .dropzone:hover i{color:var(--accent);}
  .upload-box{border:1px dashed var(--line-strong);border-radius:16px;padding:40px 24px;text-align:center;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:10px;}

  /* ---------- opvolging ---------- */
  .track{display:flex;margin:18px 0 12px;}
  .track-step{flex:1;position:relative;text-align:center;}
  .track-step::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:1px;background:var(--line-strong);}
  .track-step:first-child::before{display:none;}
  .track-step.done::before,.track-step.active::before{background:var(--accent);}
  .track-dot{position:relative;z-index:1;display:block;width:13px;height:13px;border-radius:2px;background:var(--surface);border:1px solid var(--line-strong);margin:0 auto 8px;transform:rotate(45deg);}
  .track-step.done .track-dot{background:var(--accent);border-color:var(--accent);}
  .track-step.active .track-dot{background:var(--accent);border-color:var(--accent);width:15px;height:15px;}
  .track-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.3;display:block;padding:0 2px;}
  .track-step.active .track-label{color:var(--ink);font-weight:600;}
  .eta{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:12px 14px;font-size:13px;margin:14px 0;display:flex;align-items:flex-start;gap:10px;}
  .eta i{color:var(--accent);margin-top:2px;}
  .order-line{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line);}
  .order-line:first-of-type{border-top:none;}
  .detail-toggle{background:none;border:none;color:var(--accent);font-size:12px;padding:10px 0 0;display:inline-flex;align-items:center;gap:7px;font-weight:600;}

  /* ---------- betaling ---------- */
  .pay-card{background:var(--ink);color:var(--paper);border-radius:14px;padding:20px;margin-bottom:18px;}
  .pay-card .muted{color:rgba(240,239,234,.55);}
  .pay-strip{font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:.16em;margin:16px 0 6px;}
  .demo-banner{border:1px solid var(--accent);border-left-width:3px;border-radius:12px;padding:13px 15px;font-size:12.5px;margin-bottom:18px;background:var(--surface);}

  /* ---------- beheer ---------- */
  /* ---------- shopbeheer ----------
     Links waar je heen wil, rechts het scherm zelf. Op een telefoon wordt de
     lijst een rij knoppen die je opzij schuift. */
  .beheer{display:grid;grid-template-columns:1fr;gap:22px;align-items:start;}
  /* Op een telefoon een raster van grote knoppen: alles in één blik, en groot
     genoeg om met een duim te raken. Geen strook die je opzij moet schuiven. */
  .beheer-nav{
    display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:4px;
  }
  @media(min-width:560px) and (max-width:899px){
    .beheer-nav{grid-template-columns:repeat(4,1fr);}
  }
  .beheer-nav button{
    display:flex;align-items:center;gap:9px;padding:13px 12px;border-radius:12px;
    border:1px solid var(--line);background:var(--surface);color:var(--muted);
    font-size:13px;font-weight:500;white-space:nowrap;text-align:left;min-height:48px;
  }
  .beheer-nav button:hover{background:var(--surface2);color:var(--ink);}
  .beheer-nav button.active{background:var(--ink);color:var(--paper);}
  .beheer-nav button i{width:15px;flex-shrink:0;text-align:center;}
  .beheer-nav button span{overflow:hidden;text-overflow:ellipsis;}
  .beheer-nav .telbol{
    margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;
    font-family:'IBM Plex Mono',monospace;font-size:10px;padding:1px 6px;flex-shrink:0;
  }
  .beheer-nav button.active .telbol{background:var(--paper);color:var(--ink);}
  @media(min-width:900px){
    .beheer{grid-template-columns:210px minmax(0,1fr);gap:34px;}
    .beheer-nav{position:sticky;top:86px;display:flex;flex-direction:column;gap:4px;margin:0;}
    .beheer-nav button{
      width:100%;justify-content:flex-start;padding:9px 13px;min-height:0;
      border-color:transparent;background:none;border-radius:10px;
    }
  }
  /* de afvinklijst per bestelling */
  .stappen{background:var(--surface2);border-radius:12px;margin:0 0 12px;overflow:hidden;}
  .stappen.af{background:color-mix(in srgb, var(--accent) 10%, var(--surface2));}
  .stappen > summary{
    display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;list-style:none;min-height:44px;
  }
  .stappen > summary::-webkit-details-marker{display:none;}
  .stappen > summary::after{content:"⌄";margin-left:2px;color:var(--muted);font-size:15px;line-height:1;}
  .stappen[open] > summary::after{content:"⌃";}
  .stappen-body{padding:0 12px 12px;}
  .stappen-balk{flex:1;min-width:40px;max-width:110px;margin-left:auto;height:4px;border-radius:999px;background:var(--line);overflow:hidden;}
  .stappen-balk > span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s;}
  .stap{

  .bestelvak-body{padding:0 15px 15px;}
  .deelvak{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden;background:var(--surface);}
  .deelvak > summary{
    display:flex;align-items:center;gap:9px;padding:11px 12px;cursor:pointer;list-style:none;

             letter-spacing:.1em;text-transform:uppercase;margin-top:5px;}

  .img-add:hover{border-color:var(--accent);color:var(--accent);}

  @media(max-width:560px){

  /* =====================================================================
     Beweging
     Twee regels. Eén: wat al op het scherm staat, blijft staan. De site tekent
     zichzelf opnieuw bij elke kleinigheid — een nieuwe bestelling, een getypte
     letter — en als dan telkens de hele pagina opnieuw komt opzetten, schokt
     het beeld voortdurend. Alles wat binnenkomt hangt daarom aan .wissel, en
     die klasse zet render() alleen bij een échte paginawissel.
     Twee: wat wél beweegt, moet je kunnen zien. Een schokje van zes pixels
     leest als haperen; een duidelijke, zachte beweging leest als animatie.
     Wie in zijn toestel om minder beweging vraagt, krijgt onderaan alles uit.
     ===================================================================== */
  /* Een nieuwe pagina komt op met licht en diepte, niet met een sprong: geen
     verschuiving betekent dat de tekst niet lijkt te verspringen. */
  @keyframes paginain  { from { opacity:0; transform:scale(.985); } to { opacity:1; transform:none; } }
  @keyframes opkomen   { from { opacity:0; transform:translateY(18px) scale(.98); } to { opacity:1; transform:none; } }
  /* een lade rolt echt open: de inhoud wordt van boven naar beneden vrijgegeven */
  @keyframes uitvouwen { from { opacity:0; transform:translateY(-10px); clip-path:inset(0 0 100% 0); }
                         to   { opacity:1; transform:none;              clip-path:inset(0 0 0 0);    } }
  @keyframes indraaien { from { opacity:0; transform:scale(.9);        } to { opacity:1; transform:none; } }
  @keyframes omhoog    { from { opacity:0; transform:translate(-50%,28px) scale(.94); }
                         to   { opacity:1; transform:translate(-50%,0) scale(1); } }
  @keyframes tikje     { 0%{transform:scale(1);} 40%{transform:scale(1.28);} 100%{transform:scale(1);} }
  @keyframes pols      { 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent);}
                         70%{box-shadow:0 0 0 12px transparent;} 100%{box-shadow:0 0 0 0 transparent;} }

  /* --- alleen bij een paginawissel: het scherm komt één keer op --- */
  #app.wissel > div{ animation:paginain .38s cubic-bezier(.22,.7,.3,1) both; }

  /* de collectie druppelt binnen in plaats van in één klap te staan */
  #app.wissel .grid > .card{ animation:opkomen .46s cubic-bezier(.22,.7,.3,1) both; }
  #app.wissel .grid > .card:nth-child(1){animation-delay:.04s;} #app.wissel .grid > .card:nth-child(2){animation-delay:.10s;}
  #app.wissel .grid > .card:nth-child(3){animation-delay:.16s;} #app.wissel .grid > .card:nth-child(4){animation-delay:.22s;}
  #app.wissel .grid > .card:nth-child(5){animation-delay:.28s;} #app.wissel .grid > .card:nth-child(6){animation-delay:.34s;}
  #app.wissel .grid > .card:nth-child(n+7){animation-delay:.40s;}

  /* onderdelen, bestellingen en winkelwagenvakken schuiven mee binnen */
  #app.wissel .part-card, #app.wissel .bestelvak,
  #app.wissel .order-card, #app.wissel .admin-row, #app.wissel .wagen-kaart{
    animation:opkomen .42s cubic-bezier(.22,.7,.3,1) both;
  }
  #app.wissel .part-card:nth-of-type(2), #app.wissel .bestelvak:nth-of-type(2),
  #app.wissel .order-card:nth-of-type(2), #app.wissel .wagen-kaart:nth-of-type(2){animation-delay:.06s;}
  #app.wissel .part-card:nth-of-type(3), #app.wissel .bestelvak:nth-of-type(3),
  #app.wissel .order-card:nth-of-type(3), #app.wissel .wagen-kaart:nth-of-type(3){animation-delay:.12s;}
  #app.wissel .part-card:nth-of-type(n+4), #app.wissel .bestelvak:nth-of-type(n+4),
  #app.wissel .order-card:nth-of-type(n+4), #app.wissel .wagen-kaart:nth-of-type(n+4){animation-delay:.18s;}

  /* --- altijd: wat jíj opendoet, gaat zichtbaar open --- */
  .kleurkiezer-lade, .stappen-body, .bestelregel-body, .vak-body, .slot-body,
  .bestelvak-body, .deelvak-body, .wagenvak-body{
    animation:uitvouwen .34s cubic-bezier(.22,.7,.3,1) both;
  }
  .kleurkiezer{ transition:border-color .2s, background .2s, box-shadow .2s; }
  .kleurkiezer.open{ animation:indraaien .28s cubic-bezier(.22,.7,.3,1) both; }
  /* het vak dat nog wacht trekt even de aandacht */
  .kleurkiezer.leeg.open{ animation:indraaien .28s cubic-bezier(.22,.7,.3,1) both, pols 1.6s ease-out .25s 2; }
  .kleurkiezer-nr{ transition:background .22s, color .22s, transform .22s; }
  .kleurkiezer.gekozen .kleurkiezer-nr{ animation:tikje .34s cubic-bezier(.3,1.4,.5,1) both; }
  .kleurkiezer-keuze .fil-chip{ transition:transform .2s; }

  /* knoppen geven mee onder je vinger */
  .btn, .fil-type, .swatch, .tab, .stap, .beheer-nav button, .bestelregel-kop, .kleurkiezer-knop{
    transition:transform .14s cubic-bezier(.3,1.3,.5,1), background .16s, border-color .16s, color .16s, opacity .16s;
  }
  .btn:active, .fil-type:active, .tab:active, .stap:active,
  .beheer-nav button:active, .bestelregel-kop:active, .kleurkiezer-knop:active{ transform:scale(.97); }
  .swatch:hover{ transform:translateY(-2px); }
  .swatch:active{ transform:scale(.9); }
  .swatch.active{ animation:tikje .3s cubic-bezier(.3,1.4,.5,1) both; }
  .card{ transition:transform .22s cubic-bezier(.22,.7,.3,1), box-shadow .22s, background .16s; }
  .card:hover{ transform:translateY(-4px); box-shadow:0 10px 26px rgba(0,0,0,.14); }
  .cart-item, .wagenvak, .bestelvak, .deelvak{ transition:border-color .2s, box-shadow .2s, background .2s; }
  .wagenvak-kop, .bestelvak-kop, .deelvak > summary{ transition:background .16s; }

  /* de melding onderaan schuift duidelijk omhoog in beeld */
  .toast:not(.hidden){ animation:omhoog .4s cubic-bezier(.22,.9,.28,1) both; }
  .toast .toast-actie{
    margin-left:4px;background:var(--paper);color:var(--ink);border:none;border-radius:8px;
    padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;
    transition:transform .14s cubic-bezier(.3,1.3,.5,1);
  }
  .toast .toast-actie:active{ transform:scale(.96); }

  /* het aantal in de winkelwagen springt op als er iets bij komt */
  .cart-count.bump{ animation:tikje .42s cubic-bezier(.3,1.5,.5,1) both; }

  .stappen-balk > span, .snijbalk > span{ transition:width .35s cubic-bezier(.22,.7,.3,1); }

  @media(prefers-reduced-motion:reduce){
    *, *::before, *::after{
      animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }

  /* ---------- skelet ---------- */
  .skel{background:var(--surface2);position:relative;overflow:hidden;}
  .skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--line),transparent);animation:shimmer 1.5s infinite;}
  @keyframes shimmer{to{transform:translateX(100%)}}
  @media(prefers-reduced-motion:reduce){.skel::after{animation:none;}}
  @media(max-width:640px){.hide-sm{display:none;}}
</style>

<!-- Firebase SDK (modular, v10) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, where, orderBy, serverTimestamp, increment, Bytes
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
/* =====================================================================
   Modellen bewaren zonder Firebase Storage.
   Storage vraagt sinds eind 2024 een betaalplan. Firestore niet, en daar
   past een model prima in: we persen het samen en knippen het in stukken
   die elk onder de documentgrens van 1 MB blijven.
   ===================================================================== */
const CHUNK_BYTES = 700000;          // ruim onder de grens van 1 MiB
const MAX_FIRESTORE_BYTES = 24 * 1024 * 1024;

/* Vingerafdruk van het bestand. Bij het ophalen rekenen we hem opnieuw uit;
   komt hij niet overeen, dan is er onderweg iets misgegaan en zeggen we dat
   in plaats van stilzwijgend een kapot bestand af te leveren. */
async function fileHash(bytes){
  if (!crypto?.subtle) return null;
  const d = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
}

/* Schrijft één bestand als een reeks documenten onder de opdracht.
   Bewust ongewijzigd: de bytes gaan er precies zo in als ze binnenkwamen. */
/* `hok` is de collectie waar het bij hoort: "uploads" voor het model van een
   klant, "products" voor het printbestand dat jij zelf bij een product zet. */
async function storeFileInFirestore(jobId, index, file, onProgress, hok = "uploads"){
  const raw = new Uint8Array(await file.arrayBuffer());
  if (raw.length > MAX_FIRESTORE_BYTES){
    throw new Error(`"${file.name}" is ${(raw.length/1024/1024).toFixed(1)}MB — dat is te groot om zonder aparte opslag te bewaren (max ${MAX_FIRESTORE_BYTES/1024/1024}MB)`);
  }
  const sha = await fileHash(raw);
  const chunks = Math.ceil(raw.length / CHUNK_BYTES);
  for (let c = 0; c < chunks; c++){
    const slice = raw.subarray(c * CHUNK_BYTES, (c + 1) * CHUNK_BYTES);
    await setDoc(doc(db, hok, jobId, "files", `${index}_${c}`), { b: Bytes.fromUint8Array(slice) });
    if (onProgress) onProgress(Math.min(file.size, (c + 1) / chunks * file.size));
  }
  return { kind: "firestore", chunks, bytes: raw.length, sha };
}

/* Haalt zo'n bestand weer op, controleert het en biedt het aan als download. */
async function downloadStoredFile(jobId, index, desc, fileName, hok = "uploads"){
  const parts = [];
  for (let c = 0; c < desc.chunks; c++){
    const snap = await getDoc(doc(db, hok, jobId, "files", `${index}_${c}`));
    if (!snap.exists()) throw new Error("een stuk van het bestand ontbreekt");
    parts.push(snap.data().b.toUint8Array());
  }
  const total = parts.reduce((s, p) => s + p.length, 0);
  const joined = new Uint8Array(total);
  let at = 0;
  for (const p of parts){ joined.set(p, at); at += p.length; }

  // oudere opdrachten zijn nog samengeperst opgeslagen
  const raw = desc.gz && typeof DecompressionStream !== "undefined"
    ? new Uint8Array(await new Response(new Blob([joined]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())
    : joined;

  if (desc.bytes && raw.length !== desc.bytes){
    throw new Error(`het bestand is onvolledig (${raw.length} van ${desc.bytes} bytes)`);
  }
  if (desc.sha){
    const nu = await fileHash(raw);
    if (nu && nu !== desc.sha) throw new Error("de vingerafdruk klopt niet — het bestand is onderweg gewijzigd");
  }

  const url = URL.createObjectURL(new Blob([raw], { type: "application/octet-stream" }));
  const a = document.createElement("a");
  a.href = url; a.download = fileName || "model.stl";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

const TALEN = [["en", "English"], ["nl", "Nederlands"]];
const LOCALES = { en: "en-GB", nl: "nl-BE" };
const STANDAARDTAAL = "en";

const kentTaal = (v) => TALEN.some(([k]) => k === v);
/* Welke taal geldt er nu? In volgorde: wat je deze sessie koos, wat er in je
   profiel staat (dan gaat het mee naar je telefoon), wat deze browser onthield,
   en anders wat de winkel als standaard heeft. */
function taal(){
  // Alleen wat je deze sessie zelf aanklikte staat in __taal; de rest lezen we
  // elke keer opnieuw. Cachten we localStorage hierin, dan zou een oude keuze
  // in deze browser het winnen van wat er in je profiel staat — precies
  // omgekeerd aan wat je verwacht als je ergens anders inlogt.
  if (state.__taal) return state.__taal;
  if (kentTaal(state.profile?.taal)) return state.profile.taal;
  try{
    const v = localStorage.getItem("lc_taal");
    if (kentTaal(v)) return v;
  }catch(e){}
  const w = winkel().taal;
  return kentTaal(w) ? w : STANDAARDTAAL;
}
function zetTaal(v){
  if (!kentTaal(v)) return;
  state.__taal = v;
  try{ localStorage.setItem("lc_taal", v); }catch(e){}
  document.documentElement.lang = v;
  // Ben je ingelogd, dan hoort je keuze bij je account: dan lees je de shop op
  // je telefoon in dezelfde taal zonder daar opnieuw te moeten kiezen.
  if (state.user){
    state.profile = { ...(state.profile || {}), taal: v };
    updateDoc(doc(db, "users", state.user.uid), { taal: v }).catch(() => {});
  }
  render();
}
/* t("sleutel") geeft de tekst in de huidige taal. Ontbreekt er een vertaling,
   dan valt hij terug op het Engels — nooit op de sleutel zelf, want dan zou er
   iets als "cart.leeg" op het scherm komen. */
function zoekTekst(k, sleutel, vars){
  const rij = TEKST[sleutel];
  let uit = rij ? (rij[k] || rij.en || sleutel) : sleutel;
  if (vars) for (const [naam, v] of Object.entries(vars)) uit = uit.split("{" + naam + "}").join(v);
  return uit;
}
function t(sleutel, vars){ return zoekTekst(taal(), sleutel, vars); }
/* De taal van de klant, niet die van wie op de knop drukt. Een verzendmail
   verstuur jij vanuit je eigen browser; stond die op Nederlands, dan kreeg een
   Franse klant zijn bericht alsnog in het Nederlands. Elke bestelling onthoudt
   daarom in welke taal ze geplaatst is. */
const bestelTaal = (o) => TALEN.some(([k]) => k === o?.taal) ? o.taal : STANDAARDTAAL;
function mt(o, sleutel, vars){ return zoekTekst(bestelTaal(o), sleutel, vars); }
const mloc = (o) => LOCALES[bestelTaal(o)] || LOCALES.en;
/* Sommige teksten horen bij hun gegevens te staan in plaats van in TEKST — de
   materiaalgids bijvoorbeeld, waar de drie talen bij het materiaal zelf horen.
   vt() kiest daar de juiste taal uit. */
function vt(o){ return typeof o === "string" ? o : (o ? (o[taal()] || o.en || "") : ""); }
/* Landen en bestelstatussen staan met hun Nederlandse naam in de databank —
   dat is de sleutel waar alles op draait en die veranderen we niet. Op het
   scherm hoort er de naam in de taal van de bezoeker te staan. Kent de lijst
   een waarde niet, dan tonen we hem zoals hij is. */
function landTekst(c){ return TEKST["land." + c] ? t("land." + c) : (c || ""); }
function statusTekst(s){ return TEKST["status." + s] ? t("status." + s) : (s || ""); }
const loc = () => LOCALES[taal()] || LOCALES.en;
function fmtEUR(n){ return new Intl.NumberFormat(loc(),{style:"currency",currency:"EUR"}).format(n); }
/* Een melding onderaan. Hoort er iets bij dat je meteen kunt doen — na het
   toevoegen wil je vaak recht naar je winkelwagen — dan komt daar een knop bij
   te staan in plaats van dat je zelf moet zoeken. */
function notify(msg, actie){
  const vak = document.getElementById('toast');
  vak.innerHTML = '<i class="fa-solid fa-circle-check" aria-hidden="true"></i> <span style="min-width:0;">'
    + esc(msg) + '</span>';
  if (actie){
    const knop = document.createElement('button');
    knop.className = 'toast-actie';
    knop.textContent = actie.tekst;
    knop.onclick = () => { verbergToast(); actie.doe(); };
    vak.appendChild(knop);
  }
  vak.classList.remove('hidden');
  // opnieuw laten binnenkomen, ook als hij al stond
  vak.style.animation = 'none';
  void vak.offsetWidth;
  vak.style.animation = '';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(verbergToast, actie ? 6000 : 3000);
}
/* Weg is weg: de knop mag niet als onzichtbaar overblijfsel blijven staan,
   want dan is hij nog steeds aan te klikken met een toetsenbord. */
function verbergToast(){
  const vak = document.getElementById('toast');
  vak.classList.add('hidden');
  vak.innerHTML = "";
}

const SITE_URL = location.origin + location.pathname;
/* Links in een e-mail wijzen naar een plek in de shop, niet naar de voorpagina.
   Alles zit achter een # zodat GitHub Pages er niets voor hoeft te kunnen. */
const orderLink   = (o) => `${SITE_URL}?bestelling=${encodeURIComponent(o.id)}`;
/* De link naar één product, om door te sturen. */
const productLink = (p) => `${SITE_URL}?product=${encodeURIComponent(p.id)}`;
const confirmLink = (o) => `${SITE_URL}?ontvangen=${encodeURIComponent(o.id)}`;

/* Leest zo'n link uit en onthoudt waar we naartoe moeten. Het adres wordt
   daarna schoongeveegd, zodat herladen niet opnieuw dezelfde sprong maakt. */
function leesLink(){
  // Een gewone parameter (?bestelling=…) overleeft mailclients en doorstuurders
  // beter dan een #-deel. Dat laatste blijven we lezen voor berichten die al
  // verstuurd zijn.
  const q = new URLSearchParams(location.search);
  if (q.get("bestelling")) return { view: "account", orderId: q.get("bestelling") };
  if (q.get("ontvangen"))  return { view: "account", orderId: q.get("ontvangen"), actie: "ontvangen" };
  // ?product=… is de link die je doorstuurt. Het product zelf is er nog niet —
  // dat komt met de collectie binnen — dus we onthouden alleen waar we heen
  // moeten en handelen het af zodra de producten er zijn.
  if (q.get("product")) return { view: "product", productId: q.get("product") };
  const p = q.get("pagina");
  if (p && ["account","archief","custom","cart","shop","instellingen"].includes(p)) return { view: p };

  const h = decodeURIComponent(location.hash || "").replace(/^#/, "");
  if (!h) return null;
  const [wat, id] = h.split("/");
  if (wat === "product" && id) return { view: "product", productId: id };
  if (wat === "bestelling" && id) return { view: "account", orderId: id };
  if (wat === "ontvangen" && id) return { view: "account", orderId: id, actie: "ontvangen" };
  if (["account","archief","custom","cart","shop","instellingen"].includes(wat)) return { view: wat };
  return null;
}
const __link = leesLink();
if (__link) history.replaceState(null, "", SITE_URL);

/* --------------------------- state --------------------------- */
/* Waar iemand was toen hij herlaadde. Inloggen en betalen slaan we over: daar
   halverwege terugkomen helpt niemand. */
const HERSTELBARE_VIEWS = ["shop","product","custom","cart","account","admin","archief","bedankt","info","instellingen"];
function bewaardeView(){
  try{
    const v = JSON.parse(sessionStorage.getItem('lc_view') || "null");
    if (v && HERSTELBARE_VIEWS.includes(v.view)) return v;
  }catch(e){}
  return null;
}
const __start = __link || bewaardeView();

let state = {
  view: __start?.view || "shop",
  selectedProductId: __start?.productId || null,
  __bedankt: __start?.bedankt || null,
  // waar de link uit de e-mail naartoe wees; wordt afgehandeld zodra de
  // bestellingen binnen zijn
  linkOrder: __link?.orderId || null,
  linkActie: __link?.actie || null,
  products: [],
  productsLoaded: false,
  productsError: null,
  productsStalled: false,
  ordersError: null,
  filaments: [],
  orders: [],
  cart: JSON.parse(sessionStorage.getItem('lc_cart') || "[]"),
  user: null,       // firebase auth user
  profile: null,    // {name, address, isAdmin}
  selectedProduct: null,
};

function saveCart(){ sessionStorage.setItem('lc_cart', JSON.stringify(state.cart)); }
function cartTotal(){ return state.cart.reduce((s,i)=>s+i.price*i.qty,0); }
function cartCount(){ return state.cart.reduce((s,i)=>s+i.qty,0); }

function go(view, extra){
  state.view = view;
  if (extra) Object.assign(state, extra);
  bewaarView();
  render();
  window.scrollTo(0,0);
}
/* Onthoudt de huidige pagina, zodat een herlaadbeurt je niet terugzet op de
   startpagina. Het gekozen product bewaren we op naam, niet als voorwerp. */
function bewaarView(){
  try{
    sessionStorage.setItem('lc_view', JSON.stringify({
      view: HERSTELBARE_VIEWS.includes(state.view) ? state.view : "shop",
      productId: state.selectedProduct?.id || state.selectedProductId || null,
      // herlaad je vlak na het betalen, dan hoor je je bedankt weer te zien
      bedankt: state.__bedankt || null,
    }));
  }catch(e){}
}
window.go = go;

/* Deze adressen krijgen automatisch beheerdersrechten. Dit is gemak, geen
   beveiliging: de echte grens ligt in de Firestore-regels, want alles wat
   hier staat draait in de browser van de bezoeker. */
/* Dit adres is altijd beheerder. Het staat vast in de code zodat je jezelf
   nooit buiten kunt sluiten — verwijder je per ongeluk alle beheerders uit de
   instellingen, dan kom je hiermee nog binnen. Wie er verder bij mag, zet je
   in Shopbeheer → Winkelgegevens.
   Let op: dit is gemak, geen beveiliging. De echte grens ligt in de
   Firestore-regels, want alles hier draait in de browser van de bezoeker. */
const HOOFD_BEHEERDER = "jelle@mattan.be";
function beheerderMails(){
  return [HOOFD_BEHEERDER, ...(winkel().beheerders || [])]
    .map(e => String(e || "").trim().toLowerCase()).filter(Boolean);
}
function isAdminEmail(email){
  return beheerderMails().includes(String(email || "").trim().toLowerCase());
}

/* Staat de winkel op pauze? Dan zegt hij dat bovenaan, en jij bepaalt of er
   ondertussen besteld mag worden. */
function pauze(){
  const w = winkel();
  if (!w.pauze) return null;
  // een einddatum die voorbij is, zet de pauze vanzelf uit
  if (w.pauzeTot && new Date(w.pauzeTot + "T23:59:59").getTime() < Date.now()) return null;
  return {
    // Het bericht typ jij zelf; dat laten we staan zoals het er staat — een
    // eigen zin automatisch vertalen kunnen we niet. Typ je niets, dan komt er
    // wel een zin in de taal van de bezoeker.
    bericht: w.pauzeBericht || t("pauze.standaard"),
    tot: w.pauzeTot || null,
    bestellen: w.pauzeBestellen !== false,
  };
}

/* Tijdens registreren schrijft doRegister het profiel zelf. Deze callback vuurt
   al vlak na het aanmaken van het account, dus vóór dat schrijven klaar is —
   zonder deze vlag zou hij een leeg profiel aanmaken en naam en adres wissen. */
let registering = false;

onAuthStateChanged(auth, async (u) => {
  state.user = u;
  if (u) {
    if (!registering) try{
      state.profile = await loadOrCreateProfile(u);
      state.profileError = null;
    }catch(err){
      // Firestore even niet bereikbaar mag je niet uitloggen. We werken verder
      // met wat Auth ons geeft, zodat de accountknop blijft kloppen.
      state.profileError = err;
      state.profile = state.profile || {
        name: (u.email || "").split("@")[0],
        email: u.email, address: {}, isAdmin: isAdminEmail(u.email),
      };
    }
    // je taal en je bewaarde producten komen nu uit je profiel; wat er in deze
    // browser stond wordt daarbij gevoegd in plaats van overschreven
    state.__taal = null;
    await voegBewaardeSamen();
    listenOrders();
    listenProducts(); // opnieuw luisteren (beheerder ziet alles)
  } else {
    state.profile = null;
    state.profileError = null;
    state.orders = [];
    // uitgelogd val je terug op wat deze browser onthield
    state.__taal = null;
    state.__bewaard = null;
    listenProducts();
  }
  bewaakView();
  renderAuthNav();
  render();
});

/* Na een herlaadbeurt mag een teruggezette pagina niet meer tonen dan mag. */
function bewaakView(){
  if (state.view === "admin" && !state.profile?.isAdmin) state.view = "shop";
  if (state.view === "account" && !state.user) state.view = "shop";
  bewaarView();
}

/* Haalt het profiel op, maakt het aan als het ontbreekt, en zorgt dat de
   vaste beheerdersadressen hun rechten krijgen. */
async function loadOrCreateProfile(u){
  const profileRef = doc(db, "users", u.uid);
  const snap = await getDoc(profileRef);
  if (!snap.exists()){
    const profile = {
      name: (u.email || "").split("@")[0],
      email: u.email, address: {},
      isAdmin: isAdminEmail(u.email), createdAt: Date.now(),
    };
    await setDoc(profileRef, profile);
    return profile;
  }
  const profile = snap.data();
  if (isAdminEmail(u.email) && !profile.isAdmin){
    await updateDoc(profileRef, { isAdmin: true });
    profile.isAdmin = true;
  }
  return profile;
}

/* =====================================================================
   Je adres wordt onthouden
   Wie eenmaal iets besteld heeft, hoeft zijn straat niet elke keer opnieuw te
   typen. We bewaren het op twee plaatsen: in dit toestel (dan staat het er al
   vóór het profiel geladen is, en ook als je nog niet ingelogd bent) en in je
   profiel (dan gaat het mee naar je telefoon of een andere browser).
   ===================================================================== */
const ADRES_SLEUTEL = 'lc_adres';
function bewaardAdres(){
  try{ return JSON.parse(localStorage.getItem(ADRES_SLEUTEL) || "null"); }catch(e){ return null; }
}
/* Wat de velden bij het afrekenen moeten tonen als je nog niets getypt hebt. */
function bekendAdres(){

/* =====================================================================
   Bewaarde producten
   Een hartje op een kaart. Wie nog twijfelt, legt iets opzij in plaats van het
   in zijn winkelwagen te duwen — en vindt het later terug bij Instellingen.

   Het staat in je browser én, als je ingelogd bent, in je profiel. Zo ben je
   het niet kwijt als je op je telefoon verder kijkt, en werkt het toch al
   voordat je een account hebt.
   ===================================================================== */
const BEWAARD_SLEUTEL = "lc_bewaard";
function inBrowserBewaard(){
  try{
    const v = JSON.parse(localStorage.getItem(BEWAARD_SLEUTEL) || "[]");
    return Array.isArray(v) ? v : [];
  }catch(e){ return []; }
}
function bewaarde(){
  if (state.__bewaard) return state.__bewaard;
  return Array.isArray(state.profile?.bewaard) ? state.profile.bewaard : inBrowserBewaard();
}
/* Wie eerst rondkeek en dan pas inlogde, heeft twee lijstjes: één in deze
   browser en één bij zijn account. Weggooien van het ene is altijd fout, dus
   voegen we ze samen — wat je hier net opzij legde staat vooraan. */
async function voegBewaardeSamen(){
  if (!state.user) return;
  const hier = inBrowserBewaard();
  const daar = Array.isArray(state.profile?.bewaard) ? state.profile.bewaard : [];
  const samen = [...new Set([...hier, ...daar])].slice(0, 60);
  state.__bewaard = null;
  if (samen.length === daar.length && samen.every((x, i) => x === daar[i])) return;
  state.profile = { ...(state.profile || {}), bewaard: samen };
  try{ localStorage.setItem(BEWAARD_SLEUTEL, JSON.stringify(samen)); }catch(e){}
  try{ await updateDoc(doc(db, "users", state.user.uid), { bewaard: samen }); }catch(e){}
}
const isBewaard = (id) => bewaarde().includes(id);
function zetBewaard(id){
  const nu = bewaarde();
  const uit = nu.includes(id) ? nu.filter(x => x !== id) : [id, ...nu].slice(0, 60);
  state.__bewaard = uit;
  try{ localStorage.setItem(BEWAARD_SLEUTEL, JSON.stringify(uit)); }catch(e){}
  if (state.user){
    state.profile = { ...(state.profile || {}), bewaard: uit };
    updateDoc(doc(db, "users", state.user.uid), { bewaard: uit }).catch(() => {});
  }
  const p = (state.products || []).find(x => x.id === id);
  notify(t(uit.includes(id) ? "bewaar.erbij" : "bewaar.eraf", { naam: p?.name || "" }));
  render();
}
/* De bewaarde producten die nog bestaan, in de volgorde waarin je ze opzij
   legde. Iets dat uit de collectie gehaald is, laten we stilletjes weg. */
function bewaardeProducten(){
  return bewaarde().map(id => (state.products || []).find(p => p.id === id))
    .filter(p => p && !verborgen(p));
}
window.__zetBewaard = zetBewaard;
async function onthoudAdres(address, land){
  if (!address || !address.street) return;
  const kaal = { street: address.street || "", zip: address.zip || "", city: address.city || "" };
  try{ localStorage.setItem(ADRES_SLEUTEL, JSON.stringify({ ...kaal, land: land || null })); }catch(e){}
  if (!state.user) return;
  const oud = state.profile?.address || {};
  const gelijk = oud.street === kaal.street && oud.zip === kaal.zip && oud.city === kaal.city
    && state.profile?.shippingCountry === (land || null);
  if (gelijk) return;                       // niets veranderd, niets te schrijven
  state.profile = { ...(state.profile || {}), address: kaal, shippingCountry: land || null };
  try{
    await updateDoc(doc(db, "users", state.user.uid), { address: kaal, shippingCountry: land || null });
  }catch(e){
    // Het adres staat sowieso al in dit toestel; dit is alleen de kopie die
    // meegaat naar een ander apparaat. Daar hoeft niemand een melding voor.
    console.warn("adres niet in het profiel bewaard:", e);
  }
}

async function doRegister(name, email, password, address){

/* --------------------------- products (realtime) --------------------------- */
function listenProducts(){
  const q = query(collection(db, "products"), orderBy("name"));
  // Bestaat de database niet, dan roept Firestore géén foutcallback aan maar
  // blijft het stil opnieuw proberen. Zonder deze timer blijft de shop dan
  // eindeloos op "laden" staan zonder uitleg.
  clearTimeout(state.__productsTimer);
  state.__productsTimer = setTimeout(() => {
    if (!state.productsLoaded){
      state.productsStalled = true;
      if (state.view === "shop") render();
    }
  }, 8000);
  onSnapshot(q, (snap) => {
    clearTimeout(state.__productsTimer);
    state.products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.productsLoaded = true;
    state.productsError = null;
    state.productsStalled = false;
    // Het geopende product opnieuw oppikken uit wat er net binnenkwam. Dat is
    // nodig na een herlaadbeurt, maar ook gewoon tijdens het kijken: verandert
    // het product ondertussen, dan bleef je anders naar de oude versie staren.
    const wil = state.selectedProduct?.id || state.selectedProductId;
    if (wil){
      const p = state.products.find(x => x.id === wil);
      if (p){ state.selectedProduct = p; onthoudBekeken(p.id); }
      else if (state.view === "product"){ state.selectedProduct = null; state.view = "shop"; }
    }
    if (state.view === "shop" || state.view === "product" || state.view === "admin") render();
  }, (err) => {
    clearTimeout(state.__productsTimer);
    state.productsLoaded = true;
    state.productsError = err;
    state.productsStalled = false;
    render();
  });
}

const FILAMENT_DOC = () => doc(db, "settings", "filaments");

/* =====================================================================
   Hoeveel zit er nog op de spoel
   Er is geen productvoorraad — alles wordt op bestelling geprint. Filament is
   wél eindig, en middenin een print zonder komen te zitten is het enige echte
   voorraadprobleem dat je hebt. Je vult per kleur in hoeveel gram er nog op
   staat; dat telt af zodra je een stuk afvinkt als geprint.

   Laat je het leeg, dan houden we het niet bij en zwijgen we erover. Alleen
   wat je zelf invult telt mee — een cijfer verzinnen is erger dan geen cijfer.
   ===================================================================== */
const BIJNA_OP_GRAM = 150;              // ongeveer één avond printen
function bijnaOp(f){
  return f?.enabled && Number.isFinite(f.voorraad) && f.voorraad <= BIJNA_OP_GRAM;
}
function bijnaOppe(){ return (state.filaments || []).filter(bijnaOp); }
/* Trekt het verbruik van een geprint stuk van de juiste spoelen af. Bij een
   model met kleurvakken verdelen we het gewicht over de onderdelen, net zoals
   de prijs dat doet. Negatief mag: dan weet je dat je rol echt op is. */
async function boekFilamentAf(item, richting){
  const gram = itemGram(item) * (item.qty || 1);
  if (!gram) return;
  const kleuren = itemKleuren(item);
  if (!kleuren.length) return;
  const perStuk = gram / kleuren.length;
  const items = (state.filaments || []).map(f => ({ ...f }));
  let iets = false;
  for (const k of kleuren){
    const f = items.find(x => x.id === k.id);
    if (!f || !Number.isFinite(f.voorraad)) continue;
    f.voorraad = Math.round((f.voorraad - perStuk * richting) * 10) / 10;
    iets = true;
  }
  if (!iets) return;
  try{
    await saveFilaments(items);
    const op = items.filter(bijnaOp);
    if (richting > 0 && op.length){
      notify(`Let op: ${op.map(f => f.name).join(", ")} ${op.length === 1 ? "is" : "zijn"} bijna op`);
    }
  }catch(err){ /* het printen zelf is belangrijker dan het cijfertje */ }
}

async function saveFilaments(items){
  await setDoc(FILAMENT_DOC(), { items });
}

const WINKEL_DOC = () => doc(db, "settings", "shop");
const DEFAULT_WINKEL = {

  land: "België", email: "", telefoon: "", btw: "", ondernemingsnummer: "",

  opDePrinter: null,
};
function winkel(){ return { ...DEFAULT_WINKEL, ...(state.winkel || {}) }; }
/* De levertijd typ jij in je eigen woorden ("3 tot 5 werkdagen"). Op een
   Engelse of Franse pagina staat dat er raar. Zitten er één of twee getallen in
   — en dat is bij zo'n zin bijna altijd zo — dan bouwen we de zin opnieuw op in
   de taal van de bezoeker. Lukt dat niet, dan tonen we jouw tekst zoals hij is:
   liever jouw woorden dan een verzonnen vertaling. */
function levertijdTekst(){
  const ruw = (winkel().levertijd || "").trim();
  const cijfers = ruw.match(/\d+/g);
  if (!cijfers || !cijfers.length || cijfers.length > 2) return ruw;
  return cijfers.length === 2
    ? t("alg.werkdagenVan", { a: cijfers[0], b: cijfers[1] })
    : t("alg.werkdagen", { n: cijfers[0] });
}
function listenWinkel(){
  onSnapshot(WINKEL_DOC(), (snap) => {
    state.winkel = snap.exists() ? snap.data() : null;
    herkeurBeheerder();
    // de pauze en de beheerderslijst raken bijna elk scherm
    render();
  }, () => { /* valt terug op de standaardwaarden */ });
}
/* Wie er beheerder is staat in de instellingen, en die komen later binnen dan
   het profiel. Zonder deze stap zou iemand die je net hebt toegevoegd pas bij
   zijn vólgende bezoek in Shopbeheer geraken.

   Iemand zijn rechten áfnemen doen we alleen als de winkelgegevens er echt
   staan. Bestaat dat document nog niet, dan is de lijst leeg omdat er nooit
   iets is ingevuld — niet omdat jij iemand hebt weggehaald. Zonder dit
   onderscheid verloor een beheerder die met de hand was aangezet zijn toegang
   bij de eerstvolgende paginalading. */
async function herkeurBeheerder(){
  if (!state.user || !state.profile) return;
  const hoort = isAdminEmail(state.user.email);
  if (hoort === !!state.profile.isAdmin) return;
  if (!hoort && !state.winkel) return;         // geen lijst, dus niets af te nemen
  state.profile.isAdmin = hoort;
  try{ await updateDoc(doc(db, "users", state.user.uid), { isAdmin: hoort }); }
  catch(e){ /* de regels beslissen; lukt het niet, dan blijft het zoals het was */ }
  if (hoort) listenOrders();
  renderAuthNav();
}

/* Vertaalt een Firestore-fout naar iets waar je wat mee kunt. */
function firestoreHint(err){
  const code = err?.code || "";
  if (/index/i.test(err?.message || ""))
    return "Deze zoekopdracht heeft een extra index nodig in Firestore. De foutmelding in de browserconsole bevat een link die de index in één klik aanmaakt.";
  if (/permission-denied/.test(code))
    return "Firestore weigert dit. Meestal betekent dat dat de regels iets nog niet kennen: " +
           "kopieer firestore.rules opnieuw naar Firebase Console → Firestore Database → Regels → Publiceren.";
  if (/unavailable|failed-precondition|not-found/.test(code))
    return "De database is nog niet aangemaakt. Ga in de Firebase Console naar Build → Firestore Database en klik op Create database.";
  if (/unauthenticated/.test(code))
    return "Firebase herkent de site niet. Controleer of de configuratie bij het juiste project hoort.";
  return err?.message || String(err);
}
