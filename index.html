/* --------------------------- maatwerk per product --------------------------- */
/* Een doosje is voor iedereen anders. Staat dit aan, dan geeft de klant zelf
   de afmetingen op en volgt de prijs uit volume en printtijd. */
function sizingOf(p){
  const s = p?.sizing;
  if (!s || !s.enabled) return null;
  return {
    def:  s.def  || [80, 60, 40],
    min:  s.min  || [20, 20, 10],
    max:  s.max  || [250, 250, 250],
    solidity: s.solidity ?? 35,     // hoe vol het object is, in procent
    infill: s.infill ?? 20,
    layerHeight: s.layerHeight || "0.20mm",
  };
}
function currentDims(p){
  const s = sizingOf(p);
  if (!s) return null;
  const d = state.__dims || s.def;
  return [0,1,2].map(i => Math.min(s.max[i], Math.max(s.min[i], Math.round(d[i] || s.def[i]))));
}
function sizedEstimate(p){
  const s = sizingOf(p);
  const [L,W,H] = currentDims(p);
  const fil = currentFilament(p);
  return estimate({
    solidVolume: L * W * H * (s.solidity / 100),
    surfaceArea: 2 * (L*W + L*H + W*H),
    heightMm: H,
    infill: s.infill,
    layerHeight: parseFloat(s.layerHeight),
    filamentType: fil ? fil.type : "PLA Basic",
    pricePerKg: fil ? fil.pricePerKg : undefined,
  });
}
/* De prijs met zijn opbouw erbij, zodat een klant ziet waar het geld heen gaat. */
function priceBreakdown(est){
  return `
    <div class="fil-block">
      <div class="between" style="margin-bottom:8px;">
        <span class="font-display" style="font-size:14px;">${t("prijs.berekend")}</span>
        <span class="price" style="font-size:22px;">${fmtEUR(est.unit)}</span>
      </div>
      ${toonTechniek() ? `
        <div class="kv"><span>${t("fil.kop")}</span><span class="font-mono">${est.grams.toFixed(1)} g · ${fmtEUR(est.materialCost)}</span></div>
        <div class="kv"><span>${t("prod.printtijd")}</span><span class="font-mono">${fmtDuration(est.seconds)} · ${fmtEUR(est.machineCost)}</span></div>` : ``}
      <div class="kv"><span>${t("prijs.voorbereiding")}</span><span class="font-mono">${fmtEUR(pricing().setupFee)}</span></div>
      <p class="muted" style="font-size:11px;margin:8px 0 0;">${t("prijs.uitleg")}</p>
    </div>`;
}

/* De prijs die op de pagina en in de winkelwagen geldt. */
/* =====================================================================
   Korting
   Een korting geldt op de gewone prijs en mag een einddatum hebben. Is die
   datum voorbij, dan valt de korting vanzelf weg — je hoeft er dus niet aan
   te denken om hem uit te zetten.
   ===================================================================== */
function discountOf(p){
  const pct = Math.min(90, Math.max(0, Number(p?.discountPct) || 0));
  if (!pct) return null;
  if (p.discountUntil && Date.now() > p.discountUntil) return null;
  return { pct, until: p.discountUntil || null };
}
/* De prijs zonder korting. */
function listPrice(p){
  if (sizingOf(p)) return sizedEstimate(p).unit;
  const b = bundelPrijs(p);
  if (b) return b.prijs;
  return p.price;
}
function productPrice(p){
  const vol = listPrice(p);
  const k = discountOf(p);
  if (!k) return vol;
  return Math.max(0, Math.round(vol * (100 - k.pct)) / 100);
}
/* Het kortingsplaatje op een kaart of productpagina. */
function discountBadge(p){
  const k = discountOf(p);
  if (!k) return "";
  return `<span class="sale-flag">&minus;${k.pct}%</span>`;
}
function priceWithDiscount(p){
  const k = discountOf(p);
  const nu = `<span class="now">${fmtEUR(productPrice(p))}</span>`;
  if (!k) return nu;
  return `<span class="was">${fmtEUR(listPrice(p))}</span> ${nu}`;
}

/* Duurder filament kost meer. De prijs die bij een product staat gaat uit van
   het goedkoopste filament dat je aan hebt staan; kiest de klant iets duurders,
   dan komt het verschil erbij, berekend op het gewicht van het model. */
function kiloPrijs(f){
  return f?.pricePerKg ?? DEFAULT_PRICE_PER_KG[f?.type] ?? pricing().pricePerKg;
}
function goedkoopsteKilo(p){
  const list = availableFilaments(p);
  if (!list.length) return pricing().pricePerKg;
  return Math.min(...list.map(kiloPrijs));
}
function filamentToeslag(p, fil, deelGram){
  const gram = deelGram ?? (Number(p?.weight) || 0);
  if (!gram || !fil) return 0;
  const extra = (gram / 1000) * (kiloPrijs(fil) - goedkoopsteKilo(p)) * pricing().margin;
  return Math.max(0, Math.ceil(extra * 20) / 20);          // op 5 cent
}
/* Wat er bij de prijs komt als je naar dít soort filament overstapt. Binnen
   één soort kan de ene kleur duurder zijn dan de andere; we tonen het minste,
   zodat er nooit een hoger bedrag staat dan wat je bij de goedkoopste kleur
   van dat soort betaalt. Nul betekent: dit is het soort waar de prijs op staat.
   Bij een model met kleurvakken telt alleen het gewicht van dat ene stuk. */
function typeToeslag(p, type, deelGram){
  const lijst = availableFilaments(p).filter(f => f.type === type);
  if (!lijst.length) return 0;
  return Math.min(...lijst.map(f => filamentToeslag(p, f, deelGram)));
}
/* Het knopje van een filamentsoort, met erop wat het extra kost. Zonder dat
   zag je pas na het klikken dat de prijs veranderd was. */
function typeKnop(p, soort, actief, attr, deelGram){
  const extra = typeToeslag(p, soort, deelGram);
  return `<button class="fil-type met-extra ${actief ? "active" : ""}" ${attr}="${esc(soort)}">
    <span class="fil-type-naam">${esc(soort)}</span>
    <span class="fil-type-extra">${extra > 0 ? "+ " + fmtEUR(extra) : t("fil.startprijs")}</span>
  </button>`;
}
/* Kost er minstens één soort meer dan de startprijs? Dan hoort er één zinnetje
   bij dat uitlegt waarvoor die bedragen staan. */
function toeslagUitleg(p, deelGram){
  const lijst = availableFilaments(p);
  const soorten = filamentTypes(lijst);
  if (!soorten.some(s => typeToeslag(p, s, deelGram) > 0)) return ``;
  return `<p class="muted" style="font-size:12px;line-height:1.6;margin:-6px 0 12px;">${t("fil.toeslagUitleg")}</p>`;
}

/* De toeslag voor wat er op dit moment gekozen staat. Bij een model met
   kleurvakken verdelen we het gewicht over de onderdelen. */
function gekozenToeslag(p){
  if (sizingOf(p)) return 0;                                // die prijs rekent zelf al door
  const slots = colorSlots(p);
  if (slots.length){
    const deel = (Number(p.weight) || 0) / slots.length;
    return slots.reduce((sum, _, i) => sum + filamentToeslag(p, slotFilament(p, i), deel), 0);
  }
  return filamentToeslag(p, currentFilament(p));
}

/* Er is geen voorraad meer: alles wordt op bestelling geprint. Een product kan
   dus nooit "uitverkocht" zijn. Wil je iets tijdelijk niet verkopen, dan zet je
   het op verborgen — zie verborgen() hieronder. */
const MAX_PER_BESTELLING = 99;

/* Een verborgen product blijft gewoon bestaan met al zijn foto's, kleuren en
   instellingen, maar staat niet in de collectie. Zo hoef je niets te wissen om
   iets even uit de winkel te halen. De beheerder ziet het wél staan. */
function verborgen(p){ return !!p?.hidden; }
function zichtbareProducten(){
  const alles = state.products || [];
  return state.profile?.isAdmin ? alles : alles.filter(p => !verborgen(p));
}
/* De prijs bij de kleinst toegestane maat — dat is de "vanaf"-prijs. */
function basePriceOf(p){
  const s = sizingOf(p);
  const [L,W,H] = s.min;
  return estimate({
    solidVolume: L * W * H * (s.solidity / 100),
    surfaceArea: 2 * (L*W + L*H + W*H),
    heightMm: H, infill: s.infill,
    layerHeight: parseFloat(s.layerHeight), filamentType: "PLA Basic",
  }).unit;
}
function sizingBlock(p){
  const s = sizingOf(p);
  const d = currentDims(p);
  const labels = [t("maat.lengte"), t("maat.breedte"), t("maat.hoogte")];
  return `
    <div class="fil-block">
      <div class="between" style="margin-bottom:10px;">
        <span class="font-display" style="font-size:14px;">${t("maat.jouwAfmetingen")}</span>
        <span class="muted font-mono" style="font-size:10px;">${t("maat.inMm")}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
        ${labels.map((lab,i)=>`
          <div>
            <label class="field-label">${lab}</label>
            <input type="number" class="dim" data-dim="${i}" value="${d[i]}"
                   min="${s.min[i]}" max="${s.max[i]}" step="1" style="margin-bottom:2px;" />
            <span class="muted font-mono" style="font-size:10px;">${s.min[i]}–${s.max[i]}</span>
          </div>`).join("")}
      </div>
      <p class="muted" style="font-size:11px;margin:10px 0 12px;">${t("maat.prijsVolgt")}</p>
      <label class="field-label">${t("maat.opDePlaat")}</label>
      ${platePreview(d)}
    </div>`;
}

/* Welke afwerking krijgt welk glanslaagje op een staal. */
function finishClass(finish){ return finish === "silk" ? "fil-sheen" : finish === "basic" ? "fil-gloss" : ""; }

/* De filamentkeuze voor het geopende product, met terugval op de eerste
   beschikbare kleur zodat er nooit "niets" gekozen staat. */
function currentFilament(p){
  const list = availableFilaments(p);
  if (!list.length) return null;
  return list.find(f => f.id === state.__filament) || list[0];
}
/* =====================================================================
   Kleurvakken
   Sommige modellen bestaan uit benoemde stukken die je apart wilt kunnen
   kleuren: mond geel, arm blauw. Elk vak krijgt zijn eigen keuzemenu; de
   klant klapt er één open tegelijk, zodat het overzichtelijk blijft.
   ===================================================================== */
/* =====================================================================
   Een setje: één product dat uit andere producten bestaat
   De prijs is de som van wat erin zit, min de korting die jij erop zet. De
   kleuren regelen zichzelf: elk stuk uit het setje wordt een kleurvak, dus de
   klant kiest per stuk een kleur en jij ziet dat terug in de bestelling, in de
   winkelwagen en in je printlijst — zonder dat daar iets voor bijgebouwd moest
   worden.
   ===================================================================== */
function bundelVan(p){
  const ids = Array.isArray(p?.bundelVan) ? p.bundelVan : [];
  return ids.map(id => (state.products || []).find(x => x.id === id)).filter(Boolean);
}
function bundelPrijs(p){
  const stuks = bundelVan(p);
  if (!stuks.length) return null;
  const los = stuks.reduce((s, x) => s + (Number(x.price) || 0), 0);
  const pct = Math.min(90, Math.max(0, Number(p.bundelKorting) || 0));
  return { los, prijs: Math.round(los * (100 - pct)) / 100, pct, stuks };
}

function colorSlots(p){
  // Een setje krijgt zijn vakken van wat erin zit: één kleur per stuk.
  const stuks = bundelVan(p);
  if (stuks.length) return stuks.map(x => ({ name: x.name, filamentId: null })).slice(0, 10);
  const s = Array.isArray(p?.colorSlots) ? p.colorSlots.filter(x => x && x.name) : [];
  return s.slice(0, 10);
}

/* =====================================================================
   Een naam of tekst op je print
   Dit is wat 3D printen kan en een winkel niet: hetzelfde model, maar dan met
   jouw naam erin. Per product zet je zelf aan of het kan, hoe het veld heet,
   hoeveel tekens erin passen en of het extra kost.
   ===================================================================== */
function personalisatie(p){
  const x = p?.personalisatie;
  if (!x || !x.aan) return null;
  return {
    label: (x.label || "").trim() || t("pers.label"),
    hint: (x.hint || "").trim(),
    max: Math.max(1, Math.min(60, Number(x.max) || 16)),
    prijs: Math.max(0, Number(x.prijs) || 0),
    verplicht: !!x.verplicht,
  };
}
function gekozenTekst(p){
  const ingetypt = (state.__tekst || {})[p?.id] || "";
  const pers = personalisatie(p);
  return pers ? ingetypt.slice(0, pers.max) : "";
}
/* Mag er besteld worden? Bij een verplicht veld niet zolang het leeg is. */
function tekstKlaar(p){
  const pers = personalisatie(p);
  return !pers || !pers.verplicht || !!gekozenTekst(p).trim();
}
/* De keuze per vak, met de standaardkleur van het product als terugval. */
function slotFilament(p, i){
  const list = availableFilaments(p);
  if (!list.length) return null;
  const gekozen = (state.__slotFil || {})[i];
  const standaard = colorSlots(p)[i]?.filamentId;
  return list.find(f => f.id === gekozen) || list.find(f => f.id === standaard) || list[0];
}
/* Heeft de klant dit vak zelf aangeklikt? Jouw standaardkleur is een
   voorstel, geen keuze: anders lijkt alles al af en klikt iemand door zonder
   de andere vakken ooit gezien te hebben. */
function slotGekozen(p, i){
  const id = (state.__slotFil || {})[i];
  if (!id) return null;
  return availableFilaments(p).find(f => f.id === id) || null;
}
function slotsKlaar(p){
  const n = colorSlots(p).length;
  if (!n) return true;
  for (let i = 0; i < n; i++) if (!slotGekozen(p, i)) return false;
  return true;
}
function slotsTeGaan(p){
  return colorSlots(p).filter((_, i) => !slotGekozen(p, i)).length;
}

/* Eén uitklapper per onderdeel. Dicht zie je waar het over gaat en of je al
   gekozen hebt; open staan de kleuren. Kies je er een, dan klapt hij dicht en
   springt de volgende open — zo loop je er vanzelf doorheen. */
function slotPicker(p){
  const slots = colorSlots(p);
  const list = availableFilaments(p);
  if (!list.length){
    return `<div class="fil-block"><p class="muted" style="font-size:13px;margin:0;">${t("fil.geen")}</p></div>`;
  }
  // bij binnenkomst staat het eerste vak open: dat laat meteen zien hoe het werkt
  const open = state.__openSlot === undefined ? 0 : state.__openSlot;
  const klaar = slots.length - slotsTeGaan(p);
  // het gewicht valt over de stukken uiteen, dus zo veel weegt één stuk
  const deelGram = (Number(p.weight) || 0) / Math.max(1, slots.length);
  return `
    <div class="fil-block">
      <div class="between" style="margin-bottom:4px;">
        <span class="font-display" style="font-size:15px;">${t("slot.kop")}</span>
        <span class="font-mono" style="font-size:11px;color:${klaar === slots.length ? "var(--accent)" : "var(--muted)"};">
          ${t("shop.vanTotaal", { n: klaar, t: slots.length })}
        </span>
      </div>
      <span class="stappen-balk" style="max-width:none;display:block;margin-bottom:12px;">
        <span style="width:${Math.round(klaar / slots.length * 100)}%;"></span>
      </span>
      <div class="between" style="margin:0 0 12px;gap:10px;">
        <span class="muted" style="font-size:12px;line-height:1.6;">${t("slot.uitleg", { n: slots.length })}</span>
        ${gidsKnop()}
      </div>
      ${state.__gidsOpen ? materiaalGids() : ``}
      ${slots.map((s, i) => {
        const g = slotGekozen(p, i);
        const uit = open === i;
        const types = filamentTypes(list);
        const voorstel = slotFilament(p, i);
        const actief = uit && types.includes(state.__slotType) ? state.__slotType : (g || voorstel).type;
        const kleuren = list.filter(x => x.type === actief);
        return `
          <div class="kleurkiezer ${uit ? "open" : ""} ${g ? "gekozen" : "leeg"}">
            <button class="kleurkiezer-knop" data-slot="${i}">
              <span class="kleurkiezer-nr">${g ? ic("check") : i + 1}</span>
              <span class="kleurkiezer-naam">${esc(s.name)}</span>
              <span class="kleurkiezer-keuze">
                ${g
                  ? `<span class="fil-chip ${finishClass(g.finish)}" style="background-color:${esc(g.hex)};"></span>
                     <span class="kleurkiezer-tekst">${esc(g.name)}</span>`
                  : `<span class="kleurkiezer-tekst leeg">${t("slot.kies")}</span>`}
              </span>
              ${ic(uit ? "chevron-up" : "chevron-down", "slot-caret")}
            </button>
            ${uit ? `
              <div class="kleurkiezer-lade">
                <div class="fil-types">
                  ${types.map(soort => typeKnop(p, soort, soort === actief, "data-slottype", deelGram)).join("")}
                </div>
                ${toeslagUitleg(p, deelGram)}
                <div class="swatches">
                  ${kleuren.map(x=>`
                    <button class="swatch ${finishClass(x.finish)} ${x.id===g?.id?'active':''}"
                            data-slotfil="${i}" data-fil="${esc(x.id)}" title="${esc(x.name)} — ${esc(x.hex)}"
                            style="background-color:${esc(x.hex)};">
                      ${x.id===g?.id ? `<span class="tick" style="color:${esc(readableOn(x.hex))}"><i class="fa-solid fa-check" aria-hidden="true"></i></span>` : ``}
                    </button>`).join("")}
                </div>
              </div>` : ``}
          </div>`;
      }).join("")}
    </div>`;
}

/* =====================================================================
   Hoe groot is dat nu echt?
   "Ik dacht dat het groter was" is de meest gehoorde teleurstelling bij een
   3D-print. Millimeters op een pagina zeggen weinig. Daarom zetten we er een
   voorwerp naast dat iedereen kent, op ware grootte, in dezelfde 3D-weergave —
   je kunt er samen mee ronddraaien. Een tekening van opzij was niet genoeg:
   diepte zie je daar niet, en dat is nu net wat je mist.
   ===================================================================== */

/* Een blokje: twaalf driehoeken, gecentreerd op (ox,oy) en staand op z = oz. */
function blokMesh(bx, by, bz, ox, oy, oz){
  const x0 = ox - bx/2, x1 = ox + bx/2;
  const y0 = oy - by/2, y1 = oy + by/2;
  const z0 = oz, z1 = oz + bz;
  const v = [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],
             [x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
  const f = [[0,3,2],[0,2,1],[4,5,6],[4,6,7],[0,1,5],[0,5,4],
             [1,2,6],[1,6,5],[2,3,7],[2,7,6],[3,0,4],[3,4,7]];
  const m = new Float32Array(f.length * 9);
  let w = 0;
  for (const t of f) for (const i of t){ m[w++] = v[i][0]; m[w++] = v[i][1]; m[w++] = v[i][2]; }
  return m;
}
function naarMesh(tri){
  const m = new Float32Array(tri.length * 9);
  let w = 0;
  for (const t of tri) for (const q of t){ m[w++] = q[0]; m[w++] = q[1]; m[w++] = q[2]; }
  return m;
}

/* Een omwentelingslichaam: je geeft de omtreklijn van opzij als [straal, hoogte]
   en dit draait ze rond. Een blikje, een fles, een muntstuk — dat zijn allemaal
   vormen die zó gemaakt worden, en zo krijg je ze op de millimeter juist.
   De zijkant krijgt vanzelf zachte normalen omdat de vlakjes maar een paar
   graden verschillen; een echte knik in de omtreklijn blijft scherp. */
function draaiMesh(profiel, ox, oy, oz, kanten = 48){
  const tri = [];
  const punt = (r, z, i) => {
    const a = i / kanten * 2 * Math.PI;
    return [ox + r * Math.cos(a), oy + r * Math.sin(a), oz + z];
  };
  for (let s = 0; s < profiel.length - 1; s++){
    const [r0, z0] = profiel[s], [r1, z1] = profiel[s + 1];
    if (r0 === 0 && r1 === 0) continue;
    for (let i = 0; i < kanten; i++){
      const a = punt(r0, z0, i), b = punt(r0, z0, i + 1);
      const c = punt(r1, z1, i + 1), d = punt(r1, z1, i);
      // raakt de omtreklijn de as, dan wordt het vierkantje een driehoek
      if (r0 === 0) tri.push([a, c, d]);
      else if (r1 === 0) tri.push([a, b, c]);
      else tri.push([a, b, c], [a, c, d]);
    }
  }
  return naarMesh(tri);
}

/* Een doos met afgeronde hoeken: een bankkaart en een telefoon hebben die, en
   zonder die ronding herken je ze niet als zodanig. */
function afgerondeDoosMesh(bx, by, bz, straal, ox, oy, oz, boog = 5){
  const r = Math.max(0.01, Math.min(straal, bx/2 - 0.01, by/2 - 0.01));
  const hx = bx/2 - r, hy = by/2 - r;
  const omtrek = [];
  for (const [cx, cy, a0] of [[hx,hy,0],[-hx,hy,Math.PI/2],[-hx,-hy,Math.PI],[hx,-hy,1.5*Math.PI]]){
    for (let i = 0; i <= boog; i++){
      const a = a0 + i / boog * (Math.PI/2);
      omtrek.push([ox + cx + r*Math.cos(a), oy + cy + r*Math.sin(a)]);
    }
  }
  const z0 = oz, z1 = oz + bz, n = omtrek.length, tri = [];
  for (let i = 0; i < n; i++){
    const p = omtrek[i], q = omtrek[(i + 1) % n];
    tri.push([[p[0],p[1],z0],[q[0],q[1],z0],[q[0],q[1],z1]]);
    tri.push([[p[0],p[1],z0],[q[0],q[1],z1],[p[0],p[1],z1]]);
    tri.push([[ox,oy,z1],[p[0],p[1],z1],[q[0],q[1],z1]]);
    tri.push([[ox,oy,z0],[q[0],q[1],z0],[p[0],p[1],z0]]);
  }
  return naarMesh(tri);
}

/* =====================================================================
   De voorwerpen ter vergelijking
   Bewust zelf opgebouwd in plaats van een model van het internet te halen.
   Twee redenen. De eerste is de licentie: bijna alles op Thingiverse en
   Printables mag je niet zomaar in je eigen winkel meeleveren. De tweede is
   dat deze hele shop één bestand is; een gedownloade STL zou er tientallen
   kilobytes bij doen, terwijl de vorm van een blikje in twintig regels
   omtreklijn past — op de millimeter juist, want dat ís hoe een blikje
   gemaakt wordt.

   Elk voorwerp bestaat uit meerdere stukken met een eigen kleur. Één grijze
   cilinder is geen blikje; een aluminium romp met een gekleurd etiket en een
   ingedeukt lipje wél. Daar was het je om te doen.
   ===================================================================== */

/* 33 cl, 66 mm doorsnede, 115 mm hoog: de standaardmaat van een frisdrankblik.
   Onderaan de standrand met de holle bodem, bovenaan de schouder die naar de
   smallere hals loopt en de omgeslagen rand van het deksel. */
const BLIK_PROFIEL = [
  [0,    4.2],    // de bodem is hol: het midden zit hoger dan de rand
  [17,   2.4],
  [26,   0],      // hierop staat hij
  [30.5, 2.2],
  [33,   7],
  [33,   95],     // recht lichaam
  [32.3, 99],
  [29,   106],    // schouder
  [27,   111.5],  // hals
  [27.9, 113],    // de omgeslagen rand
  [26,   114.2],
  [23,   115],
  [0,    114.3],  // het deksel, licht verdiept
];
const BLIK_LIP = [           // het treklipje, een plat ovaaltje op het deksel
  [0, 0], [7.5, 0], [7.5, 0.6], [0, 0.6],
];

function blikjeDelen(x, y, z){
  return [
    { mesh: draaiMesh(BLIK_PROFIEL, x, y, z), hex: "#C4C9D0", finish: "silk" },
    // het etiket: een strook net iets wijder dan de romp, zodat hij er niet
    // doorheen flikkert
    { mesh: draaiMesh([[33.2, 22], [33.2, 84]], x, y, z), hex: "#B5342B", finish: "matte" },
    { mesh: draaiMesh([[33.2, 62], [33.2, 70]], x, y, z), hex: "#EFE3C8", finish: "matte" },
    { mesh: draaiMesh(BLIK_LIP, x, y, z + 114.4), hex: "#9AA0A8", finish: "silk" },
  ];
}

/* Een muntstuk van twee kleuren, zoals een euro of twee euro: een ring rond een
   kern. Dat is meteen te herkennen; een grijs schijfje niet. */
function muntDelen(x, y, z){
  return [
    { mesh: draaiMesh([[8.4, -0.1], [12.4, -0.1], [12.875, 0.6], [12.875, 1.6],
                       [12.4, 2.3], [8.4, 2.3]], x, y, z), hex: "#C9A35E", finish: "silk" },
    { mesh: draaiMesh([[0, 0], [8.5, 0], [8.6, 0.5], [8.6, 1.7], [8.5, 2.2], [0, 2.2]],
                      x, y, z), hex: "#BFC4C9", finish: "silk" },
  ];
}

/* Een bankkaart met de chip erop: zonder die chip is het gewoon een plaatje. */
function kaartDelen(x, y, z){
  return [
    { mesh: afgerondeDoosMesh(85.6, 54, 0.76, 3.2, x, y, z), hex: "#DCDFE3", finish: "matte" },
    { mesh: afgerondeDoosMesh(12, 9.5, 0.12, 1.2, x - 24, y + 7, z + 0.72), hex: "#C9A227", finish: "silk" },
    { mesh: afgerondeDoosMesh(60, 3.2, 0.1, 0.6, x + 6, y - 17, z + 0.72), hex: "#4A5058", finish: "matte" },
  ];
}

/* Een telefoon: een goede maat om je aan vast te houden, en met een zwart
   scherm erop is er geen twijfel over wat het is. */
function telefoonDelen(x, y, z){
  return [
    { mesh: afgerondeDoosMesh(146.7, 71.5, 7.8, 9.5, x, y, z), hex: "#4A5058", finish: "silk" },
    { mesh: afgerondeDoosMesh(139, 64, 0.3, 7.5, x, y, z + 7.7), hex: "#14171B", finish: "silk" },
  ];
}

/* Wat iedereen in huis heeft, met de maten die overal gelden. */
const MAAT_REFS = [
  { id: "munt",     b: 25.75, d: 25.75, h: 2.3,   maak: muntDelen },
  { id: "kaart",    b: 85.6,  d: 54,    h: 0.86,  maak: kaartDelen },
  { id: "telefoon", b: 146.7, d: 71.5,  h: 7.8,   maak: telefoonDelen },
  { id: "blikje",   b: 66,    d: 66,    h: 115,   maak: blikjeDelen },
];

/* De maat van dit product, met het 3D-model als beste bron.
   Belangrijk dat iedereen hier langskomt: eerder haalde de weergave zijn maat
   uit het geladen model en de knoppenrij eronder uit het productdocument. Stond
   daar niets bruikbaar in — geen bewaarde modelmaat, en bij afmetingen iets wat
   we niet kunnen uitlezen — dan zag je het model wél staan maar verdween de
   keuze wat ernaast moest komen. */
function voorbeeldVan(p){
  return state.__voorbeeld?.id === p?.id ? state.__voorbeeld.data : null;
}
function productMaat(p){
  const v = voorbeeldVan(p);
  if (v && Array.isArray(v.size) && v.size.length === 3) return v.size.map(Number);
  if (Array.isArray(p?.modelSize) && p.modelSize.length === 3) return p.modelSize.map(Number);
  const s = sizingOf(p);
  if (s) return currentDims(p);
  return maatUitTekst(p?.dimensions);
}
/* Welk voorwerp past het best naast dit ding? Een munt naast een vaas zegt
   niets, een blikje naast een sleutelhanger evenmin. */
function autoReferentie(maat){
  const grootste = Math.max(...maat);
  if (grootste <= 45) return "munt";
  if (grootste <= 130) return "kaart";
  // groter dan een bankkaart: dan een blikje, want dat staat rechtop en laat
  // dus ook de hoogte zien
  return "blikje";
}
/* standaardAan: in het aparte maatvak hoort er meteen iets naast te staan —
   dat vak bestaat er net voor. In de grote weergave niet: daar wil je eerst je
   product zien, want zodra er iets naast staat moet alles kleiner om samen in
   beeld te passen. Eén klik en het staat er. */
function huidigeReferentie(maat, standaardAan){
  const gekozen = state.__maatRef;
  if (gekozen === "geen") return null;
  if (!gekozen) return standaardAan ? MAAT_REFS.find(r => r.id === autoReferentie(maat)) : null;
  return MAAT_REFS.find(r => r.id === gekozen) || null;
}

/* Zet het referentievoorwerp naast het model en levert de gezamenlijke doos,
   zodat allebei in beeld passen en ze op dezelfde vloer staan. */
/* De stukken van een voorwerp opnieuw uitrekenen bij elke tekenbeurt zou het
   slepen laten haperen — de zachte normalen moeten er dan telkens overnieuw
   bij. Ze hangen alleen af van welk voorwerp het is en waar het staat, dus dat
   onthouden we. */
let refCache = null;
function refDelen(ref, ox, oy, oz){
  const sleutel = `${ref.id}|${ox.toFixed(2)}|${oy.toFixed(2)}|${oz.toFixed(2)}`;
  if (refCache?.sleutel !== sleutel) refCache = { sleutel, delen: ref.maak(ox, oy, oz) };
  return refCache.delen;
}

function maatScene(min, size, ref){
  if (!ref){
    return {
      delen: [], doos: {
        center: [min[0] + size[0]/2, min[1] + size[1]/2, 0],
        size, minZ: min[2] + size[2]/2,
      },
    };
  }
  const gat = Math.max(6, Math.max(...size) * 0.08);
  const ox = min[0] + size[0] + gat + ref.b/2;
  const oy = min[1] + size[1]/2;
  const oz = min[2];
  const minX = min[0],                         maxX = ox + ref.b/2;
  const minY = Math.min(min[1], oy - ref.d/2), maxY = Math.max(min[1] + size[1], oy + ref.d/2);
  const minZ = min[2],                         maxZ = Math.max(min[2] + size[2], oz + ref.h);
  return {
    delen: refDelen(ref, ox, oy, oz),
    doos: {
      center: [(minX + maxX)/2, (minY + maxY)/2, 0],
      size: [maxX - minX, maxY - minY, maxZ - minZ],
      minZ: (minZ + maxZ)/2,
    },
  };
}

/* Mag dit product nu in de winkelwagen? */
function bestelbaar(p){
  const pz = pauze();
  if (pz && !pz.bestellen) return false;
  return slotsKlaar(p) && tekstKlaar(p);
}

/* Het veld waarin de klant zijn naam of tekst typt. */
function tekstVak(p){
  const pers = personalisatie(p);
  if (!pers) return ``;
  const nu = gekozenTekst(p);
  return `
    <div class="cart-item" style="margin:16px 0 0;">
      <label class="field-label" style="margin-top:0;" for="persTekst">
        ${esc(pers.label)}${pers.verplicht ? ` <span style="color:var(--accent);">*</span>` : ` <span class="muted">${t("pers.magLeeg")}</span>`}
      </label>
      <input id="persTekst" maxlength="${pers.max}" value="${esc(nu)}"
             placeholder="${esc(pers.hint || t("pers.hint"))}" style="margin:0 0 6px;" />
      <div class="between">
        <span class="muted" style="font-size:12px;line-height:1.6;">
          ${pers.prijs > 0 ? t("pers.kost", { prijs: fmtEUR(pers.prijs) }) : t("pers.gratis")}
          ${t("pers.meegeprint")}
        </span>
        <span class="muted font-mono" style="font-size:11px;flex-shrink:0;">${nu.length}/${pers.max}</span>
      </div>
    </div>`;
}

/* Wat er in een setje zit, met wat het los zou kosten. */
function bundelVak(p){
  const b = bundelPrijs(p);
  if (!b) return ``;
  return `
    <div class="cart-item" style="margin:16px 0 0;">

        <div class="kv"><span>${esc(x.name)}</span><span class="font-mono">${fmtEUR(x.price)}</span></div>`).join("")}

        <span>${t("bundel.los", { prijs: fmtEUR(b.los) })}</span>
        <span class="font-mono" style="color:var(--accent);font-weight:600;">
          ${b.pct ? t("bundel.bespaart", { bedrag: fmtEUR(b.los - b.prijs) }) : t("bundel.samen", { prijs: fmtEUR(b.prijs) })}

      </div>
      <p class="muted" style="font-size:12px;line-height:1.65;margin:8px 0 0;">${t("bundel.kleuren")}</p>
    </div>`;
}

/* Voor een product zónder 3D-model: een eigen vakje met een blok van de juiste
   afmetingen naast het bekende voorwerp. Ook hier in 3D en ook draaibaar — de
   vorm klopt niet, de grootte wel.

   Uitdrukkelijk alleen als er geen 3D-model bij het product hoort. Is dat er
   wel, dan staat het al in het grote kader bovenaan mét zijn eigen keuze wat
   ernaast komt; het hier nog eens tekenen zette hetzelfde model twee keer op
   dezelfde pagina. */
function maatBlokVak(p){
  if (voorbeeldVan(p)) return ``;
  const maat = productMaat(p);
  if (!maat || !maat.every(v => isFinite(v) && v > 0)) return ``;
  return `
    <div class="cart-item maatvak">
      <p class="maatvak-kop">${ic("ruler-combined")} ${t("maat.kop")}</p>
      <div class="maatdoek">
        <canvas id="maatMesh" style="width:100%;height:100%;display:block;touch-action:none;cursor:grab;"></canvas>
        <span class="viewer-hint">${ic("arrows-up-down-left-right")} ${t("alg.sleep")}</span>
      </div>
      ${maatKiezer(p, true)}
      <p class="muted" style="font-size:12px;line-height:1.65;margin:8px 0 0;">${t("maat.blok")}</p>
    </div>`;
}

/* De knoppenrij onder de weergave: waar wil je het naast zien? */
function maatKiezer(p, standaardAan){
  const maat = productMaat(p);
  if (!maat || !maat.every(v => isFinite(v) && v > 0)) return ``;
  const nu = huidigeReferentie(maat, standaardAan);
  return `
    <div class="maatkiezer">
      <span class="maatkiezer-kop">${ic("ruler-combined")} ${maat.map(v => Math.round(v)).join(" × ")} mm &mdash; ${t("maat.ernaast")}</span>
      <div class="fil-types" style="margin:0;width:100%;">
        ${MAAT_REFS.map(r => `
          <button class="fil-type ${nu?.id === r.id ? "active" : ""}" data-maatref="${esc(r.id)}">${t("ref." + r.id)}</button>`).join("")}
        <button class="fil-type ${nu ? "" : "active"}" data-maatref="geen">${t("maat.niets")}</button>
      </div>
    </div>`;
}

/* Haalt het 3D-voorbeeld op als het er nog niet is, en tekent het in de kleuren
   die op dit moment gekozen staan. Onderdeel 1 krijgt de kleur van vak 1,
   onderdeel 2 die van vak 2; bij een model in één kleur krijgt alles dezelfde. */
async function toon3dVoorbeeld(){
  const p = state.selectedProduct;
  if (!p) return;
  if (state.__voorbeeld?.id !== p.id){
    const data = await haalVoorbeeld(p.id);
    // ondertussen kan iemand al doorgeklikt zijn
    if (state.selectedProduct?.id !== p.id) return;
    state.__voorbeeld = { id: p.id, data };
    if (data) { render(); return; }          // opnieuw tekenen, nu mét het model
  }
  const v = state.__voorbeeld.data;
  const cv = document.getElementById('productMesh');
  if (!v || !cv) return;

  const meshes = v.__meshes || (v.__meshes = voorbeeldNaarMeshes(v));
  tekenMaatScene(cv, v.min, v.size, meshes, productKleuren(p), huidigeReferentie(v.size, false));
}

/* Onderdeel 1 krijgt de kleur van vak 1, onderdeel 2 die van vak 2; bij een
   model in één kleur krijgt alles dezelfde. */
function productKleuren(p){
  const vakken = colorSlots(p);
  return vakken.length
    ? vakken.map((_, i) => slotFilament(p, i) || currentFilament(p) || {})
    : [currentFilament(p) || { hex: "#B8BCC2", finish: "basic" }];
}

/* Tekent het model met — als je dat wil — een bekend voorwerp ernaast, en
   maakt het geheel draaibaar. Eén plek voor allebei de gevallen: een product
   mét 3D-model, en een product zonder waar we een blok van de juiste maat
   neerzetten. */
function tekenMaatScene(cv, min, size, meshes, kleuren, ref){
  if (!state.__meshView) state.__meshView = { yaw: 0.7, pitch: 0.42 };
  const scene = maatScene(min, size, ref);
  const alle = [...meshes, ...scene.delen.map(d => d.mesh)];
  const kleur = [...kleuren, ...scene.delen.map(d => ({ hex: d.hex, finish: d.finish }))];

  const teken = () => drawModel(cv, alle, kleur, {
    ...scene.doos,
    yaw: state.__meshView.yaw, pitch: state.__meshView.pitch,
  });
  teken();
  requestAnimationFrame(teken);              // na het uitmeten van het vak

  let slepen = false, lx = 0, ly = 0;
  cv.onpointerdown = (e) => { slepen = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = (e) => {
    if (!slepen) return;
    state.__meshView.yaw += (e.clientX - lx) * 0.011;
    state.__meshView.pitch = Math.max(-1.3, Math.min(1.4, state.__meshView.pitch + (e.clientY - ly) * 0.009));
    lx = e.clientX; ly = e.clientY;
    teken();
  };
  cv.onpointerup = cv.onpointercancel = () => { slepen = false; };
}

/* Geen 3D-model bij dit product, maar de maten kennen we wel. Dan tonen we een
   blok van precies die afmetingen naast het bekende voorwerp — de vorm klopt
   niet, de grootte wel, en dat is waar het hier om gaat. */
function tekenMaatBlok(){
  const cv = document.getElementById('maatMesh');
  const p = state.selectedProduct;
  if (!cv || !p) return;
  const maat = productMaat(p);
  if (!maat) return;
  const [x, y, z] = maat;
  const f = currentFilament(p) || { hex: "#B8BCC2", finish: "basic" };
  tekenMaatScene(cv, [0, 0, 0], [x, y, z],
    [blokMesh(x, y, z, x/2, y/2, 0)], [f], huidigeReferentie(maat, true));
}

function attachProductHandlers(){
  let qty = 1;
  const qv = document.getElementById('qVal');
  // Vlak na een herlaadbeurt zijn de producten er nog niet en staat er alleen
  // een melding; dan valt er ook niets aan te haken.
  if (!qv) return;
  document.getElementById('qMinus').onclick = ()=>{ qty=Math.max(1,qty-1); qv.textContent=qty; };
  document.getElementById('qPlus').onclick = ()=>{
    if (qty >= MAX_PER_BESTELLING){ notify(t("prod.teveel", { n: MAX_PER_BESTELLING })); return; }
    qty++; qv.textContent=qty;
  };
  document.querySelectorAll('[data-img]').forEach(btn=>{
    btn.onclick = () => { state.__gallery = parseInt(btn.dataset.img,10) || 0; render(); };
  });
  document.querySelectorAll('[data-toon]').forEach(btn=>{
    btn.onclick = () => { state.__toon3d = btn.dataset.toon === "3d"; render(); };
  });
  document.querySelectorAll('[data-maatref]').forEach(btn=>{
    btn.onclick = () => { state.__maatRef = btn.dataset.maatref; render(); };
  });
  document.querySelectorAll('[data-bewaar]').forEach(h => {
    h.onclick = () => zetBewaard(h.dataset.bewaar);
  });
  /* Doorsturen. Op een telefoon opent het deelvenster van het toestel zelf;
     op een computer bestaat dat meestal niet en zetten we de link op het
     klembord. Kan dat ook niet — een oude browser, of geen toestemming — dan
     tonen we hem gewoon, zodat je hem zelf kunt kopiëren. */
  const deel = document.getElementById('deelBtn');
  if (deel) deel.onclick = async () => {
    const p = state.selectedProduct;
    if (!p) return;
    const url = productLink(p);
    try{
      if (navigator.share){ await navigator.share({ title: p.name, url }); return; }
      await navigator.clipboard.writeText(url);
      notify(t("deel.gekopieerd"));
    }catch(err){
      if (err?.name === "AbortError") return;      // zelf weggeklikt
      prompt(t("deel.knop"), url);
    }
  };
  const tekst = document.getElementById('persTekst');
  if (tekst) tekst.oninput = () => {
    (state.__tekst ||= {})[state.selectedProduct.id] = tekst.value;
    render();                       // de teller en de knop lopen mee
  };
  const gids = document.getElementById('materiaalGidsBtn');
  if (gids) gids.onclick = () => { state.__gidsOpen = !state.__gidsOpen; render(); };
  toon3dVoorbeeld();
  tekenMaatBlok();
  document.querySelectorAll('[data-filtype]').forEach(btn=>{
    btn.onclick = () => {
      state.__filType = btn.dataset.filtype;
      // eerste kleur van het nieuwe type kiezen, anders blijft de oude staan
      const first = availableFilaments(state.selectedProduct).find(f => f.type === state.__filType);
      if (first) state.__filament = first.id;
      state.__gallery = 0;
      render();
    };
  });
  document.querySelectorAll('[data-slot]').forEach(btn=>{
    btn.onclick = () => {
      const i = parseInt(btn.dataset.slot, 10);
      state.__openSlot = state.__openSlot === i ? -1 : i;
      state.__slotType = null;
      render();
    };
  });
  document.querySelectorAll('[data-slottype]').forEach(btn=>{
    btn.onclick = () => { state.__slotType = btn.dataset.slottype; render(); };
  });
  document.querySelectorAll('[data-fil]').forEach(btn=>{
    btn.onclick = () => {
      if (btn.dataset.slotfil !== undefined){
        const i = parseInt(btn.dataset.slotfil, 10);
        state.__slotFil = { ...(state.__slotFil || {}), [i]: btn.dataset.fil };
        // dit vak is klaar: dichtklappen en meteen het volgende openzetten dat
        // nog gekozen moet worden, zodat je er vanzelf doorheen loopt
        const p = state.selectedProduct;
        const n = colorSlots(p).length;
        let volgende = -1;
        for (let k = 1; k <= n; k++){
          const j = (i + k) % n;
          if (!slotGekozen(p, j)) { volgende = j; break; }
        }
        state.__openSlot = volgende;
        state.__slotType = null;
      } else {
        state.__filament = btn.dataset.fil;
      }
      state.__gallery = 0; // toon meteen het kleurvoorbeeld
      render();
    };
  });
  document.querySelectorAll('.dim').forEach(inp=>{
    inp.onchange = () => {
      const p = state.selectedProduct;
      const d = (state.__dims || sizingOf(p).def).slice();
      d[parseInt(inp.dataset.dim,10)] = parseFloat(inp.value) || 0;
      state.__dims = d;
      render();
    };
  });
  const add = document.getElementById('addBtn');
  if (add) add.onclick = ()=>{
    const p = state.selectedProduct;
    const slots = colorSlots(p);
    if (!slotsKlaar(p)){
      // wijs meteen het eerste vak aan dat nog wacht
      const i = slots.findIndex((_, k) => !slotGekozen(p, k));
      state.__openSlot = i;
      render();
      document.querySelector(`.kleurkiezer:nth-of-type(${i + 1})`)
        ?.scrollIntoView({ behavior: "smooth", block: "center" });
      notify(t("slot.kiesVoor", { naam: slots[i].name }));
      return;
    }
    const keuzes = slots.map((s, i) => {
      const x = slotFilament(p, i);
      return { slot: s.name, id: x?.id, type: x?.type, name: x?.name, hex: x?.hex, finish: x?.finish };
    });
    if (!tekstKlaar(p)){
      notify(t("prod.vulIn", { wat: personalisatie(p).label.toLowerCase() }));
      document.getElementById('persTekst')?.focus();
      return;
    }
    const pz = pauze();
    if (pz && !pz.bestellen){ notify(t("pauze.melding")); return; }
    const pers = personalisatie(p);
    const eigenTekst = pers ? gekozenTekst(p).trim() : "";
    const f = slots.length ? slotFilament(p, 0) : currentFilament(p);
    const sizing = sizingOf(p);
    const dims = sizing ? currentDims(p) : null;
    const est = sizing ? sizedEstimate(p) : null;
    addToCart({
      // kleur én maat maken de regel uniek, zodat twee varianten niet samensmelten
      id: [p.id, keuzes.length ? keuzes.map(k=>k.id).join("+") : f?.id, dims?.join("x"), eigenTekst].filter(Boolean).join("::"),
      productId: p.id,
      kind: "product", name: p.name, qty,
      eigenTekst: eigenTekst || null,
      price: est ? est.unit : Math.round((productPrice(p) + gekozenToeslag(p) + (pers?.prijs || 0)) * 100) / 100,
      filamentSurcharge: est ? 0 : gekozenToeslag(p),
      listPrice: est ? null : listPrice(p) + gekozenToeslag(p),
      discountPct: discountOf(p)?.pct || 0,
      dims, printTime: est ? Math.round(est.seconds) : null, grams: est ? +est.grams.toFixed(1) : null,
      filament: f ? { id:f.id, type:f.type, name:f.name, hex:f.hex, finish:f.finish } : null,
      colorChoices: keuzes.length ? keuzes : null,
    });
    if (pers) (state.__tekst ||= {})[p.id] = "";
    if (slots.length || pers){ state.__slotFil = {}; state.__openSlot = 0; render(); }
  };
}

/* =====================================================================
   Eigen model uploaden — meerdere onderdelen in één opdracht.
   Elk onderdeel krijgt een naam, eigen filament en eigen aantal. De prijs
   volgt per onderdeel uit volume en printtijd; assembleren kost extra.
   ===================================================================== */
const UNITS = { mm: 1, cm: 10, inch: 25.4 };

/* =====================================================================
   Een halfafgewerkte opdracht bewaren
   Wie per ongeluk herlaadt, moet zijn bestanden niet opnieuw hoeven kiezen.
   De instellingen zijn klein en gaan naar sessionStorage; de bestanden zelf
   zijn te groot daarvoor en gaan naar IndexedDB, één rij per onderdeel.
   ===================================================================== */
const PARTS_DB = "extrudo", PARTS_STORE = "bestanden";
function partsDb(){
  return new Promise((res, rej) => {
    if (!self.indexedDB) return rej(new Error("geen opslag"));
    const req = indexedDB.open(PARTS_DB, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(PARTS_STORE)) d.createObjectStore(PARTS_STORE);
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error || new Error("opslag niet beschikbaar"));
  });
}
function partsTx(mode, fn){
  return partsDb().then(d => new Promise((res, rej) => {
    const tx = d.transaction(PARTS_STORE, mode);
    const req = fn(tx.objectStore(PARTS_STORE));
    tx.oncomplete = () => res(req?.result);
    tx.onerror = () => rej(tx.error);
  }));
}
const bewaarBestand = (id, blob) => partsTx("readwrite", s => s.put(blob, id)).catch(()=>{});
const leesBestand   = (id)       => partsTx("readonly",  s => s.get(id)).catch(()=>null);
const wisBestand    = (id)       => partsTx("readwrite", s => s.delete(id)).catch(()=>{});
const wisAlleBestanden = ()      => partsTx("readwrite", s => s.clear()).catch(()=>{});

/* De instellingen van elk onderdeel; de zware gegevens blijven eruit. */
function bewaarOpdracht(){
  try{
    const parts = (state.parts || []).map(p => ({
      id: p.id, name: p.name, fileName: p.fileName, fileSize: p.fileSize,
      unit: p.unit, scale: p.scale, infill: p.infill, layer: p.layer,
      filamentId: p.filamentId, qty: p.qty, fromSplit: !!p.fromSplit,
    }));
    if (!parts.length){ sessionStorage.removeItem('lc_parts'); return; }
    sessionStorage.setItem('lc_parts', JSON.stringify({
      parts, assembled: !!state.assembled, notes: state.projectNotes || "", at: Date.now(),
    }));
  }catch(e){}
}
function vergeetOpdracht(){
  sessionStorage.removeItem('lc_parts');
  wisAlleBestanden();
}

/* Haalt een onderbroken opdracht terug en analyseert de bestanden opnieuw. */
let opdrachtHersteld = false;
async function herstelOpdracht(){
  if (opdrachtHersteld) return;
  opdrachtHersteld = true;
  let bewaard;
  try{ bewaard = JSON.parse(sessionStorage.getItem('lc_parts') || "null"); }catch(e){ return; }
  if (!bewaard?.parts?.length) return;

  const terug = [];
  for (const b of bewaard.parts){
    const blob = await leesBestand(b.id);
    if (!blob) continue;                       // bestand weg: dit onderdeel overslaan
    const file = new File([blob], b.fileName, { type: blob.type || "application/octet-stream" });
    terug.push({ ...newPart(file), ...b, file, geo: null, error: null, busy: true });
  }
  if (!terug.length){ vergeetOpdracht(); return; }

  for (const p of terug){
    const n = parseInt(String(p.id).replace(/^p/, ""), 10);
    if (isFinite(n) && n > __partSeq) __partSeq = n;
  }
  state.parts = terug;
  state.assembled = !!bewaard.assembled;
  state.projectNotes = bewaard.notes || "";
  if (state.view === "custom") render();
  await analyseerWachtende();
  notify(`Je opdracht is teruggezet — ${terug.length} ${terug.length > 1 ? "onderdelen" : "onderdeel"}`);
}

function newPart(file){
  return {
    id: "p" + (++__partSeq),
    file,
    name: file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").slice(0, 60),
    fileName: file.name,
    fileSize: file.size,
    unit: "mm", scale: 100, infill: 20, layer: "0.20mm",
    filamentId: null, qty: 1,
    geo: null, error: null, busy: true,
  };
}
let __partSeq = 0;

/* Een 3mf kan zijn eigen kleuren meebrengen. Die zetten we om naar het
   dichtstbijzijnde filament dat jij op voorraad hebt. */
function applyGeoColor(part, geo){
  if (!geo?.colorHex) return;
  const f = nearestFilament(geo.colorHex);
  if (f){ part.filamentId = f.id; part.matchedFrom = geo.colorHex; }
}

/* Splitst een onderdeel in zijn losse stukken. */
window.__splitPart = (id) => {
  const parts = state.parts || [];
  const part = parts.find(p => p.id === id);
  if (!part || !part.splittable) return;
  const pieces = part.splittable;
  const made = pieces.map((g, i) => {
    const naam = `${part.name} ${i + 1}`;
    // elk stuk krijgt zijn eigen bestand, anders download je straks het geheel
    const { file, vereenvoudigd } = deelAlsBestand(g, naam);
    const np = newPart(file);
    np.busy = false;
    np.geo = g;
    np.name = naam;
    np.unit = part.unit; np.scale = part.scale;
    np.infill = part.infill; np.layer = part.layer;
    np.filamentId = part.filamentId;
    np.fromSplit = true;
    np.vereenvoudigd = vereenvoudigd;
    bewaarBestand(np.id, file);
    return np;
  });
  const at = parts.indexOf(part);
  state.parts.splice(at, 1, ...made);
  wisBestand(part.id);
  vergeetInWorkers(part.id);
  bewaarOpdracht();
  notify(`Gesplitst in ${made.length} onderdelen`);
  render();
};

/* De vermenigvuldiging van eenheid en schaal samen. */
function partFactor(p){ return (UNITS[p.unit] || 1) * (p.scale / 100); }
function partSize(p){ return p.geo ? p.geo.size.map(v => v * partFactor(p)) : [0,0,0]; }
function partFilament(p){
  const list = availableFilaments(null);
  return list.find(f => f.id === p.filamentId) || list[0] || null;
}
/* Snijdt het onderdeel echt door en onthoudt de uitkomst, want dat werk hoeft
   maar één keer per combinatie van instellingen. */
/* Het snijwerk gebeurt naast het scherm. Is de uitkomst er nog niet, dan
   geven we niets terug en rekent de shop zolang met de schatting uit volume en
   oppervlak; zodra de draad klaar is verschijnt het echte getal vanzelf. */
function partSlice(p){
  const mesh = p.geo?.full;
  if (!mesh || p.geo.decimated) return null;
  const k = partFactor(p);
  const sleutel = `${k}|${p.layer}|${p.infill}|${JSON.stringify(pricing().slicer || {})}`;
  if (p.__sliceKey === sleutel) return p.__slice;
  if (p.__sliceBezig === sleutel) return null;           // draait al

  p.__sliceBezig = sleutel;
  p.__sliceVoortgang = 0;
  snijInWorker(p.id, mesh,
    { layerHeight: parseFloat(p.layer), infill: p.infill, scale: k, settings: slicerSettings() },
    (laag, lagen) => {
      // alleen bijwerken wat het oog nodig heeft; niet het hele scherm opnieuw
      p.__sliceVoortgang = lagen ? laag / lagen : 0;
      const balk = document.querySelector(`[data-snij="${p.id}"] > span`);
      if (balk) balk.style.width = Math.round(p.__sliceVoortgang * 100) + "%";
    })
    .then((uit) => {
      if (p.__sliceBezig !== sleutel) return;            // instellingen intussen gewijzigd
      p.__slice = uit;
      p.__sliceKey = sleutel;
      p.__sliceBezig = null;
      bewaarOpdracht();
      if (state.view === "custom") render();
    });
  return null;
}
/* Draait er nog iets voor dit onderdeel? */
function partSnijdt(p){ return !!p.__sliceBezig; }

function partEstimate(p){
  if (!p.geo) return null;
  const k = partFactor(p);
  const f = partFilament(p);
  const type = f ? f.type : "PLA Basic";
  const sl = partSlice(p);
  if (sl){
    const grams = (sl.volume / 1000) * (FILAMENT_DENSITY[type] || 1.24);
    return {
      volume: sl.volume, sliced: true, layers: sl.layers,
      ...priceFrom({ seconds: sl.seconds, grams, filamentType: type, pricePerKg: f ? f.pricePerKg : undefined }),
    };
  }
  // Terugval voor bestanden die te zwaar waren om helemaal te bewaren.
  return estimate({
    solidVolume: p.geo.volume * Math.pow(k, 3),
    surfaceArea: p.geo.surface * Math.pow(k, 2),
    heightMm: p.geo.size[2] * k,
    infill: p.infill,
    layerHeight: parseFloat(p.layer),
    filamentType: type,
    pricePerKg: f ? f.pricePerKg : undefined,
  });
}

/* Kortingstrappen op het aantal onderdelen, zoals bij een drukkerij. */
function volumeDiscount(totalQty){
  const tiers = pricing().discountTiers || [];
  let pct = 0;
  for (const t of tiers) if (totalQty >= t.from) pct = t.pct;
  return pct;
}

function projectTotals(){
  const parts = state.parts || [];
  const ready = parts.filter(p => p.geo);
  const qty = ready.reduce((s,p) => s + p.qty, 0);
  const subtotal = ready.reduce((s,p) => s + (partEstimate(p)?.unit || 0) * p.qty, 0);
  const pct = volumeDiscount(qty);
  const discount = subtotal * pct / 100;
  const p = pricing();
  const assembly = (state.assembled && ready.length > 1)
    ? p.assemblyBase + p.assemblyPerPart * Math.max(0, ready.length - 1)
    : 0;
  const grams = ready.reduce((s,p) => s + (partEstimate(p)?.grams || 0) * p.qty, 0);
  const seconds = ready.reduce((s,p) => s + (partEstimate(p)?.seconds || 0) * p.qty, 0);
  return {
    parts: ready.length, qty, subtotal, pct, discount, assembly,
    grams, seconds,
    total: Math.max(0, subtotal - discount) + assembly,
    pending: parts.filter(p => p.busy).length,
    failed: parts.filter(p => p.error).length,
    // klopt zolang elk onderdeel echt door de slicer ging
    sliced: ready.length > 0 && ready.every(p => partEstimate(p)?.sliced),
  };
}

  const tot = projectTotals();

      ${p.error ? `
        <div class="cart-item" style="border-color:var(--accent);margin-bottom:12px;">
          <p style="font-size:13px;margin:0;color:var(--accent);">${esc(p.error)}</p>
        </div>` : ``}

      ${p.geo ? `
        <div class="part-body">

                </div>
              </div>` : ``}
            ${!fits ? `<p style="font-size:12px;color:var(--accent);margin:8px 0 0;">
              ${t("up.pastNiet")}
            </p>` : ``}
            ${p.splittable ? `
              <div class="notice" style="margin-top:10px;">
                <p class="notice-title">${ic("puzzle-piece")} ${t("up.losseStukken", { n: p.splittable.length })}</p>
                <p class="muted" style="font-size:12px;margin:0 0 10px;">${t("up.splitsUitleg")}</p>
                <button class="btn btn-accent btn-sm" data-split="${esc(p.id)}">
                  ${ic("scissors")} ${t("up.splitsKnop", { n: p.splittable.length })}
                </button>
              </div>` : ``}
            ${p.omgezet ? `
              <div class="notice" style="margin-top:10px;">
                <p class="notice-title">${ic("file-arrow-down")} ${t("up.omgezetKop")}</p>

            ${p.matchedFrom ? `

                ${t("up.kleurUitBestand", { hex: esc(p.matchedFrom) })}
              </p>` : ``}

/* Hangt de 3D-weergaven aan hun canvas en maakt ze draaibaar met de muis of
   een vinger. De hoek wordt per onderdeel onthouden. */
function attachMeshViewers(){
  document.querySelectorAll('.mesh3d[data-mesh]').forEach(cv=>{
    const part = (state.parts || []).find(p => p.id === cv.dataset.mesh);
    if (!part || !part.geo) return;
    const fil = partFilament(part);
    if (!part.view) part.view = { yaw: 0.7, pitch: 0.45 };

    const paint = (ruw) => {
      drawMesh(cv, part.geo, {
        hex: fil?.hex || "#B8BCC2", finish: fil?.finish || "basic",
        yaw: part.view.yaw, pitch: part.view.pitch, ruw,
      });
    };
    // Eerst de lichte versie: die staat er meteen. Het volledige model — dat
    // kunnen honderdduizenden driehoeken zijn — tekenen we een tel later, als
    // de pagina toch even niets te doen heeft. Zo hapert er niets.
    paint(true);
    const straks = window.requestIdleCallback || ((fn) => setTimeout(fn, 60));
    straks(() => { if (document.body.contains(cv)) paint(false); });

    let dragging = false, lx = 0, ly = 0, netjes = null;
    cv.onpointerdown = (e) => { dragging = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); };
    cv.onpointermove = (e) => {
      if (!dragging) return;
      part.view.yaw += (e.clientX - lx) * 0.011;
      part.view.pitch = Math.max(-1.3, Math.min(1.4, part.view.pitch + (e.clientY - ly) * 0.009));
      lx = e.clientX; ly = e.clientY;
      paint(true);                    // tijdens het slepen de lichte versie
    };
    cv.onpointerup = cv.onpointercancel = () => {
      dragging = false;
      clearTimeout(netjes);
      netjes = setTimeout(() => paint(false), 60);   // en daarna weer het echte model
    };
  });
}

/* Kijkt één keer of de opslag bereikbaar is, zodat een klant het vooraf weet
   in plaats van na het invullen van een hele opdracht. */
async function probeStorage(){
  if (state.storageChecked || !state.user) return;
  state.storageChecked = true;
  try{
    const { getStorage, ref, uploadBytesResumable } = await loadStorage();
    const store = getStorage(app);
    store.maxUploadRetryTime = 8000;
    store.maxOperationRetryTime = 6000;
    const probe = ref(store, `uploads/${state.user.uid}/.probe`);
    const task = uploadBytesResumable(probe, new Blob([new Uint8Array(1)]));
    await new Promise((resolve, reject) => {
      const t = setTimeout(() => { try{ task.cancel(); }catch(e){} reject(new Error("timeout")); }, 9000);
      task.on('state_changed', null,
        err => { clearTimeout(t); reject(err); },
        () => { clearTimeout(t); resolve(); });
    });
  }catch(err){
    state.storageDown = true;
    if (state.view === "custom") render();
  }
}

/* Leest elk onderdeel dat nog op analyse wacht. Dezelfde weg voor een vers
   gekozen bestand als voor een teruggezette opdracht na een herlaadbeurt. */
async function analyseerWachtende(){
  for (const part of (state.parts || []).filter(p => p.busy)){
    try{
      if (/\.obj$/i.test(part.fileName)){
        part.error = t("up.objFout");
        part.busy = false; render(); continue;
      }
      const geos = await analyzeFile(part.file, part.id);
      part.geo = geos[0];
      applyGeoColor(part, geos[0]);
      // Het 3mf wilde niet, maar de vorm hebben we langs een omweg toch. Dan
      // zetten we het onderdeel om naar een echte STL: die kan de printer aan
      // en die kun je later gewoon downloaden.
      if (geos[0].__alsStl){
        const om = deelAlsBestand(geos[0], part.name.replace(/\.3mf$/i, ""));
        part.file = om.file;
        part.fileName = om.file.name;
        part.fileSize = om.file.size;
        part.vereenvoudigd = om.vereenvoudigd;
        part.omgezet = geos[0].__alsStl;
        bewaarBestand(part.id, om.file);
        notify(t("up.omgezetMelding", { wat: geos[0].__alsStl }));
      }
      // een 3mf met meerdere objecten of platen valt meteen uiteen; elk object
      // krijgt zijn eigen bestand zodat je het later los kunt downloaden
      if (geos.length > 1){
        const extra = geos.slice(1).map((g, i) => {
          const naam = g.label || `${part.name} ${i + 2}`;
          const { file, vereenvoudigd } = deelAlsBestand(g, naam);
          const np = newPart(file);
          np.busy = false;
          np.geo = g;
          np.name = naam;
          np.fromSplit = true;
          np.vereenvoudigd = vereenvoudigd;
          applyGeoColor(np, g);
          bewaarBestand(np.id, file);
          return np;
        });
        const eersteNaam = geos[0].label || part.name + " 1";
        const eerste = deelAlsBestand(geos[0], eersteNaam);
        part.file = eerste.file;
        part.fileName = eerste.file.name;
        part.fileSize = eerste.file.size;
        part.vereenvoudigd = eerste.vereenvoudigd;
        bewaarBestand(part.id, eerste.file);
        part.name = eersteNaam;
        part.fromSplit = true;
        const at = state.parts.indexOf(part);
        state.parts.splice(at + 1, 0, ...extra);
        notify(t("up.gevonden", { n: geos.length, bestand: part.fileName }));
      } else {
        // één object, maar misschien meerdere losse stukken erin. Dat zocht de
        // draad al uit tijdens het inlezen; anders doen we het hier alsnog.
        part.splittable = geos[0].__stukken ?? splitGeo(geos[0]);
      }
      // meteen doorsnijden, zodat het eerste scherm de prijs al klaar heeft
      partSlice(part);
    }catch(err){
      part.error = t("up.leesFout") + " " + (err.message || err);
    }finally{
      part.busy = false;
      bewaarOpdracht();
      render();
    }
  }
}

function attachCustomHandlers(){
  herstelOpdracht();       // stond er nog een halfafgewerkte opdracht klaar?
  attachMeshViewers();
  probeStorage();
  const input = document.getElementById('fileInput');
  if (input) input.onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (!Array.isArray(state.parts)) state.parts = [];

    for (const f of files){
      if (state.parts.length >= MAX_PARTS){ notify(`Maximaal ${MAX_PARTS} onderdelen per opdracht`); break; }
      if (!/\.(stl|obj|3mf)$/i.test(f.name)){ notify(`"${f.name}" is geen .stl, .obj of .3mf bestand`); continue; }
      if (f.size > MAX_UPLOAD_BYTES){
        notify(`"${f.name}" is te groot (${(f.size/1024/1024).toFixed(1)}MB, max ${MAX_UPLOAD_BYTES/1024/1024}MB)`); continue;
      }
      state.parts.push(newPart(f));
    }
    render();

    for (const p of state.parts) if (p.file) bewaarBestand(p.id, p.file);
    bewaarOpdracht();
    render();
    await analyseerWachtende();
  };

  document.querySelectorAll('[data-parttype]').forEach(btn=>{
    btn.onclick = () => {
      const part = (state.parts || []).find(p => p.id === btn.dataset.parttype);
      if (!part) return;
      // eerste kleur van het nieuwe type kiezen; de rest volgt daaruit
      const eerste = availableFilaments(null).find(f => f.type === btn.dataset.type);
      if (eerste) part.filamentId = eerste.id;
      bewaarOpdracht();
      render();
    };
  });
  document.querySelectorAll('[data-partfil]').forEach(btn=>{
    btn.onclick = () => {
      const part = (state.parts || []).find(p => p.id === btn.dataset.partfil);
      if (!part) return;
      part.filamentId = btn.dataset.fil;
      bewaarOpdracht();
      render();
    };
  });

  document.querySelectorAll('.kalibreer').forEach(btn=>{
    btn.onclick = async () => {
      const part = (state.parts || []).find(p => p.id === btn.dataset.part);
      const veld = document.querySelector(`.kalmin[data-part="${btn.dataset.part}"]`);
      const echt = parseFloat(veld?.value) * 60;
      const nu = partEstimate(part)?.seconds;
      const s = slicerSettings();
      if (!part || !isFinite(echt) || echt <= 0){ notify("Vul de tijd in minuten in"); return; }
      // De voorbereidingstijd zit in beide getallen; die telt niet mee in de
      // verhouding, anders zou hij dubbel meewegen.
      const onsPrinten = Math.max(1, nu - s.prepSec);
      const echtPrinten = Math.max(1, echt - s.prepSec);
      const nieuw = Math.max(0.2, Math.min(6, (s.timeFactor || 1) * (echtPrinten / onsPrinten)));
      try{
        await savePricing({ ...pricing(), slicer: { ...s, timeFactor: +nieuw.toFixed(3) } });
        part.__sliceKey = null;
        notify(`Afgesteld: correctie ${nieuw.toFixed(2)}× (was ${(s.timeFactor || 1).toFixed(2)}×)`);
        render();
      }catch(err){ notify("Opslaan mislukt: " + err.message); }
    };
  });

  document.querySelectorAll('[data-split]').forEach(btn=>{
    btn.onclick = () => window.__splitPart(btn.dataset.split);
  });

  document.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick = () => {
      state.parts = (state.parts || []).filter(p => p.id !== btn.dataset.remove);
      wisBestand(btn.dataset.remove);
      vergeetInWorkers(btn.dataset.remove);
      bewaarOpdracht();
      render();
    };
  });

  document.querySelectorAll('.part-card').forEach(card=>{
    const part = (state.parts || []).find(p => p.id === card.dataset.part);
    if (!part) return;
    card.querySelectorAll('[data-field]').forEach(el=>{
      const apply = () => {
        const f = el.dataset.field;
        if (f === 'name') { part.name = el.value; bewaarOpdracht(); return; }  // geen render: cursor blijft staan
        if (f === 'qty') part.qty = Math.min(999, Math.max(1, parseInt(el.value,10) || 1));
        else if (f === 'scale') part.scale = parseInt(el.value,10) || 100;
        else if (f === 'infill') part.infill = parseInt(el.value,10);
        else if (f === 'unit') part.unit = el.value;
        else if (f === 'layer') part.layer = el.value;
        else if (f === 'filament') part.filamentId = el.value;
        else if (f === 'filtype'){
          const first = availableFilaments(null).find(x => x.type === el.value);
          part.filamentId = first ? first.id : null;
        }
        bewaarOpdracht();
        render();
      };
      if (el.dataset.field === 'name') el.oninput = apply;
      else if (el.type === 'range') el.oninput = apply;
      else el.onchange = apply;
    });
  });

  const box = document.getElementById('assembleBox');
  if (box) box.onchange = () => { state.assembled = box.checked; bewaarOpdracht(); render(); };

  const notes = document.getElementById('projectNotes');
  if (notes) notes.oninput = () => { state.projectNotes = notes.value; bewaarOpdracht(); };

  const add = document.getElementById('addJobBtn');
  if (add) add.onclick = () => addJobToCart(add);
}

async function addJobToCart(btn){
  if (!state.user){ notify(t("up.logIn")); go("login"); return; }
  const ready = (state.parts || []).filter(p => p.geo);
  if (!ready.length){ notify(t("up.geenBruikbaar")); return; }
  const tot = projectTotals();

  btn.disabled = true;
  const totalBytes = ready.reduce((s, p) => s + p.fileSize, 0);
  let doneBytes = 0;
  const showProgress = (extra) => {
    const pct = totalBytes ? Math.min(100, Math.round((doneBytes + extra) / totalBytes * 100)) : 0;
    btn.innerHTML = `${ic("spinner")} ${t("up.versturen", { pct })}`;
  };
  showProgress(0);

  try{
    // Eerst het documenthok aanmaken: de bestanden hangen eronder.
    const jobDoc = await addDoc(collection(db, "uploads"), {
      uid: state.user.uid, createdAt: Date.now(), status: "bezig",
    });

    const useStorage = !state.storageDown;
    let storeApi = null;
    if (useStorage){
      try{
        const api = await loadStorage();
        const store = api.getStorage(app);
        // Firebase probeert een mislukte upload standaard tot tien minuten
        // opnieuw; zo weten we binnen een halve minuut waar we aan toe zijn.
        store.maxUploadRetryTime = 25000;
        store.maxOperationRetryTime = 15000;
        storeApi = { ...api, store };
      }catch(e){ storeApi = null; }
    }

    const uploaded = [];
    for (let i = 0; i < ready.length; i++){
      const part = ready[i];
      showProgress(0);
      let storage = null, url = null;

      if (storeApi){
        try{
          const sref = storeApi.ref(storeApi.store, `uploads/${state.user.uid}/${jobDoc.id}_${i}_${part.fileName}`);
          const task = storeApi.uploadBytesResumable(sref, part.file);
          await new Promise((resolve, reject) => {
            let last = Date.now();
            const watchdog = setInterval(() => {
              if (Date.now() - last > 30000){
                clearInterval(watchdog);
                try{ task.cancel(); }catch(e){}
                reject(Object.assign(new Error("geen antwoord van de opslag"), { code: "storage/retry-limit" }));
              }
            }, 2000);
            task.on("state_changed",
              snap => { last = Date.now(); showProgress(snap.bytesTransferred); },
              err => { clearInterval(watchdog); reject(err); },
              () => { clearInterval(watchdog); resolve(); });
          });
          url = await storeApi.getDownloadURL(sref);
          storage = { kind: "storage" };
        }catch(err){
          // Storage niet beschikbaar: vanaf hier alles via Firestore.
          storeApi = null;
          state.storageDown = true;
        }
      }

      if (!storage){
        storage = await storeFileInFirestore(jobDoc.id, i, part.file, done => showProgress(done));
      }

      doneBytes += part.fileSize;
      showProgress(0);
      const est = partEstimate(part);
      const f = partFilament(part);
      uploaded.push({
        name: part.name || part.fileName,
        fileName: part.fileName, fileSize: part.fileSize,
        storageUrl: url, storage,
        unit: part.unit, scalePct: part.scale, infill: part.infill, layerHeight: part.layer,
        qty: part.qty,
        sizeMm: partSize(part).map(v => Math.round(v)),
        volumeMm3: Math.round(part.geo.volume * Math.pow(partFactor(part), 3)),
        filament: f ? { id:f.id, type:f.type, name:f.name, hex:f.hex, finish:f.finish } : null,
        grams: est ? +est.grams.toFixed(1) : null,
        seconds: est ? Math.round(est.seconds) : null,
        unitPrice: est ? est.unit : null,
        vereenvoudigd: !!part.vereenvoudigd,
      });
    }

    await setDoc(doc(db, "uploads", jobDoc.id), {
      uid: state.user.uid,
      parts: uploaded,
      assembled: !!state.assembled && tot.assembly > 0,
      notes: state.projectNotes || "",
      status: "klaar",
      totals: {
        parts: tot.parts, qty: tot.qty, grams: +tot.grams.toFixed(1),
        seconds: Math.round(tot.seconds), subtotal: +tot.subtotal.toFixed(2),
        discountPct: tot.pct, assembly: +tot.assembly.toFixed(2), total: +tot.total.toFixed(2),
        sliced: !!tot.sliced,
      },
      createdAt: Date.now(),
    });

    vergeetOpdracht();
    addToCart({
      id: jobDoc.id, kind: "custom",
      uploadId: jobDoc.id,
      name: uploaded.length === 1
        ? t("up.eigenModel", { naam: uploaded[0].name })
        : t("up.eigenOpdracht", { n: uploaded.length }),
      price: Math.round(tot.total * 100) / 100,
      qty: 1,
      sliced: !!tot.sliced,
      jobParts: uploaded.map((u, i) => ({
        name: u.name, qty: u.qty, filament: u.filament,
        fileName: u.fileName, index: i, storage: u.storage, storageUrl: u.storageUrl,
        vereenvoudigd: !!u.vereenvoudigd,
      })),
      assembled: !!state.assembled && tot.assembly > 0,
    });

    state.parts = [];
    state.assembled = false;
    state.projectNotes = "";
    go("cart");
  }catch(err){
    const code = err?.code || "";
    let msg = err.message || String(err);
    if (/storage\/unauthorized|storage\/unauthenticated/.test(code)) {
      msg = t("up.foutToegang");
    } else if (/storage\/retry-limit/.test(code)) {
      msg = t("up.foutStil");
    } else if (/storage\/unknown|storage\/bucket-not-found|storage\/project-not-found/.test(code)) {
      msg = t("up.foutGeenOpslag");
    } else if (/storage\/quota-exceeded/.test(code)) {
      msg = t("up.foutVol");
    }
    notify(t("up.uploadMislukt") + " " + msg);
    btn.disabled = false;
    btn.innerHTML = `<i class="fa-solid fa-cart-plus" aria-hidden="true"></i> ${t("up.naarWagen")}`;
  }
}

/* De gekozen kleur per benoemd stuk, kort weergegeven. */
/* Wat er in de winkelwagen onder de naam staat: één regel per ding, met een
   kopje ervoor. Vroeger stond dit als één kleine grijze regel naast de
   plusknop geperst — dan valt het weg zodra een naam wat langer is. */
function kleurBol(f, k){
  return `<span class="fil-chip ${finishClass(f.finish)}" style="background-color:${esc(f.hex || "#888")};"></span>
          <span>${esc(k || f.name || "")}</span>`;
}
function wagenSpecs(it){
  const regel = (sleutel, waarde) =>
    `<div class="wagen-spec"><span class="sleutel">${esc(sleutel)}</span><span class="waarde">${waarde}</span></div>`;
  const uit = [];
  const vakken = Array.isArray(it.colorChoices) ? it.colorChoices : [];

  if (vakken.length){
    // een model met benoemde kleurvakken: mond geel, arm blauw. Alleen die
    // vakken tonen — de losse kleur eronder is die van het eerste vak en zou
    // er als een vreemde extra regel boven komen te staan.
    for (const c of vakken){
      uit.push(regel(c.slot || t("alg.kleur"),
        kleurBol(c, [c.type, c.name].filter(Boolean).join(" · "))));
    }
  } else if (it.filament){
    // één kleur voor het hele stuk
    if (it.filament.type) uit.push(regel(t("alg.materiaal"), esc(it.filament.type)));
    uit.push(regel(t("alg.kleur"), kleurBol(it.filament, it.filament.name)));
  }

  // een eigen opdracht met meerdere onderdelen
  const delen = Array.isArray(it.jobParts) ? it.jobParts : [];
  if (delen.length){
    uit.push(regel(t("alg.onderdelen"), delen.map(j => `
      <span class="wagen-deel">
        ${j.filament ? `<span class="fil-chip ${finishClass(j.filament.finish)}" style="background-color:${esc(j.filament.hex || "#888")};"></span>` : ``}
        <span>${j.qty}× ${esc(j.name)}${j.filament
          ? ` <span class="muted">— ${esc([j.filament.type, j.filament.name].filter(Boolean).join(" "))}</span>` : ``}</span>
      </span>`).join("")));
    uit.push(regel(t("alg.levering"), t(it.assembled ? "alg.inElkaar" : "alg.los")));
  }

  // De maat staat er alleen bij als de klant hem zelf gekozen heeft — bij
  // maatwerk dus. Bij een geüpload model staat er geen maat in de regel.
  if (it.dims) uit.push(regel(t("alg.maat"), esc(it.dims.join(" × ")) + " mm"));
  // wat er op het stuk geprint moet worden, is het belangrijkste dat je niet
  // mag missen — noch de klant, noch jij bij het printen
  if (it.eigenTekst) uit.push(regel(t("alg.tekst"), `<strong>${esc(it.eigenTekst)}</strong>`));
  return uit.join("");
}

/* De regel die dicht al zichtbaar is: de kleuren als bolletjes, met er kort
   bij wat het is. Genoeg om je winkelwagen te overzien zonder alles open te
   klappen — en de kleuren staan groot, want daar gaat het om. */
function wagenKort(it){
  const vakken = Array.isArray(it.colorChoices) ? it.colorChoices : [];
  const kleuren = vakken.length ? vakken : (it.filament ? [it.filament] : []);
  const bollen = kleuren.slice(0, 6).map(f =>
    `<span class="fil-chip ${finishClass(f.finish)}" style="background-color:${esc(f.hex || "#888")};"
           title="${esc([f.slot, f.type, f.name].filter(Boolean).join(" · "))}"></span>`).join("");
  const woorden = vakken.length
    ? t("shop.kleuren", { n: vakken.length })
    : it.filament ? esc([it.filament.type, it.filament.name].filter(Boolean).join(" · "))
    : (Array.isArray(it.jobParts) && it.jobParts.length) ? t("wagen.onderdelen", { n: it.jobParts.length }) : "";
  const tekst = it.eigenTekst ? `<span>“${esc(it.eigenTekst)}”</span>` : ``;
  return `${bollen}${woorden ? `<span>${woorden}</span>` : ``}${tekst}`;
}

/* =====================================================================
   Bestaat dit adres wel?
   Een pakket dat naar een straat gaat die niet bestaat, komt terug. We kijken
   het daarom na vóór het betalen: eerst de vorm (staat er een huisnummer bij,
   klopt de postcode voor dat land), daarna of het adres echt te vinden is in
   OpenStreetMap. Vinden we het niet, dan houden we niemand tegen — nieuwe
   straten staan er soms nog niet in — maar je krijgt wel de vraag of het klopt.
   ===================================================================== */
const POSTCODE_VORM = {
  "België":     { re: /^\d{4}$/,               uitleg: "adres.vorm.be" },
  "Nederland":  { re: /^\d{4}\s?[A-Za-z]{2}$/, uitleg: "adres.vorm.nl" },
  "Duitsland":  { re: /^\d{5}$/,               uitleg: "adres.vorm.de" },
  "Frankrijk":  { re: /^\d{5}$/,               uitleg: "adres.vorm.fr" },
};
const LANDCODE = { "België": "be", "Nederland": "nl", "Duitsland": "de", "Frankrijk": "fr" };

function adresVorm({ street, zip, city }, land){
  if (!street || !zip || !city) return t("adres.volledig");
  if (!/\d/.test(street)) return t("adres.huisnummer");
  const vorm = POSTCODE_VORM[land];
  if (vorm && !vorm.re.test(zip)) return t("adres.postcode", { land: landTekst(land), uitleg: t(vorm.uitleg) });
  return null;
}

/* OpenStreetMap kent bijna elk adres en vraagt er niets voor. Lukt het
   opzoeken niet — geen verbinding, dienst plat — dan laten we het gaan: aan
   een klant die niet kan bestellen heeft niemand iets. */
async function zoekAdres({ street, zip, city }, land){
  const p = new URLSearchParams({ format: "jsonv2", limit: "1", addressdetails: "1", street, city });
  if (POSTCODE_VORM[land]) p.set("postalcode", zip);
  if (LANDCODE[land]) p.set("countrycodes", LANDCODE[land]);
  try{
    const res = await fetch("https://nominatim.openstreetmap.org/search?" + p, {
      headers: { "Accept": "application/json" },
    });
    if (!res.ok) return { status: "onbereikbaar" };
    const rij = (await res.json())[0];
    if (!rij) return { status: "onbekend" };
    const a = rij.address || {};
    return {
      status: "gevonden",
      // wat OpenStreetMap ervan maakt; handig als iemand zich vertikt heeft
      gevonden: {
        zip: a.postcode || zip,
        city: a.city || a.town || a.village || a.municipality || city,
      },
    };
  }catch(e){ return { status: "onbereikbaar" }; }
}

function attachCheckoutHandlers(){

  // verzenden of afhalen

    b.onclick = () => {
      state.__leverwijze = b.dataset.lever;
      state.__adresCheck = null;
      render();
    };
  });
  document.querySelectorAll('[data-slot-at]').forEach(b => {

      notify(t("ck.codeToegepast", { code: uit.code, uitleg: uit.uitleg }));
    } else {
      state.__korting = null;
      state.__codeFout = uit.waarom;
    }
    render();
  };
  const wisCode = veld('wisCodeBtn');
  if (wisCode) wisCode.onclick = () => { state.__korting = null; state.__codeFout = null; render(); };

  if (sel){
    sel.onchange = () => {
      state.__ckLand = sel.value;
      state.__adresCheck = null;
      render();                 // de grens voor gratis verzending kan meeschuiven
    };
    // typ je iets bij, dan geldt een eerder oordeel niet meer
    for (const id of ['ckStreet','ckZip','ckCity']){
      const el = veld(id);
      if (el) el.oninput = () => {
        state.__ckVeld = lees();
        if (state.__adresCheck) { state.__adresCheck = null; render(); }
      };
    }
  }

  const doorGaan = (extra) => {
    // lees() als achtervang: heb je niets getypt omdat het adres al ingevuld
    // stond, dan is __ckVeld nog leeg en zou de bestelling zonder adres vertrekken
    state.__checkout = { country: sel?.value || "België", address: state.__ckVeld || lees(), ...extra };
    state.__adresCheck = null;
    go("payment");
  };
  const door = veld('tochDoorBtn');
  if (door) door.onclick = () => doorGaan();
  const over = veld('neemOverBtn');
  if (over) over.onclick = () => {
    state.__ckVeld = { ...state.__ckVeld, ...state.__adresCheck.voorstel };
    doorGaan();
  };

  veld('placeOrderBtn').onclick = async () => {
    // afhalen: geen adres nodig, wel een moment
    if (ophalen){
      if (!state.__afhaal){ notify(t("ck.kiesMoment")); return; }
      if (!afhaalMomenten().includes(state.__afhaal)){
        state.__afhaal = null;
        notify(t("ck.momentWeg"));
        render();
        return;
      }
      doorGaan({ pickupAt: state.__afhaal });
      return;
    }

    const adres = lees();
    state.__ckVeld = adres;
    state.__ckLand = sel.value;
    const fout = adresVorm(adres, sel.value);
    if (fout){ notify(fout); return; }

    state.__adresCheck = { bezig: true };
    render();
    const uitslag = await zoekAdres(adres, sel.value);

    if (uitslag.status === "onbekend"){
      state.__adresCheck = { status: "onbekend" };
      render();
      return;
    }
    if (uitslag.status === "gevonden"){
      const g = uitslag.gevonden;
      const anders = (x, y) => x.replace(/\s/g, "").toLowerCase() !== y.replace(/\s/g, "").toLowerCase();
      if (anders(g.zip, adres.zip) || anders(g.city, adres.city)){
        state.__adresCheck = { status: "afwijkend", voorstel: g };
        render();
        return;
      }
    }
    // gevonden en gelijk, of we konden het niet nakijken: laat de klant door
    state.__checkout = { country: sel.value, address: adres };
    state.__adresCheck = null;
    go("payment");
  };
}

/* Werkdagen na de bestelling: printen plus verzending, per bestemming. */
const DELIVERY_DAYS = {
  "België": [3, 5], "Nederland": [4, 6], "Duitsland": [4, 7], "Frankrijk": [4, 7],
  "Andere EU-landen": [5, 9], "Buiten de EU": [8, 15],
};
function addWorkingDays(from, days){
  const d = new Date(from);
  let left = days;
  while (left > 0){
    d.setDate(d.getDate() + 1);
    if (d.getDay() !== 0 && d.getDay() !== 6) left--;
  }
  return d;
}
function fmtDate(d){ return d.toLocaleDateString(loc(), { day:'numeric', month:'long' }); }
function deliveryWindow(o){
  const [min, max] = DELIVERY_DAYS[o.shippingCountry] || DELIVERY_DAYS["België"];
  return { from: addWorkingDays(o.createdAt, min), to: addWorkingDays(o.createdAt, max) };
}
function orderNumber(o){ return "#" + String(o.id || "").slice(-6).toUpperCase(); }

function orderTracker(o){
  const idx = Math.max(0, ORDER_STEPS.indexOf(o.status));
  return `<div class="track">${ORDER_STEPS.map((s,i)=>`
    <div class="track-step ${i < idx ? 'done' : i === idx ? 'active' : ''}">
      <span class="track-dot"></span><span class="track-label">${esc(statusTekst(s))}</span>
    </div>`).join("")}</div>`;
}
function etaLine(o){
  if (o.status === "Geleverd"){
    // Heeft de klant het zelf bevestigd, dan is het rond. Zette de shop hem op
    // geleverd, dan mag de klant het nog altijd zelf bevestigen.
    if (o.receivedAt) return `
      <div class="eta"><i class="fa-solid fa-box-open" aria-hidden="true"></i>
        <strong>${t("eta.ontvangen")}</strong> ${t("eta.bevestigdOp", { datum: esc(new Date(o.receivedAt).toLocaleDateString(loc(), { day:'numeric', month:'long', year:'numeric' })) })}
      </div>`;
    return `
      <div class="eta" style="display:block;">
        <p style="margin:0 0 4px;">${ic("box-open")} <strong>${t("eta.geleverd")}</strong></p>
        <p class="muted" style="font-size:12px;margin:0 0 10px;">${t("eta.aangekomen")}</p>
        <button class="btn btn-accent btn-sm" onclick="window.__confirmReceived('${o.id}')">
          ${ic("circle-check")} ${t("eta.bevestig")}
        </button>
      </div>`;
  }
  const w = deliveryWindow(o);
  const van = `<strong>${esc(fmtDate(w.from))}</strong>`, tot = `<strong>${esc(fmtDate(w.to))}</strong>`;
  if (o.status === "Verzonden"){
    return `
      <div class="eta" style="display:block;">
        <p style="margin:0 0 4px;">${ic("truck")} ${t("eta.onderweg", { van, tot })}</p>
        <p class="muted" style="font-size:12px;margin:0 0 10px;">${t("eta.aangekomen")}</p>

          ${ic("circle-check")} ${t("eta.bevestig")}
        </button>
      </div>`;
  }
  return `<div class="eta">${ic("truck")} ${t("eta.verwacht", { van, tot })}</div>`;
}
