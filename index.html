/* --------------------------- ZIP --------------------------- */
/* Een 3MF is een zip. De browser kan deflate zelf uitpakken, dus we hebben
   geen bibliotheek nodig — alleen de indeling van het zipbestand. */
async function unzip(buffer){
  const view = new DataView(buffer);
  const eind = buffer.byteLength;
  const files = new Map();

  // Elke leesbewerking eerst aftoetsen. Zonder deze controle geeft de browser
  // enkel "Out of bounds access", waar niemand iets aan heeft.
  const kan = (off, len) => off >= 0 && off + len <= eind;
  const u16 = (off) => { if (!kan(off, 2)) throw new Error("het bestand is onvolledig of beschadigd"); return view.getUint16(off, true); };
  const u32 = (off) => { if (!kan(off, 4)) throw new Error("het bestand is onvolledig of beschadigd"); return view.getUint32(off, true); };
  const u64 = (off) => {
    if (!kan(off, 8)) throw new Error("het bestand is onvolledig of beschadigd");
    const n = view.getBigUint64(off, true);
    if (n > BigInt(Number.MAX_SAFE_INTEGER)) throw new Error("het bestand is te groot om in de browser te openen");
    return Number(n);
  };

  // eind van de centrale map opzoeken, achteraan het bestand
  let eocd = -1;
  for (let i = eind - 22; i >= Math.max(0, eind - 66000); i--){
    if (kan(i, 4) && view.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error("dit is geen geldig zip- of 3mf-bestand");

  let count = u16(eocd + 10);
  let p = u32(eocd + 16);

  // Zip64: bij grote of door sommige slicers geschreven archieven staan de
  // echte aantallen en posities niet in de gewone staart maar in een extra
  // blok ervoor. Bambu Studio schrijft die vorm.
  const loc = eocd - 20;
  if (loc >= 0 && kan(loc, 4) && view.getUint32(loc, true) === 0x07064b50){
    const z64 = u64(loc + 8);
    if (kan(z64, 4) && view.getUint32(z64, true) === 0x06064b50){
      count = u64(z64 + 32);
      p = u64(z64 + 48);
    }
  }

  for (let i = 0; i < count; i++){
    if (!kan(p, 46) || view.getUint32(p, true) !== 0x02014b50) break;
    const method   = u16(p + 10);
    const flags    = u16(p + 8);
    let   compSize = u32(p + 20);
    let   uncSize  = u32(p + 24);
    const nameLen  = u16(p + 28);
    const extraLen = u16(p + 30);
    const cmtLen   = u16(p + 32);
    let   localOff = u32(p + 42);
    if (!kan(p + 46, nameLen)) throw new Error("het bestand is onvolledig of beschadigd");
    const name = new TextDecoder().decode(new Uint8Array(buffer, p + 46, nameLen));

    // Zip64-veld in de extra gegevens: alles wat 0xFFFFFFFF is staat daar echt.
    let e = p + 46 + nameLen;
    const extraEind = e + extraLen;
    while (e + 4 <= extraEind){
      const id = u16(e), len = u16(e + 2);
      if (id === 0x0001){
        let q = e + 4;
        if (uncSize  === 0xFFFFFFFF && q + 8 <= e + 4 + len){ uncSize  = u64(q); q += 8; }
        if (compSize === 0xFFFFFFFF && q + 8 <= e + 4 + len){ compSize = u64(q); q += 8; }
        if (localOff === 0xFFFFFFFF && q + 8 <= e + 4 + len){ localOff = u64(q); q += 8; }
        break;
      }
      e += 4 + len;
    }
    p = extraEind + cmtLen;

    // de lokale kop herhaalt de lengtes; alleen daar staat de echte offset
    if (!kan(localOff, 30) || view.getUint32(localOff, true) !== 0x04034b50){
      throw new Error("het bestand is onvolledig of beschadigd");
    }
    const lNameLen  = u16(localOff + 26);
    const lExtraLen = u16(localOff + 28);
    const dataOff = localOff + 30 + lNameLen + lExtraLen;

    // Bij een gegevensbeschrijver achteraf staat de maat alleen in de centrale
    // map; die gebruiken we hier al. Blijft ze nul, dan lezen we tot het einde.
    let lengte = compSize;
    if ((flags & 8) && !lengte) lengte = eind - dataOff;
    if (!kan(dataOff, lengte)) throw new Error(`onderdeel "${name}" valt buiten het bestand`);
    const raw = new Uint8Array(buffer, dataOff, lengte);

    if (method === 0){ files.set(name, raw); continue; }
    if (method !== 8) continue;                      // alleen deflate komt voor
    try{
      const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      files.set(name, new Uint8Array(await new Response(stream).arrayBuffer()));
    }catch(err){
      // Eén onleesbaar onderdeel mag het hele bestand niet onbruikbaar maken:
      // vaak hebben we alleen 3D/3dmodel.model nodig.
      if (/3dmodel\.model$/i.test(name)) throw new Error(`het model in dit bestand kon niet uitgepakt worden`);
    }
  }
  if (!files.size) throw new Error("dit 3mf-bestand bevat geen leesbare onderdelen");
  return files;
}

/* --------------------------- 3MF --------------------------- */
function mat4mul(a, b){
  const o = new Array(16).fill(0);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++)
    for (let k = 0; k < 4; k++) o[r*4+c] += a[r*4+k] * b[k*4+c];
  return o;
}
/* 3MF schrijft een transform als 12 getallen: 3x3 plus verschuiving. */
function parseTransform(s){
  if (!s) return null;
  const v = s.trim().split(/\s+/).map(Number);
  if (v.length !== 12 || v.some(x => !isFinite(x))) return null;
  return [ v[0],v[1],v[2],0,  v[3],v[4],v[5],0,  v[6],v[7],v[8],0,  v[9],v[10],v[11],1 ];
}
function applyTransform(mesh, t){
  if (!t) return mesh;
  const out = new Float32Array(mesh.length);
  for (let i = 0; i < mesh.length; i += 3){
    const x = mesh[i], y = mesh[i+1], z = mesh[i+2];
    out[i]   = x*t[0] + y*t[4] + z*t[8]  + t[12];
    out[i+1] = x*t[1] + y*t[5] + z*t[9]  + t[13];
    out[i+2] = x*t[2] + y*t[6] + z*t[10] + t[14];
  }
  return out;
}

async function parse3mf(buffer){
  const files = await unzip(buffer);
  let modelName = null;
  for (const k of files.keys()) if (/3dmodel\.model$/i.test(k)) { modelName = k; break; }
  if (!modelName) throw new Error("geen model gevonden in het 3mf-bestand");
  const xml = new TextDecoder().decode(files.get(modelName));
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("het 3mf-bestand is beschadigd");

  const unit = doc.documentElement.getAttribute("unit") || "millimeter";
  const scale = { micron:0.001, millimeter:1, centimeter:10, inch:25.4, foot:304.8, meter:1000 }[unit] || 1;

  // kleuren uit basismaterialen en kleurgroepen
  const colors = new Map();   // "pid:index" -> #rrggbb
  for (const grp of doc.getElementsByTagName("basematerials")){
    const pid = grp.getAttribute("id");
    [...grp.getElementsByTagName("base")].forEach((b, i) => {
      const c = (b.getAttribute("displaycolor") || "").slice(0, 7);
      if (/^#[0-9a-f]{6}$/i.test(c)) colors.set(pid + ":" + i, c.toUpperCase());
    });
  }
  for (const tag of ["colorgroup", "m:colorgroup"]){
    for (const grp of doc.getElementsByTagName(tag)){
      const pid = grp.getAttribute("id");
      [...grp.children].forEach((c, i) => {
        const v = (c.getAttribute("color") || "").slice(0, 7);
        if (/^#[0-9a-f]{6}$/i.test(v)) colors.set(pid + ":" + i, v.toUpperCase());
      });
    }
  }

  // objecten met hun eigen driehoeken
  const objects = new Map();
  for (const obj of doc.getElementsByTagName("object")){
    const id = obj.getAttribute("id");
    const mesh = obj.getElementsByTagName("mesh")[0];
    const entry = { id, name: obj.getAttribute("name") || "", components: [], mesh: null, colorHex: null };
    const opid = obj.getAttribute("pid"), opx = obj.getAttribute("pindex");
    if (opid && opx != null) entry.colorHex = colors.get(opid + ":" + opx) || null;

    const comps = obj.getElementsByTagName("components")[0];
    if (comps){
      for (const c of comps.getElementsByTagName("component")){
        entry.components.push({ id: c.getAttribute("objectid"), t: parseTransform(c.getAttribute("transform")) });
      }
    }
    if (mesh){
      const vs = mesh.getElementsByTagName("vertices")[0];
      const ts = mesh.getElementsByTagName("triangles")[0];
      if (vs && ts){
        const vlist = vs.getElementsByTagName("vertex");
        const verts = new Float32Array(vlist.length * 3);
        for (let i = 0; i < vlist.length; i++){
          verts[i*3]   = parseFloat(vlist[i].getAttribute("x")) * scale;
          verts[i*3+1] = parseFloat(vlist[i].getAttribute("y")) * scale;
          verts[i*3+2] = parseFloat(vlist[i].getAttribute("z")) * scale;
        }
        const tlist = ts.getElementsByTagName("triangle");
        const out = new Float32Array(tlist.length * 9);
        const tally = new Map();
        for (let i = 0; i < tlist.length; i++){
          const tr = tlist[i];
          const a = +tr.getAttribute("v1"), b = +tr.getAttribute("v2"), c = +tr.getAttribute("v3");
          out.set(verts.subarray(a*3, a*3+3), i*9);
          out.set(verts.subarray(b*3, b*3+3), i*9+3);
          out.set(verts.subarray(c*3, c*3+3), i*9+6);
          const pid = tr.getAttribute("pid") || opid, p1 = tr.getAttribute("p1");
          if (pid && p1 != null){
            const hex = colors.get(pid + ":" + p1);
            if (hex) tally.set(hex, (tally.get(hex) || 0) + 1);
          }
        }
        entry.mesh = out;
        // de kleur die op de meeste driehoeken staat, wint
        if (tally.size){
          entry.colorHex = [...tally.entries()].sort((a,b) => b[1] - a[1])[0][0];
        }
      }
    }
    objects.set(id, entry);
  }

  // een object kan andere objecten bevatten; die vouwen we uit
  function flatten(id, t, depth = 0){
    const o = objects.get(id);
    if (!o || depth > 8) return [];
    const out = [];
    if (o.mesh) out.push({ mesh: applyTransform(o.mesh, t), colorHex: o.colorHex, name: o.name });
    for (const c of o.components) out.push(...flatten(c.id, t && c.t ? mat4mul(c.t, t) : (c.t || t), depth + 1));
    return out;
  }

  // plaatindeling van Bambu Studio, als die er is
  const plateOf = new Map();
  const cfgName = [...files.keys()].find(k => /model_settings\.config$/i.test(k));
  if (cfgName){
    try{
      const cfg = new DOMParser().parseFromString(new TextDecoder().decode(files.get(cfgName)), "application/xml");
      [...cfg.getElementsByTagName("plate")].forEach((pl, i) => {
        for (const inst of pl.getElementsByTagName("model_instance")){
          for (const md of inst.getElementsByTagName("metadata")){
            if (md.getAttribute("key") === "object_id") plateOf.set(md.getAttribute("value"), i + 1);
          }
        }
      });
    }catch(e){ /* zonder plaatinfo werken we gewoon per object verder */ }
  }

  const parts = [];
  const items = [...doc.getElementsByTagName("item")];
  const list = items.length ? items : [...objects.values()].filter(o => o.mesh).map(o => ({
    getAttribute: k => k === "objectid" ? o.id : null,
  }));

  list.forEach((item, idx) => {
    const oid = item.getAttribute("objectid");
    const t = parseTransform(item.getAttribute ? item.getAttribute("transform") : null);
    for (const piece of flatten(oid, t)){
      if (!piece.mesh || !piece.mesh.length) continue;
      const plate = plateOf.get(oid);
      parts.push(geoFromMesh(piece.mesh, {
        colorHex: piece.colorHex,
        label: piece.name || (plate ? `Plaat ${plate}` : null) || `Deel ${idx + 1}`,
        plate,
      }));
      if (plate) parts[parts.length - 1].plate = plate;
    }
  });

  if (!parts.length) throw new Error("het 3mf-bestand bevat geen bruikbare vorm");
  return parts;
}

/* --------------------------- losse delen vinden --------------------------- */
/* Een model kan uit meerdere losse stukken bestaan. We leggen er een grof
   rooster overheen, kleuren de vakjes waar materiaal zit, en kijken welke
   groepen vakjes aan elkaar hangen. Dat is snel en werkt ook op een
   steekproef, terwijl vergelijken van punt tot punt veel te zwaar zou zijn. */

/* Splitst een model in losse geometrieën, één per gevonden deel. */

/* =====================================================================
   Een los onderdeel als eigen bestand
   Splits je een model, dan moet je later ook echt díe arm kunnen downloaden.
   Daarom schrijven we per onderdeel een eigen binaire STL uit de driehoeken
   van dat stuk. Vroeger bewaarden alle onderdelen het oorspronkelijke
   bestand, en kreeg je bij het downloaden telkens het hele model terug.
   ===================================================================== */
function meshNaarStl(mesh, naam){
  const n = mesh.length / 9;
  const buf = new ArrayBuffer(84 + n * 50);
  const dv = new DataView(buf);
  // kop van 80 bytes: daar mag je in zetten wat je wil
  const kop = new TextEncoder().encode(("Extrudo " + naam).slice(0, 79));
  new Uint8Array(buf, 0, 80).set(kop);
  dv.setUint32(80, n, true);
  let at = 84;
  for (let o = 0; o < mesh.length; o += 9){
    // normaal: veel programma's negeren hem, maar hij hoort erbij
    const ux = mesh[o+3]-mesh[o],   uy = mesh[o+4]-mesh[o+1], uz = mesh[o+5]-mesh[o+2];
    const vx = mesh[o+6]-mesh[o],   vy = mesh[o+7]-mesh[o+1], vz = mesh[o+8]-mesh[o+2];
    let nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
    const len = Math.hypot(nx, ny, nz) || 1;
    dv.setFloat32(at, nx/len, true); dv.setFloat32(at+4, ny/len, true); dv.setFloat32(at+8, nz/len, true);
    for (let k = 0; k < 9; k++) dv.setFloat32(at + 12 + k*4, mesh[o+k], true);
    dv.setUint16(at + 48, 0, true);
    at += 50;
  }
  return new File([buf], naam.replace(/[^\w .-]+/g, "_") + ".stl", { type: "model/stl" });
}

/* Maakt van één gesplitst stuk een onderdeel met zijn eigen bestand. */
function deelAlsBestand(geo, naam){
  const mesh = geo.full || geo.mesh;
  const file = meshNaarStl(mesh, naam);
  // Hadden we alleen de uitgedunde versie, dan is dit bestand ook uitgedund.
  // Dat mag je niet stilzwijgend laten printen, dus het onderdeel krijgt een
  // merkteken dat in het beheer zichtbaar is.
  return { file, vereenvoudigd: !geo.full };
}

/* Zoekt het ingeschakelde filament dat het dichtst bij een kleur ligt. */
function nearestFilament(hex){
  const list = availableFilaments(null);
  if (!list.length || !hex) return null;
  const { r, g, b } = hexToRgb(hex);
  let best = null, bestD = Infinity;
  for (const f of list){
    const c = hexToRgb(f.hex);
    const d = (r-c.r)**2 + (g-c.g)**2 + (b-c.b)**2;
    if (d < bestD){ bestD = d; best = f; }
  }
  return best;
}

/* =====================================================================
   3D-voorbeeld bij een product
   Je zet er zelf het model bij dat je verkoopt; de klant kan het draaien en
   ziet het in de kleur die hij kiest. Het model wordt eerst uitgedund en
   daarna per punt teruggebracht tot twee bytes: nauwkeurig genoeg om naar te
   kijken, klein genoeg om naast het product te bewaren. Bestaat een model uit
   meerdere objecten, dan hoort object 1 bij kleurvak 1, object 2 bij vak 2 —
   precies zoals je het in Bambu Studio klaarzet.
   ===================================================================== */
/* Samen over alle onderdelen. De grens komt van Firestore: een document mag
   niet groter zijn dan een megabyte. Sinds we punten knopen in plaats van elke
   driehoek voluit te bewaren, past er ongeveer het dubbele in — en dat is
   precies waar het blokkige vandaan kwam. */
const VOORBEELD_DRIEHOEKEN = 55000;

/* Vereenvoudigt een model door punten die dicht bij elkaar liggen op één punt
   te leggen: het model gaat over een denkbeeldig rooster en alle punten in
   hetzelfde vakje worden één punt. Driehoeken blijven zo aan elkaar vastzitten
   en het oppervlak blijft dicht — je houdt een massief lichaam over.

   Zomaar elke zoveelste driehoek weglaten werkt niet: dan blijven er losse
   driehoeken over met gaten ertussen, en dat ziet eruit als een kluwen draden.
   Precies dat ging hier eerder mis. */
function roosterVereenvoudig(mesh, vakken){
  const n = mesh.length / 9;
  const min = [Infinity,Infinity,Infinity], max = [-Infinity,-Infinity,-Infinity];
  for (let o = 0; o < mesh.length; o += 3){
    for (let d = 0; d < 3; d++){
      const v = mesh[o+d];
      if (v < min[d]) min[d] = v;
      if (v > max[d]) max[d] = v;
    }
  }
  const span = Math.max(max[0]-min[0], max[1]-min[1], max[2]-min[2]) || 1;
  const cel = span / vakken;
  const nx = Math.max(1, Math.ceil((max[0]-min[0]) / cel) + 1);
  const ny = Math.max(1, Math.ceil((max[1]-min[1]) / cel) + 1);
  const nz = Math.max(1, Math.ceil((max[2]-min[2]) / cel) + 1);
  if (nx * ny * nz > 12_000_000) return mesh;      // te fijn om te doen

  // eerst per vakje het zwaartepunt van de punten die erin vallen: dat geeft
  // een vloeiender vorm dan het midden van het vakje
  const som = new Float64Array(nx*ny*nz*3), tel = new Uint32Array(nx*ny*nz);
  const vak = (x,y,z) =>
    Math.min(nx-1, Math.floor((x-min[0])/cel)) +
    Math.min(ny-1, Math.floor((y-min[1])/cel)) * nx +
    Math.min(nz-1, Math.floor((z-min[2])/cel)) * nx * ny;
  const vakVan = new Uint32Array(n * 3);
  for (let t = 0; t < n; t++){
    for (let k = 0; k < 3; k++){
      const o = t*9 + k*3;
      const c = vak(mesh[o], mesh[o+1], mesh[o+2]);
      vakVan[t*3+k] = c;
      som[c*3] += mesh[o]; som[c*3+1] += mesh[o+1]; som[c*3+2] += mesh[o+2];
      tel[c]++;
    }
  }

  // dan de driehoeken opnieuw opbouwen; een driehoek met twee punten in
  // hetzelfde vakje is platgedrukt en kan weg
  const uit = new Float32Array(n * 9);
  let w = 0;
  for (let t = 0; t < n; t++){
    const a = vakVan[t*3], b = vakVan[t*3+1], c = vakVan[t*3+2];
    if (a === b || b === c || a === c) continue;
    for (const q of [a, b, c]){
      uit[w++] = som[q*3] / tel[q];
      uit[w++] = som[q*3+1] / tel[q];
      uit[w++] = som[q*3+2] / tel[q];
    }
  }
  return uit.subarray(0, w);
}

/* Vereenvoudigt tot er ongeveer `houd` driehoeken over zijn: fijner rooster
   geeft er meer, grover minder. Een paar stappen volstaat om in de buurt te
   komen. */
function vereenvoudigTot(mesh, houd){
  const n = mesh.length / 9;
  if (n <= houd) return mesh;
  let laag = 12, hoog = 320, beste = null;
  for (let ronde = 0; ronde < 7; ronde++){
    const vakken = Math.round((laag + hoog) / 2);
    const uit = roosterVereenvoudig(mesh, vakken);
    const m = uit.length / 9;
    if (m <= houd){ beste = uit; laag = vakken; } else { hoog = vakken; }
    if (hoog - laag <= 2) break;
  }
  // Lukt het met geen enkel rooster, dan is het model zo fijn dat zelfs het
  // grofste te veel oplevert; neem dan het grofste dat we hebben.
  return beste || roosterVereenvoudig(mesh, 12);
}

/* Alle onderdelen delen één omhullende doos, anders schuiven ze uit elkaar. */
function voorbeeldUitDelen(delen){
  const min = [Infinity,Infinity,Infinity], max = [-Infinity,-Infinity,-Infinity];
  const ruw = delen.map(d => d.full || d.mesh).filter(m => m && m.length);
  if (!ruw.length) throw new Error("geen vorm gevonden om te tonen");
  for (const m of ruw){
    for (let o = 0; o < m.length; o += 3){
      for (let d = 0; d < 3; d++){
        const v = m[o+d];
        if (v < min[d]) min[d] = v;
        if (v > max[d]) max[d] = v;
      }
    }
  }
  const span = Math.max(max[0]-min[0], max[1]-min[1], max[2]-min[2]) || 1;
  const totaal = ruw.reduce((s,m) => s + m.length/9, 0);
  const factor = Math.min(1, VOORBEELD_DRIEHOEKEN / totaal);
  return {
    min, span,
    size: [max[0]-min[0], max[1]-min[1], max[2]-min[2]],
    parts: ruw.map((m, i) => {
      const dun = vereenvoudigTot(m, Math.max(400, Math.floor(m.length/9 * factor)));
      const u = new Uint16Array(dun.length);
      for (let o = 0; o < dun.length; o += 3){
        for (let d = 0; d < 3; d++){
          u[o+d] = Math.max(0, Math.min(65535, Math.round((dun[o+d] - min[d]) / span * 65535)));
        }
      }
      return { ...knoopPunten(u), label: delen[i]?.label || null };
    }),
  };
}

/* Punten die precies op elkaar liggen één keer bewaren, en de driehoeken naar
   die punten laten verwijzen. In een gesloten model deelt elk punt gemiddeld
   zes driehoeken, dus dat scheelt ongeveer de helft aan opslag — en die ruimte
   gaat rechtstreeks naar meer driehoeken, dus naar een gladder model.
   Zijn er te veel punten om er met twee bytes naar te wijzen, dan bewaren we
   het onderdeel gewoon plat; dat blijft altijd werken. */
function knoopPunten(u){
  const n = u.length / 3;
  const kaart = new Map();
  const punten = [];
  const idx = new Uint16Array(n);
  for (let i = 0; i < n; i++){
    const o = i * 3;
    const s = u[o] + "," + u[o+1] + "," + u[o+2];
    let k = kaart.get(s);
    if (k === undefined){
      k = punten.length / 3;
      if (k > 65535) return { u };            // te veel punten: plat bewaren
      punten.push(u[o], u[o+1], u[o+2]);
      kaart.set(s, k);
    }
    idx[i] = k;
  }
  return { p: new Uint16Array(punten), i: idx };
}

/* Terug naar echte punten. Zowel de geknoopte vorm als de oude platte vorm. */
function voorbeeldNaarMeshes(v){
  return v.parts.map(p => {
    if (p.u){
      const u = p.u, m = new Float32Array(u.length);
      for (let o = 0; o < u.length; o += 3){
        for (let d = 0; d < 3; d++) m[o+d] = v.min[d] + u[o+d] / 65535 * v.span;
      }
      return m;
    }
    const m = new Float32Array(p.i.length * 3);
    for (let t = 0; t < p.i.length; t++){
      const b = p.i[t] * 3, o = t * 3;
      for (let d = 0; d < 3; d++) m[o+d] = v.min[d] + p.p[b+d] / 65535 * v.span;
    }
    return m;
  });
}

const bytesVan = (arr) =>
  Bytes.fromUint8Array(new Uint8Array(arr.buffer, arr.byteOffset, arr.byteLength));

async function bewaarVoorbeeld(productId, v){
  await setDoc(doc(db, "previews", productId), {
    min: v.min, span: v.span, size: v.size,
    parts: v.parts.map(p => p.u
      // een onderdeel met te veel punten om te knopen: plat, zoals vroeger
      ? { b: bytesVan(p.u), label: p.label || null }
      : { p: bytesVan(p.p), i: bytesVan(p.i), label: p.label || null }),
    createdAt: Date.now(),
  });
}
/* Bytes uit Firestore hoeven niet op een even adres te beginnen; een Uint16Array
   eist dat wel. Daarom altijd overkopiëren. */
function alsU16(bytes){
  const u = new Uint16Array(bytes.length / 2);
  new Uint8Array(u.buffer).set(bytes);
  return u;
}
async function wisVoorbeeld(productId){
  try{ await deleteDoc(doc(db, "previews", productId)); }catch(e){ /* stond er al niet */ }
}
/* Eén keer ophalen per product; daarna uit het geheugen. */
const voorbeeldCache = new Map();
let voorbeeldFout = null;
async function haalVoorbeeld(productId){
  if (voorbeeldCache.has(productId)) return voorbeeldCache.get(productId);
  let uit = null;
  try{
    const snap = await getDoc(doc(db, "previews", productId));
    if (snap.exists()){
      const d = snap.data();
      uit = {
        min: d.min, span: d.span, size: d.size,
        // p + i is de geknoopte vorm; b is de oude platte vorm, die blijft
        // gewoon werken voor voorbeelden die er al stonden
        parts: (d.parts || []).map(p => p.b
          ? { u: alsU16(p.b.toUint8Array()), label: p.label || null }
          : { p: alsU16(p.p.toUint8Array()), i: alsU16(p.i.toUint8Array()), label: p.label || null }),
      };
    }
  }catch(e){
    // geen voorbeeld is op zich geen probleem, maar een geweigerde toegang wel:
    // dan staat het model er wél en mag je niet denken dat het kwijt is
    if (/permission-denied/.test(e?.code || "")) voorbeeldFout = e;
  }
  voorbeeldCache.set(productId, uit);
  return uit;
}

/* --------------------------- inlezen per bestand --------------------------- */
/* Geeft één of meer geometrieën terug: een 3MF met meerdere objecten of
   platen valt hier al uiteen in losse delen. */
/* =====================================================================
   Als een 3mf niet meewil
   Een 3mf is een zipbestand met een XML-model erin, en daar gaat wel eens iets
   mis: een slicer die de zip net anders schrijft, een beschadigd model, of een
   bestand dat eigenlijk gewoon een STL is met de verkeerde naam. In plaats van
   te zeggen "kan niet" proberen we de vorm er langs een andere weg uit te
   halen. Lukt dat, dan gaat het onderdeel verder als STL — kleuren en losse
   objecten zijn dan weg, maar de vorm klopt en je kunt gewoon bestellen.
   ===================================================================== */
async function stlUitDe3mf(buf, naam){
  // 1. Misschien is het helemaal geen zip maar een STL met .3mf erachter.
  //    parseStl herkent zowel de binaire als de tekstvorm.
  try{
    const geo = parseStl(buf);
    if (geo && geo.volume) return { geo, waarom: "het bleek een gewone STL te zijn" };
  }catch(e){}

  // 2. Het is wél een zip: dan zit er soms een STL in (sommige slicers bewaren
  //    het origineel ernaast). Die lezen we dan gewoon uit.
  try{
    const files = await unzip(buf);
    for (const [pad, bytes] of files){
      if (!/\.stl$/i.test(pad)) continue;
      try{
        const geo = parseStl(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength));
        if (geo && geo.volume) return { geo, waarom: `er zat een STL in (${pad})` };
      }catch(e){}
    }
  }catch(e){}
  return null;
}

async function analyzeFile(file, sleutel){
  const buf = await file.arrayBuffer();
  if (/\.3mf$/i.test(file.name)){
    if (typeof DecompressionStream === "undefined"){
      // Zonder uitpakker kunnen we alleen nog kijken of het stiekem een STL is.
      const nood = await stlUitDe3mf(buf, file.name);
      if (nood) return [Object.assign(nood.geo, { __alsStl: nood.waarom })];
      throw new Error("deze browser kan 3mf-bestanden niet uitpakken — stuur een STL door");
    }
    // Een 3mf uitpakken vraagt de XML-lezer van de pagina; die is er in een
    // aparte draad niet. Dat blijft dus hier.
    try{
      return await parse3mf(buf);
    }catch(err){
      const nood = await stlUitDe3mf(buf, file.name);
      if (!nood) throw err;
      return [Object.assign(nood.geo, {
        __alsStl: nood.waarom,
        __waaromNiet: err.message || String(err),
      })];
    }
  }
  // Een STL lezen we wél naast het scherm: dat is het zware stuk bij een groot
  // bestand, en zo blijft de pagina ondertussen soepel.
  const uit = sleutel ? await leesStlInWorker(sleutel, buf) : { geo: parseStl(buf) };
  if (uit.fout) throw new Error(uit.fout);
  const geo = uit.geo;
  if (!geo || !geo.volume) throw new Error("geen bruikbare vorm gevonden");
  // de draad zocht meteen al uit of het model uit losse stukken bestaat
  if (uit.stukken) geo.__stukken = uit.stukken;
  return [geo];
}

/* =====================================================================
   3D-weergave
   Er zijn twee wegen. De grafische kaart (WebGL) is de gewone: die houdt per
   beeldpunt bij wat er vooraan staat, dus loopt niets meer door elkaar heen en
   kun je nergens door het model heen kijken. Kan een toestel dat niet, dan
   valt hij terug op de tekening op een gewoon canvas: driehoeken van achter
   naar voor. Die tweede weg blijft nodig voor de lagenweergave, en als
   achtervang op oude toestellen.

   Waarom niet three.js? Dat is inderdaad dé opensource-bibliotheek hiervoor en
   ze doet dit prima. Maar ze is groter dan deze hele winkel bij elkaar, ze zou
   van buitenaf ingeladen moeten worden, en we hebben er maar één ding uit
   nodig: een dieptebuffer. Dat is hieronder een pagina of twee — zonder extra
   bestand, zonder wachttijd, en zonder dat de site stukgaat als die ene server
   het even niet doet.
   ===================================================================== */

/* Zachte normalen.
   Een driehoek heeft één richting, dus met vlakke belichting zie je elk vlakje
   apart zitten: precies het blokkige. Punten die op dezelfde plek liggen laten
   we daarom hun richting delen, zodat een ronding er ook rond uitziet. Alleen:
   staan twee vlakken scherp op elkaar — de rand van een doos — dan mag dat
   níet, anders wordt de rand een vage vlek. Vandaar de knikgrens. */
/* De grens staat op 0.78. Bij een kubus staat een hoekpunt van drie vlakken op
   0.577 — die blijft dus scherp, zoals het hoort. Bij een ronding liggen de
   vlakken veel dichter bij elkaar en zitten ze ruim boven de grens, dus die
   wordt wél glad. */
/* Zachte normalen zijn er om een grof model glad te laten lijken. Een model
   van honderdduizenden driehoeken ís al glad — daar valt niets te winnen,
   terwijl het samenvoegen er wel honderden milliseconden op de hoofddraad
   kost. Precies de tijd die we met de werkdraad net hadden vrijgemaakt. De
   grens ligt daarom net boven wat een 3D-voorbeeld ooit groot wordt. */
const ZACHT_TOT = 70000;

function vlakkeNormalen(mesh){
  const n = mesh.length / 9;
  const uit = new Float32Array(n * 9);
  for (let t = 0; t < n; t++){
    const o = t * 9;
    const ux = mesh[o+3]-mesh[o],   uy = mesh[o+4]-mesh[o+1], uz = mesh[o+5]-mesh[o+2];
    const vx = mesh[o+6]-mesh[o],   vy = mesh[o+7]-mesh[o+1], vz = mesh[o+8]-mesh[o+2];
    let nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
    const len = Math.hypot(nx, ny, nz) || 1;
    nx/=len; ny/=len; nz/=len;
    for (let k = 0; k < 3; k++){ uit[o+k*3] = nx; uit[o+k*3+1] = ny; uit[o+k*3+2] = nz; }
  }
  return uit;
}

function zachteNormalen(mesh, knik = 0.78){
  const n = mesh.length / 9;
  // Te fijn om er nog iets aan te hebben: dan per driehoek zijn eigen richting.
  if (n > ZACHT_TOT) return vlakkeNormalen(mesh);
  const vlakN = new Float32Array(n * 3);
  const opTel = new Map();                 // plek → opgetelde richting

  const sleutel = (x, y, z) =>
    Math.round(x * 512) + "," + Math.round(y * 512) + "," + Math.round(z * 512);

  for (let t = 0; t < n; t++){
    const o = t * 9;
    const ux = mesh[o+3]-mesh[o],   uy = mesh[o+4]-mesh[o+1], uz = mesh[o+5]-mesh[o+2];
    const vx = mesh[o+6]-mesh[o],   vy = mesh[o+7]-mesh[o+1], vz = mesh[o+8]-mesh[o+2];
    let nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
    const len = Math.hypot(nx, ny, nz) || 1;
    // niet delen door de lengte bij het optellen: een grote driehoek hoort
    // zwaarder te wegen dan een spikkeltje
    vlakN[t*3] = nx/len; vlakN[t*3+1] = ny/len; vlakN[t*3+2] = nz/len;
    for (let k = 0; k < 3; k++){
      const p = o + k*3;
      const s = sleutel(mesh[p], mesh[p+1], mesh[p+2]);
      const a = opTel.get(s);
      if (a){ a[0] += nx; a[1] += ny; a[2] += nz; }
      else opTel.set(s, [nx, ny, nz]);
    }
  }

  const uit = new Float32Array(n * 9);
  for (let t = 0; t < n; t++){
    const o = t * 9;
    const fx = vlakN[t*3], fy = vlakN[t*3+1], fz = vlakN[t*3+2];
    for (let k = 0; k < 3; k++){
      const p = o + k*3;
      const a = opTel.get(sleutel(mesh[p], mesh[p+1], mesh[p+2]));
      let nx = fx, ny = fy, nz = fz;
      if (a){
        const l = Math.hypot(a[0], a[1], a[2]) || 1;
        const gx = a[0]/l, gy = a[1]/l, gz = a[2]/l;
        // te scherp een knik? dan houdt dit hoekpunt zijn eigen richting
        if (gx*fx + gy*fy + gz*fz > knik){ nx = gx; ny = gy; nz = gz; }
      }
      uit[p] = nx; uit[p+1] = ny; uit[p+2] = nz;
    }
  }
  return uit;
}

/* --------------------------- de grafische kaart --------------------------- */
const GL_VERT = `
precision highp float;
attribute vec3 aPos;
attribute vec3 aNor;
uniform vec3 uMidden;      // waar het model omheen draait
uniform vec2 uDraai;       // cos/sin van de horizontale hoek
uniform vec2 uKantel;      // cos/sin van de verticale hoek
uniform float uZoom;
uniform vec2 uOorsprong;   // middelpunt op het scherm, in beeldpunten
uniform vec2 uDoek;        // breedte en hoogte in beeldpunten
uniform float uDiepte;     // halve diepte, om naar [-1,1] te brengen
varying vec3 vNor;
varying float vDiepte;

// dezelfde projectie als de tekening op canvas, zodat beide wegen er gelijk
// uitzien: z omhoog, y naar achter, recht vooruit gekeken
vec3 draai(vec3 p){
  vec3 d = p - uMidden;
  float rx = d.x * uDraai.x - d.y * uDraai.y;
  float ry = d.x * uDraai.y + d.y * uDraai.x;
  float op = d.z * uKantel.x - ry * uKantel.y;
  float di = ry * uKantel.x + d.z * uKantel.y;
  return vec3(rx, op, di);
}
void main(){
  vec3 v = draai(aPos);
  float sx = uOorsprong.x + v.x * uZoom;
  float sy = uOorsprong.y - v.y * uZoom;
  vDiepte = v.z;
  gl_Position = vec4(sx / uDoek.x * 2.0 - 1.0,
                     1.0 - sy / uDoek.y * 2.0,
                     clamp(v.z / uDiepte, -0.999, 0.999),
                     1.0);
  // de normaal draait mee, maar verschuift niet
  vNor = draai(aPos + aNor) - draai(aPos);
}`;

const GL_FRAG = `
precision highp float;
uniform vec3 uKleur;
uniform float uGlans;
varying vec3 vNor;
varying float vDiepte;
void main(){
  vec3 N = normalize(vNor);
  // Dubbelzijdig belichten. Veel modellen hebben ergens een driehoek die
  // verkeerd om staat; met eenzijdige belichting zie je daar een zwart gat en
  // lijkt het model hol. Zo blijft het overal massief.
  if (!gl_FrontFacing) N = -N;
  // Diepte loopt het scherm ín, dus wie naar je toe kijkt heeft een negatieve
  // z. Het licht staat links-boven vóór het model, net naast de kijker.
  vec3 L = normalize(vec3(0.40, 0.55, -0.72));
  vec3 O = vec3(0.0, 0.0, -1.0);                 // richting naar de kijker
  float diffuus = max(dot(N, L), 0.0);
  // een tweede, zwak licht van de andere kant haalt de schaduwzijde uit het
  // zwart; zonder dat wordt een donkere kleur één zwarte vlek
  float vul = max(dot(N, normalize(vec3(-0.55, -0.30, -0.45))), 0.0) * 0.26;
  vec3 H = normalize(L + O);
  float glans = pow(max(dot(N, H), 0.0), 30.0) * uGlans;
  // randlicht: geeft de vorm een zichtbare omtrek tegen de achtergrond
  float rand = pow(1.0 - abs(dot(N, O)), 3.0) * 0.14;
  vec3 kleur = uKleur * (0.34 + 0.70 * diffuus + vul) + glans + rand;
  gl_FragColor = vec4(min(kleur, vec3(1.0)), 1.0);
}`;

const GL_LIJN_FRAG = `
precision highp float;
uniform vec3 uKleur;
uniform float uGlans;
void main(){ gl_FragColor = vec4(uKleur, uGlans); }`;

/* Eén opzet per canvas: een canvas onthoudt zijn soort context, dus dit kan
   maar één keer. Lukt WebGL niet, dan onthouden we dat ook — dan wordt er niet
   bij elke tekenbeurt opnieuw geprobeerd. */
const glDoeken = new WeakMap();
function glVoor(canvas){
  if (glDoeken.has(canvas)) return glDoeken.get(canvas);
  let uit = null;
  try{
    const gl = canvas.getContext('webgl', { antialias: true, alpha: true, depth: true, preserveDrawingBuffer: true })
            || canvas.getContext('experimental-webgl', { antialias: true, alpha: true, depth: true, preserveDrawingBuffer: true });
    if (gl){
      const maak = (bron, soort) => {
        const s = gl.createShader(soort);
        gl.shaderSource(s, bron); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      };
      const programma = (frag) => {
        const p = gl.createProgram();
        gl.attachShader(p, maak(GL_VERT, gl.VERTEX_SHADER));
        gl.attachShader(p, maak(frag, gl.FRAGMENT_SHADER));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
        return p;
      };
      const vlak = programma(GL_FRAG);
      const lijn = programma(GL_LIJN_FRAG);
      uit = {
        gl, vlak, lijn,
        posBuf: gl.createBuffer(), norBuf: gl.createBuffer(),
        lijnBuf: gl.createBuffer(),
      };
    }
  }catch(e){ uit = null; }
  glDoeken.set(canvas, uit);
  return uit;
}

/* Zet de gedeelde instellingen klaar en levert de projectie die ook de
   tekenweg op canvas gebruikt, zodat beide wegen hetzelfde beeld geven. */
function glOpzet(ctx, programma, kader){
  const { gl } = ctx;
  const { w, h, midden, draai, kantel, zoom, oorsprong, diepte } = kader;
  gl.useProgram(programma);
  const u = (naam) => gl.getUniformLocation(programma, naam);
  gl.uniform3f(u('uMidden'), midden[0], midden[1], midden[2]);
  gl.uniform2f(u('uDraai'), draai[0], draai[1]);
  gl.uniform2f(u('uKantel'), kantel[0], kantel[1]);
  gl.uniform1f(u('uZoom'), zoom);
  gl.uniform2f(u('uOorsprong'), oorsprong[0], oorsprong[1]);
  gl.uniform2f(u('uDoek'), w, h);
  gl.uniform1f(u('uDiepte'), diepte);
  return u;
}

/* Tekent één of meer onderdelen, elk in zijn eigen kleur, met een echte
   dieptebuffer. Geeft false terug als WebGL hier niet kan — dan neemt de
   tekening op canvas het over. */
function glTeken(canvas, delen, kader, plaat){
  const ctx = glVoor(canvas);
  if (!ctx) return false;
  const { gl } = ctx;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = canvas.clientWidth || 320, h = canvas.clientHeight || 320;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  // Bewust géén achterkanten wegknippen: bij een model met een omgekeerde
  // driehoek zou daar een gat vallen waar je doorheen kijkt. De dieptebuffer
  // regelt de volgorde toch al.
  gl.disable(gl.CULL_FACE);

  const k = { ...kader, w, h };

  if (plaat && plaat.length){
    // Het plaatraster is een achtergrond, geen voorwerp. Zonder deze twee
    // regels zouden de lijnen die tussen jou en het model liggen er dwars
    // overheen getekend worden — geometrisch juist, maar het model lijkt er
    // dan van gaas. Dus: geen diepte schrijven, geen diepte toetsen.
    gl.depthMask(false);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    const u = glOpzet(ctx, ctx.lijn, k);
    const pos = gl.getAttribLocation(ctx.lijn, 'aPos');
    const nor = gl.getAttribLocation(ctx.lijn, 'aNor');
    gl.bindBuffer(gl.ARRAY_BUFFER, ctx.lijnBuf);
    gl.bufferData(gl.ARRAY_BUFFER, plaat, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 3, gl.FLOAT, false, 0, 0);
    if (nor >= 0){ gl.disableVertexAttribArray(nor); gl.vertexAttrib3f(nor, 0, 0, 1); }
    gl.uniform3f(u('uKleur'), 1, 1, 1);
    gl.uniform1f(u('uGlans'), 0.16);
    gl.drawArrays(gl.LINES, 0, plaat.length / 3);
    gl.disable(gl.BLEND);
    gl.depthMask(true);
    gl.enable(gl.DEPTH_TEST);
  }

  const u = glOpzet(ctx, ctx.vlak, k);
  const pos = gl.getAttribLocation(ctx.vlak, 'aPos');
  const nor = gl.getAttribLocation(ctx.vlak, 'aNor');
  gl.enableVertexAttribArray(pos);
  gl.enableVertexAttribArray(nor);
  for (const d of delen){
    if (!d.mesh || !d.mesh.length) continue;
    const { r, g, b } = hexToRgb(d.hex || "#B8BCC2");
    gl.bindBuffer(gl.ARRAY_BUFFER, ctx.posBuf);
    gl.bufferData(gl.ARRAY_BUFFER, d.mesh, gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(pos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, ctx.norBuf);
    gl.bufferData(gl.ARRAY_BUFFER, d.normalen, gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(nor, 3, gl.FLOAT, false, 0, 0);
    gl.uniform3f(u('uKleur'), r/255, g/255, b/255);
    gl.uniform1f(u('uGlans'), d.finish === "silk" ? 0.55 : d.finish === "basic" ? 0.22 : 0.05);
    gl.drawArrays(gl.TRIANGLES, 0, d.mesh.length / 3);
  }
  return true;
}

/* De normalen horen bij een model, niet bij een tekenbeurt: ze uitrekenen bij
   elke draaibeweging zou het slepen laten haperen. Daarom hangen we ze aan de
   reeks punten zelf. */
const normalenCache = new WeakMap();
function normalenVan(mesh){
  let n = normalenCache.get(mesh);
  if (!n){ n = zachteNormalen(mesh); normalenCache.set(mesh, n); }
  return n;
}

/* De projectie in getallen, zodat de grafische kaart precies hetzelfde beeld
   maakt als de tekening op canvas. Eén plek waar hoek, schaal en middelpunt
   bepaald worden. */
function kijkKader(canvas, geo, opts){
  const { yaw = 0.6, pitch = 0.5, scale = 1, vul = 0.36, zak = 0.10 } = opts || {};
  const w = canvas.clientWidth || 320, h = canvas.clientHeight || 320;
  const span = Math.max(geo.size[0], geo.size[1], geo.size[2]) * scale || 1;
  const zoom = Math.min(w, h) * vul / span;
  return {
    w, h, zoom,
    midden: [geo.center[0] * scale, geo.center[1] * scale, geo.minZ * scale],
    draai:  [Math.cos(yaw), Math.sin(yaw)],
    kantel: [Math.cos(pitch), Math.sin(pitch)],
    oorsprong: [w / 2, h / 2 + Math.min(w, h) * zak],
    // ruim genomen: het model mag ook bij het draaien nooit tegen de voor- of
    // achterwand aanlopen, anders zou er een stuk uit wegvallen
    diepte: Math.max(1e-3, span * 2.5),
  };
}

/* Het plaatraster als losse lijnstukken, voor de weg via de grafische kaart. */
function plaatLijnen(midden){
  const half = PLATE.x / 2;
  const uit = [];
  const [cx, cy, z] = midden;
  for (let v = -half; v <= half; v += 50){
    uit.push(cx + v, cy - half, z,  cx + v, cy + half, z);
    uit.push(cx - half, cy + v, z,  cx + half, cy + v, z);
  }
  return new Float32Array(uit);
}

/* Zet het canvas klaar en levert de projectie: één plek waar de hoek, de
   schaal en het plaatraster geregeld worden, voor beide weergaven. */
function meshCanvas(canvas, geo, opts){
  // vul: hoeveel van het vak het model mag innemen. Op de plaat houden we
  // ruimte over zodat je ziet hoe groot het ding werkelijk is; bij een
  // productfoto mag het model het beeld gewoon vullen.
  const { yaw = 0.6, pitch = 0.5, plate = true, scale = 1, vul = 0.36, zak = 0.10 } = opts || {};
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = canvas.clientWidth || 320, h = canvas.clientHeight || 320;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const g = canvas.getContext('2d');
  if (!g) return null;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const cx = geo.center[0] * scale, cyy = geo.center[1] * scale;
  const minZ = geo.minZ * scale;
  const span = Math.max(geo.size[0], geo.size[1], geo.size[2]) * scale || 1;
  const zoom = Math.min(w, h) * vul / span;
  const ox = w / 2, oy = h / 2 + Math.min(w, h) * zak;

  // z omhoog, y naar achter — zoals een print op een plaat staat
  function project(x, y, z){
    const dx = x - cx, dy = y - cyy, dz = z - minZ;
    const rx = dx * cy - dy * sy;
    const ry = dx * sy + dy * cy;
    return [ox + rx * zoom, oy - (dz * cp - ry * sp) * zoom, ry * cp + dz * sp];
  }

  if (plate){
    // plaatraster van 5 cm, zodat de schaal afleesbaar blijft
    const half = PLATE.x / 2;
    g.lineWidth = 1;
    for (let v = -half; v <= half; v += 50){
      const a = project(cx + v, cyy - half, minZ), b = project(cx + v, cyy + half, minZ);
      const c = project(cx - half, cyy + v, minZ), d = project(cx + half, cyy + v, minZ);
      g.strokeStyle = (v === -half || v === half) ? "rgba(255,255,255,.22)" : "rgba(255,255,255,.08)";
      g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
      g.beginPath(); g.moveTo(c[0], c[1]); g.lineTo(d[0], d[1]); g.stroke();
    }
  }
  return { g, w, h, project, cy, sy };
}

function drawMesh(canvas, geo, opts){
  const { hex = "#B8BCC2", finish = "basic", ruw = false, plate = true } = opts || {};

  // Een steekproef van driehoeken laat gaten vallen — dan lijkt het model een
  // kluwen draden in plaats van een massief voorwerp. Daarom tekenen we het
  // hele model, en pakken we alleen tijdens het slepen de lichte versie.
  const m = (ruw || !geo.full) ? geo.mesh : geo.full;
  if (!m || !m.length) return;

  // Eerst de grafische kaart proberen: die houdt zelf bij wat vooraan staat.
  const kader = kijkKader(canvas, geo, opts);
  if (glTeken(canvas,
        [{ mesh: m, normalen: normalenVan(m), hex, finish }],
        kader,
        plate ? plaatLijnen(kader.midden) : null)) return;

  const c = meshCanvas(canvas, geo, opts);
  if (!c) return;
  const { g, project, cy, sy } = c;

  const n = m.length / 9;
  const order = new Array(n);
  const pts = new Float32Array(n * 6);
  const shade = new Float32Array(n);
  const depths = new Float32Array(n);
  const light = [0.42, -0.55, 0.72];

  for (let i = 0; i < n; i++){
    const o = i * 9;
    const A = project(m[o],   m[o+1], m[o+2]);
    const B = project(m[o+3], m[o+4], m[o+5]);
    const C = project(m[o+6], m[o+7], m[o+8]);
    const p = i * 6;
    pts[p]=A[0]; pts[p+1]=A[1]; pts[p+2]=B[0]; pts[p+3]=B[1]; pts[p+4]=C[0]; pts[p+5]=C[1];
    order[i] = i;
    // normaal in modelruimte volstaat voor vlakke belichting
    const ux = m[o+3]-m[o], uy = m[o+4]-m[o+1], uz = m[o+5]-m[o+2];
    const vx = m[o+6]-m[o], vy = m[o+7]-m[o+1], vz = m[o+8]-m[o+2];
    let nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
    const len = Math.hypot(nx, ny, nz) || 1;
    nx/=len; ny/=len; nz/=len;
    // de lichtrichting draait mee met het model
    const lx = light[0]*cy - light[1]*sy, ly = light[0]*sy + light[1]*cy;
    shade[i] = 0.30 + 0.70 * Math.abs(nx*lx + ny*ly + nz*light[2]);
    // diepte van het zwaartepunt bepaalt de tekenvolgorde: achter eerst
    depths[i] = (A[2] + B[2] + C[2]) / 3;
  }
  order.sort((a,b) => depths[a] - depths[b]);

  const { r, g: gg, b } = hexToRgb(hex);
  const gloss = finish === "silk" ? 0.34 : finish === "basic" ? 0.14 : 0;
  // Vlakken worden met een dunne rand van hun eigen kleur gevuld, zodat er
  // geen haarlijntjes achtergrond tussen de driehoeken door schijnen. Dat is
  // wat een model hol laat lijken.
  g.lineJoin = "round";
  for (const i of order){
    const p = i * 6;
    // achterkanten overslaan: die horen bij de binnenzijde van het model
    const ax = pts[p], ay = pts[p+1], bx = pts[p+2], by = pts[p+3], cx2 = pts[p+4], cy2 = pts[p+5];
    if ((bx - ax) * (cy2 - ay) - (cx2 - ax) * (by - ay) > 0) continue;
    let f = shade[i];
    if (gloss) f = Math.min(1.30, f + Math.pow(f, 6) * gloss * 2.2);
    const col = `rgb(${Math.round(Math.min(255,r*f))},${Math.round(Math.min(255,gg*f))},${Math.round(Math.min(255,b*f))})`;
    g.fillStyle = col;
    g.strokeStyle = col;
    g.lineWidth = 0.7;
    g.beginPath();
    g.moveTo(ax, ay);
    g.lineTo(bx, by);
    g.lineTo(cx2, cy2);
    g.closePath();
    g.fill();
    g.stroke();
  }
}

/* Tekent een model dat uit meerdere onderdelen bestaat, elk in zijn eigen
   kleur. Alle driehoeken gaan door één diepteordening, anders zou een arm
   voor een lichaam belanden dat er eigenlijk vóór staat. */
function drawModel(canvas, meshes, kleuren, opts){
  const o = opts || {};
  const geo = { center: o.center, size: o.size, minZ: o.minZ };
  const instel = { ...o, plate: false, vul: 0.58, zak: 0 };

  // De gewone weg: de grafische kaart. Elk onderdeel wordt apart getekend maar
  // ze delen één dieptebuffer, dus een arm die achter een lichaam zit blijft
  // daar ook staan — en dat blijft kloppen terwijl je draait.
  if (glTeken(canvas, meshes.map((m, deel) => {
        const kl = kleuren[deel] || kleuren[kleuren.length - 1] || { hex: "#B8BCC2", finish: "basic" };
        return { mesh: m, normalen: normalenVan(m), hex: kl.hex || "#B8BCC2", finish: kl.finish };
      }), kijkKader(canvas, geo, instel), null)) return;

  const c = meshCanvas(canvas, geo, instel);
  if (!c) return;
  const { g, project, cy, sy } = c;
  const light = [0.42, -0.55, 0.72];

  const tris = [];
  meshes.forEach((m, deel) => {
    const kl = kleuren[deel] || kleuren[kleuren.length - 1] || { hex: "#B8BCC2", finish: "basic" };
    const { r, g: gg, b } = hexToRgb(kl.hex || "#B8BCC2");
    const gloss = kl.finish === "silk" ? 0.34 : kl.finish === "basic" ? 0.14 : 0;
    for (let i = 0; i < m.length; i += 9){
      const A = project(m[i], m[i+1], m[i+2]);
      const B = project(m[i+3], m[i+4], m[i+5]);
      const C = project(m[i+6], m[i+7], m[i+8]);
      if ((B[0]-A[0]) * (C[1]-A[1]) - (C[0]-A[0]) * (B[1]-A[1]) > 0) continue;   // achterkant
      const ux=m[i+3]-m[i], uy=m[i+4]-m[i+1], uz=m[i+5]-m[i+2];
      const vx=m[i+6]-m[i], vy=m[i+7]-m[i+1], vz=m[i+8]-m[i+2];
      let nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx/=len; ny/=len; nz/=len;
      const lx = light[0]*cy - light[1]*sy, ly = light[0]*sy + light[1]*cy;
      let f = 0.30 + 0.70 * Math.abs(nx*lx + ny*ly + nz*light[2]);
      if (gloss) f = Math.min(1.30, f + Math.pow(f, 6) * gloss * 2.2);
      tris.push([ (A[2]+B[2]+C[2])/3, A, B, C,
        `rgb(${Math.round(Math.min(255,r*f))},${Math.round(Math.min(255,gg*f))},${Math.round(Math.min(255,b*f))})` ]);
    }
  });
  tris.sort((a,b) => a[0] - b[0]);
  g.lineJoin = "round";
  g.lineWidth = 0.7;
  for (const [, A, B, C, col] of tris){
    g.fillStyle = col; g.strokeStyle = col;
    g.beginPath(); g.moveTo(A[0],A[1]); g.lineTo(B[0],B[1]); g.lineTo(C[0],C[1]); g.closePath();
    g.fill(); g.stroke();
  }
}

/* --------------------------- kleurhulpjes --------------------------- */
function hexToRgb(hex){
  const h = String(hex || "").replace("#","").trim();
  const full = h.length === 3 ? h.split("").map(c=>c+c).join("") : h;
  const n = parseInt(full.slice(0,6), 16);
  return Number.isNaN(n) ? { r:128, g:128, b:128 } : { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgbToHex({r,g,b}){
  return "#" + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
}
/* pct > 0 maakt lichter, pct < 0 donkerder */
function shade(hex, pct){
  const { r,g,b } = hexToRgb(hex);
  const t = pct < 0 ? 0 : 255, p = Math.abs(pct);
  return rgbToHex({ r: r+(t-r)*p, g: g+(t-g)*p, b: b+(t-b)*p });
}
/* Bepaalt of tekst op deze kleur zwart of wit moet zijn. */
function readableOn(hex){
  const { r,g,b } = hexToRgb(hex);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? "#15171b" : "#F2F1ED";
}


let unsubOrders = null;
function listenOrders(){
  if (unsubOrders) unsubOrders();
  if (!state.user) return;
  const base = collection(db, "orders");
  // Bewust géén orderBy naast de where op uid: die combinatie vereist een
  // samengestelde index in Firestore, en zonder die index faalt de query —
  // waardoor een klant zijn eigen bestellingen niet te zien kreeg terwijl de
  // beheerder (alleen orderBy) ze wel zag. Sorteren doen we hieronder zelf.
  const q = state.profile?.isAdmin

   account — een klant mag de bestelling van iemand anders namelijk niet eens
   inlezen. We wachten wel even: vlak na het inloggen is de lijst nog onderweg. */
let onbekendeLinkTimer = null;

  onbekendeLinkTimer = setTimeout(() => {
    onbekendeLinkTimer = null;

/* Kwam iemand binnen via een link uit een bericht, dan zetten we hem op de
   juiste bestelling en brengen die in beeld.

   Een link uit een bericht hoort bij één account. Klik je op de link uit het
   bericht van iemand anders, dan mag die bestelling nooit tussen jouw eigen
   bestellingen komen te staan. Voor een gewone klant is dat al dicht: hij kan
   de bestelling niet eens inlezen. Als beheerder zie je wél alles — dan sturen
   we je naar Shopbeheer, waar zulke bestellingen thuishoren. */
function volgLink(){
  if (!state.linkOrder) return;
  const o = state.orders.find(x => x.id === state.linkOrder);
  if (!o) return;                                  // bestelling nog niet binnen
  const vanMij = o.uid === state.user?.uid;
  if (!vanMij && !state.profile?.isAdmin){
    state.linkOrder = null; state.linkActie = null;
    notify(t("link.nietVanJou"));
    return;
  }
  state.__openOrder = o.id;
  state.__openBestelling = o.id;      // in het beheer klapt hij meteen open
  state.view = vanMij ? "account" : "admin";
  if (!vanMij) state.__adminTab = "orders";
  const actie = state.linkActie;
  state.linkOrder = null; state.linkActie = null;
  render();
  // even wachten tot het scherm getekend is
  setTimeout(() => {
    const kaart = document.querySelector(`[data-order="${o.id}"]`);
    if (kaart){
      kaart.scrollIntoView({ behavior: "smooth", block: "center" });
      kaart.classList.add("aangewezen");
      setTimeout(() => kaart.classList.remove("aangewezen"), 2600);
    }
    if (!vanMij){
      notify("Dit is de bestelling van " + (o.userEmail || "een klant") + " — geopend in Shopbeheer");
    } else if (actie === "ontvangen" && o.status === "Geleverd" && !o.receivedAt){
      notify(t("link.klikOntvangen"));
    }
  }, 120);
}

/* =====================================================================
   Kortingscodes
   Een code staat als eigen document in de database, met de code zelf als
   naam. Zo kan iemand alleen een code opvragen die hij al kent — de hele
   lijst opvragen mag alleen jij. Wat je instelt: een percentage of een vast
   bedrag, tot wanneer hij geldig is, hoe vaak hij gebruikt mag worden, en
   vanaf welk bedrag hij telt.
   ===================================================================== */
function codeNet(s){ return (s || "").trim().toUpperCase().replace(/\s+/g, ""); }

/* Kijkt een code na tegen wat er nu in de winkelwagen zit. */
function keurCode(code, data, subtotaal){
  if (!data) return { ok: false, waarom: t("code.bestaatNiet") };
  if (data.active === false) return { ok: false, waarom: t("code.staatUit") };
  if (data.until && Date.now() > data.until) return { ok: false, waarom: t("code.verlopen") };
  if (data.maxUses && (data.used || 0) >= data.maxUses) return { ok: false, waarom: t("code.opgebruikt") };
  if (data.minTotal && subtotaal < data.minTotal){
    return { ok: false, waarom: t("code.vanaf", { bedrag: fmtEUR(data.minTotal) }) };
  }
  const bedrag = data.pct
    ? Math.round(subtotaal * data.pct) / 100
    : Math.min(subtotaal, data.euro || 0);
  if (bedrag <= 0) return { ok: false, waarom: t("code.nietsOp") };
  return {
    ok: true, code, bedrag: Math.round(bedrag * 100) / 100,
    uitleg: data.pct ? t("code.pct", { pct: data.pct }) : t("code.euro", { bedrag: fmtEUR(data.euro) }),
  };
}
async function zoekCode(code, subtotaal){
  const c = codeNet(code);
  if (!c) return { ok: false, waarom: t("code.vulIn") };
  try{
    const snap = await getDoc(doc(db, "codes", c));
    return keurCode(c, snap.exists() ? snap.data() : null, subtotaal);
  }catch(e){ return { ok: false, waarom: t("code.nietNakijken") }; }
}
/* =====================================================================
   Wat het meest verkocht wordt
   Een klant ziet alleen zijn eigen bestellingen, dus hij kan niet zelf tellen
   wat populair is. Daarom houdt elk product zijn eigen teller bij, die bij een
   bestelling wordt opgehoogd. Lukt dat niet, dan is de bestelling belangrijker
   dan het cijfertje — dan slaan we het stil over.
   ===================================================================== */
async function telVerkocht(items){
  const per = new Map();
  for (const i of items || []){
    const id = i.productId || i.id;
    if (!id || i.kind === "custom") continue;
    per.set(id, (per.get(id) || 0) + (i.qty || 1));
  }
  for (const [id, n] of per){
    try{ await updateDoc(doc(db, "products", id), { verkocht: increment(n) }); }
    catch(e){ console.warn("verkoopteller niet bijgewerkt:", e); }
  }
}

/* Eén gebruik bijtellen. Lukt dat niet, dan is de bestelling belangrijker. */
async function telCodeGebruik(code){
  try{
    // increment telt op in de database zelf. Eerst lezen en dan schrijven zou
    // bij twee bestellingen tegelijk één gebruik laten verdwijnen.
    await updateDoc(doc(db, "codes", code), { used: increment(1) });
  }catch(e){
    // Dit stil laten mislukken was fout: dan bleef het aantal op nul staan en
    // kon een code die maar één keer mocht eindeloos opnieuw gebruikt worden.
    console.warn("gebruik van code niet bijgeteld:", e);
    notify(t("code.nietGeteld", { code }) + " " + firestoreHint(e));
  }
}

/* Alle momenten die nog te kiezen zijn, van vroeg naar laat. */
function afhaalMomenten(nu = Date.now()){
  const a = afhalen();
  if (!a.enabled || !Array.isArray(a.days) || !a.days.length) return [];
  const vroegst = nu + (a.leadHours || 0) * 3600e3;
  const uit = [];
  const stap = Math.max(10, a.slotMinutes || 30);
  for (let d = 0; d < (a.weeks || 2) * 7 && uit.length < 120; d++){
    const dag = new Date(nu);
    dag.setDate(dag.getDate() + d);
    dag.setHours(0, 0, 0, 0);
    // zondag telt in de instelling als 7, zoals mensen het zeggen
    const nr = dag.getDay() === 0 ? 7 : dag.getDay();
    for (const open of a.days.filter(x => +x.day === nr)){
      const [vu, vm] = String(open.from || "17:00").split(":").map(Number);
      const [tu, tm] = String(open.to || "20:00").split(":").map(Number);
      for (let min = vu*60 + (vm||0); min + stap <= tu*60 + (tm||0); min += stap){
        const t = new Date(dag); t.setMinutes(min);
        if (t.getTime() >= vroegst) uit.push(t.getTime());
      }
    }
  }
  return uit.sort((x,y) => x - y);
}
const fmtMoment = (x) => new Date(x).toLocaleString(loc(),
  { weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' });

async function placeOrder(shippingCountry, address, payment){
  if (!state.user){ notify(t("ck.logIn")); go("login"); return; }
  const ophalen = state.__checkout?.pickupAt || null;
  // De code is nagekeken toen hij ingevuld werd, maar tussen dat moment en het
  // afrekenen kan hij opgebruikt of verlopen zijn. Daarom kijken we hem hier
  // nog eens na in plaats van hem op ons woord te geloven.
  let korting = state.__korting || null;
  if (korting){
    const opnieuw = await zoekCode(korting.code, cartTotal());
    if (!opnieuw.ok){
      state.__korting = null;
      notify(t("ck.codeVervallen", { code: korting.code, waarom: opnieuw.waarom }));
      go("checkout");
      return;
    }
    korting = opnieuw;
  }
  const teBetalen = Math.max(0, cartTotal() - (korting?.bedrag || 0));
  const rate = { price: verzendKosten(shippingCountry, teBetalen, !!ophalen) };
  const order = {
    uid: state.user.uid,
    userEmail: state.user.email,
    // in welke taal deze klant besteld heeft, zodat zijn latere berichten in
    // diezelfde taal aankomen — ook als jij ze vanuit jouw scherm verstuurt
    taal: taal(),
    // en welke berichten hij wil. Dat staat in zijn profiel, maar de verzend-
    // en ontvangstmail vertrekken vanuit jouw scherm en daar kun je zijn
    // profiel niet zomaar bij pakken — dus reist de wens mee met de bestelling.
    mailWens: { ...(state.profile?.mail || {}) },
    items: state.cart.map(({id,productId,kind,name,price,qty,filament,dims,printTime,grams,jobParts,assembled,uploadId,sliced,colorChoices,listPrice,discountPct,eigenTekst})=>({
      id, productId: productId || id, kind, name, price, qty,
      eigenTekst: eigenTekst || null,
      filament: filament || null, dims: dims || null,
      colorChoices: colorChoices || null,
      listPrice: listPrice ?? null, discountPct: discountPct || 0,
      printTime: printTime || null, grams: grams || null,
      jobParts: jobParts || null, assembled: assembled || false,
      uploadId: uploadId || null,
      sliced: sliced === undefined ? null : !!sliced,
    })),
    shippingCountry: ophalen ? "Afhalen" : shippingCountry,
    shippingAddress: address,
    shippingCost: rate.price,
    pickupAt: ophalen,
    pickupAddress: ophalen ? (afhalen().address || "") : null,
    discountCode: korting?.code || null,
    discountAmount: korting?.bedrag || 0,
    subtotal: cartTotal(),
    total: Math.max(0, cartTotal() - (korting?.bedrag || 0)) + rate.price,
    status: "In verwerking",
    paymentMethod: payment?.method || "Demo",
    paymentRef: payment?.ref || "",
    demoPayment: true,
    createdAt: Date.now(),
  };
  try{
    const ref = await addDoc(collection(db,"orders"), order);
    // het adres onthouden, zodat het de volgende keer al ingevuld staat
    if (!ophalen) onthoudAdres(address, shippingCountry);
    state.cart = []; saveCart();
    state.__checkout = null;
    state.__ckVeld = null; state.__ckLand = null; state.__adresCheck = null;
    state.__korting = null; state.__afhaal = null;
    if (korting) telCodeGebruik(korting.code);
    telVerkocht(order.items);
    const geplaatst = { id: ref.id, ...order };
    // Een toastje na het betalen is te weinig: dat is net het moment waarop
    // iemand wil lezen dat het gelukt is en wat er nu gaat gebeuren.
    state.__bedanktKopie = geplaatst;
    go("bedankt", { __bedankt: ref.id });
    mailBestelling(geplaatst);          // mag rustig achteraf komen
    mailNieuweBestelling(geplaatst);    // en een seintje naar de shop zelf
  }catch(e){ notify(t("ck.bestellenMislukt") + " " + e.message); }
}

/* =====================================================================
   E-mail
   Een website op GitHub Pages kan zelf geen post versturen — daar hoort een
   server bij. We gebruiken daarom EmailJS: dat is gemaakt om vanuit de
   browser te versturen, met een sleutel die openbaar mag zijn. Vul je niets
   in, dan slaat de shop het versturen gewoon over en werkt de rest normaal.
   Instellen kan bij Beheer → Prijzen → E-mail.
   ===================================================================== */
const MAIL_DOC = () => doc(db, "settings", "mail");
const DEFAULT_MAIL = {
  serviceId: "", publicKey: "",
  tplOrder: "", tplShipped: "", tplDelivered: "",
  fromName: "Extrudo", replyTo: "",
  // Elk bericht kost één van je maandelijkse tegoed. Zet uit wat je niet nodig
  // hebt, dan haal je meer bestellingen uit hetzelfde pakket.
  onOrder: true, onShipped: true, onDelivered: true,
  // een seintje naar jezelf zodra er iets binnenkomt
  tplAdmin: "", adminEmail: "", onNewOrder: true,
};
function mailSettings(){ return { ...DEFAULT_MAIL, ...(state.mail || {}) }; }
const MAIL_SWITCH = { tplOrder: "onOrder", tplShipped: "onShipped", tplDelivered: "onDelivered", tplAdmin: "onNewOrder" };
function mailReady(k){
  const m = mailSettings();
  if (MAIL_SWITCH[k] && m[MAIL_SWITCH[k]] === false) return false;
  return !!(m.serviceId && m.publicKey && m[k]);
}
function listenMail(){
  if (state.__mailListening) return;
  state.__mailListening = true;
  onSnapshot(MAIL_DOC(), (snap) => {
    state.mail = snap.exists() ? snap.data() : null;

/* Stuurt één bericht. Faalt dit, dan mag de bestelling er niet onder lijden —
   we melden het en gaan verder. */
async function sendMail(tplKey, params){
  const m = mailSettings();
  if (!mailReady(tplKey)) return { ok: false, reason: "niet ingesteld" };
  try{
    const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        service_id: m.serviceId,
        template_id: m[tplKey],
        user_id: m.publicKey,
        template_params: { from_name: m.fromName, reply_to: m.replyTo || undefined, ...params },
      }),
    });
    if (!res.ok) return { ok: false, reason: (await res.text()).slice(0, 140) };
    return { ok: true };
  }catch(err){
    return { ok: false, reason: err.message };
  }
}


/* De bestelling als leesbare regels, want een e-mail heeft geen opmaak nodig
   om duidelijk te zijn. */
const mailDatum = (o, d) => d.toLocaleDateString(mloc(o), { day:'numeric', month:'long' });
/* Bedragen in de taal van de bestelling: €8,55 of €8.55, naargelang wie het leest. */
const mailEUR = (o, n) => new Intl.NumberFormat(mloc(o), { style:"currency", currency:"EUR" }).format(n);
function mailOrderLines(o){
  return (o.items || []).map(i => {
    const kleuren = Array.isArray(i.colorChoices) && i.colorChoices.length
      ? "  (" + i.colorChoices.map(c => `${c.slot}: ${c.name}`).join(", ") + ")"
      : i.filament ? `  (${i.filament.type} ${i.filament.name})` : "";
    return `${i.qty} × ${i.name}${kleuren} — ${mailEUR(o, i.price * i.qty)}`;
  }).join("\n");
}
function mailOrderParams(o){
  const a = o.shippingAddress || {};
  return {
    to_email: o.userEmail,
    to_name: (o.userEmail || "").split("@")[0],
    order_number: orderNumber(o),

    order_status: TEKST["status." + (o.status || "")] ? mt(o, "status." + o.status) : (o.status || ""),
    address: [a.street, `${a.zip || ""} ${a.city || ""}`.trim(), o.shippingCountry].filter(Boolean).join("\n"),
    site_url: SITE_URL,
    account_url: SITE_URL,
  };

/* Elk bericht krijgt zijn eigen kop, inleiding en knop mee. Zo kun je met één
   sjabloon toe voor alle drie de momenten — het gratis pakket van EmailJS geeft
   er maar een paar. Wie wil, vult gewoon drie verschillende sjablonen in. */
/* Een seintje naar de shop zelf: er is een bestelling binnen. Gaat naar het
   adres dat je opgeeft, of anders naar je antwoordadres. */
async function mailNieuweBestelling(o){
  const m = mailSettings();
  const naar = (m.adminEmail || m.replyTo || "").trim();
  if (!naar) return;
  const r = await sendMail("tplAdmin", {
    ...mailOrderParams(o),
    to_email: naar,

/* =====================================================================

   Het 3D-voorbeeld op de productpagina is uitgedund: mooi om naar te kijken,
   niet om te printen. Hier zet je het échte bestand bij — de STL of de 3mf
   zoals hij uit je ontwerpprogramma komt. Komt er een bestelling binnen, dan
   staat hij bij die bestelling klaar om te downloaden en gaat hij zo je slicer
   in.

   het model van een klant onder zijn opdracht. Alleen jij kunt erbij: dit is
   wat je verkoopt, dus het mag niet zomaar te downloaden zijn.

const MAX_PRINTBESTANDEN = 6;

/* Schrijft de gekozen bestanden weg en geeft terug wat er bij het product moet
   komen te staan. Meldt onderweg hoe ver het staat. */
async function bewaarPrintBestanden(productId, files, melden){
  const uit = [];
  for (let i = 0; i < files.length; i++){
    const f = files[i];
    if (melden) melden(`${ic("spinner")} Bestand ${i + 1} van ${files.length}…`);
    const desc = await storeFileInFirestore(productId, i, f, null, "products");
    uit.push({ name: f.name, size: f.size, ...desc });
  }
  return uit;
}

/* Alle stukken van de vorige bestanden weghalen. Blijven er brokstukken staan,
   dan zou een later, korter bestand de staart van het oude erachter krijgen. */
async function wisPrintBestanden(productId, oude){
  for (let i = 0; i < oude.length; i++){
    for (let c = 0; c < (oude[i].chunks || 0); c++){
      try{ await deleteDoc(doc(db, "products", productId, "files", `${i}_${c}`)); }catch(e){}

/* Verkleint een gekozen afbeelding in de browser en geeft een data-URL terug.
   Zo staan productfoto's in het Firestore-document zelf en is Storage niet nodig. */
const IMG_MAX_PX = 1000;
const IMG_MAX_BYTES = 240 * 1024;
function fileToCompressedDataUrl(file){
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type)) return reject(new Error("Dat is geen afbeelding"));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Kan het bestand niet lezen"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Kan de afbeelding niet openen"));
      img.onload = () => {
        const scale = Math.min(1, IMG_MAX_PX / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        const ctx = c.getContext('2d');
        ctx.fillStyle = "#22262c";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        let q = 0.82, url = c.toDataURL('image/jpeg', q);
        while (url.length > IMG_MAX_BYTES && q > 0.35){
          q -= 0.12;
          url = c.toDataURL('image/jpeg', q);
        }
        if (url.length > IMG_MAX_BYTES) return reject(new Error("Afbeelding blijft te groot — kies een kleinere"));
        resolve(url);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function isSafeImageSrc(s){ return /^https:\/\//i.test(s) || /^data:image\//i.test(s); }
function productImages(p){ return (Array.isArray(p?.images) ? p.images : []).filter(isSafeImageSrc); }
function productThumb(p, fontSize){
  const imgs = productImages(p);
  return imgs.length
    ? `<img src="${esc(imgs[0])}" alt="${esc(p.name||'')}" loading="lazy" />`

}

/* Het thema kent drie standen: licht, donker, of meelopen met je toestel. Die
   derde is de aangenamere: je telefoon gaat 's avonds vanzelf donker en de shop
   gaat mee. We bewaren hem als "auto" en rekenen bij het tekenen uit wat dat op
   dit moment betekent. */
const THEMAS = ["licht", "donker", "auto"];
function toestelDonker(){
  return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
}
function themaKeuze(){
  try{
    const v = localStorage.getItem('lc_theme');
    if (v === 'light') return 'licht';
    if (v === 'dark') return 'donker';
  }catch(e){}
  return 'auto';
}
function zetThema(keuze){
  const root = document.documentElement;
  const donker = keuze === 'donker' || (keuze === 'auto' && toestelDonker());
  root.setAttribute('data-theme', donker ? 'dark' : 'light');
  try{
    if (keuze === 'auto') localStorage.removeItem('lc_theme');
    else localStorage.setItem('lc_theme', donker ? 'dark' : 'light');
  }catch(e){}
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', donker ? '#0F1012' : '#F5F4F0');
  render();                       // ook de 3D-weergaven opnieuw tekenen
}
function toggleTheme(){
  zetThema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'licht' : 'donker');

function wisselAnimatie(app){

/* Waar stond je cursor?
   Een hertekening vervangt de hele inhoud van #app. Stond je op dat moment in
   een zoekvak te typen, dan is dat vakje weg en typ je de rest in het niets —
   na één letter ben je je cursor kwijt. We onthouden daarom vlak vóór het
   vervangen welk veld de aandacht had en waar de cursor stond, en zetten dat
   erna terug. Blur helpt niet: die vuurt tijdens het vervangen, dus vóórdat we
   zouden kunnen kijken. */
function onthoudFocus(){
  const el = document.activeElement;
  if (!el || !el.id || !document.getElementById('app')?.contains(el)) return null;
  let start = null, eind = null;
  try{ start = el.selectionStart; eind = el.selectionEnd; }catch(e){}
  return { id: el.id, start, eind };
}
function herstelFocus(bewaard){
  if (!bewaard) return;
  const el = document.getElementById(bewaard.id);
  if (!el || el === document.activeElement) return;
  el.focus();
  if (bewaard.start !== null){
    try{ el.setSelectionRange(bewaard.start, bewaard.eind); }catch(e){}
  }
}

function render(){
  renderCartBadge();
  renderVoet();
  const app = document.getElementById('app');
  const focus = onthoudFocus();
  try{ renderInhoud(app); } finally { herstelFocus(focus); }
}

/* Zoeken en filteren in de collectie.
   Met vier producten heb je dit niet nodig, met dertig wel. We zoeken in wat
   iemand redelijkerwijs zou intypen: de naam, de omschrijving, de categorie en
   het materiaal. De categorieën komen uit de producten zelf, dus je hoeft
   nergens een lijstje bij te houden. */
function categorieen(){
  return [...new Set(zichtbareProducten().map(p => (p.category || "").trim()).filter(Boolean))].sort();
}
/* Sorteren. "Populair" komt uit de teller die bij elke bestelling omhoog gaat;
   staat alles nog op nul, dan komt het nieuwste bovenaan. */
const SORTEER = [["eigen"], ["populair"], ["nieuw"], ["laag"], ["hoog"]];
function sorteerProducten(lijst){
  const hoe = SORTEER.some(([k]) => k === state.__sort) ? state.__sort : "eigen";
  const prijs = p => sizingOf(p) ? basePriceOf(p) : productPrice(p);
  const kopie = [...lijst];
  // De volgorde die de shop zelf sleepte in Shopbeheer. Dat is de standaard:
  // wie zijn collectie op een rij zet, wil dat een bezoeker die rij ziet.
  if (hoe === "eigen") return eigenVolgorde(kopie);
  if (hoe === "nieuw") kopie.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  else if (hoe === "laag") kopie.sort((a, b) => prijs(a) - prijs(b));
  else if (hoe === "hoog") kopie.sort((a, b) => prijs(b) - prijs(a));
  // Puur op wat er verkocht is. Uitgelichte producten krijgen hun eigen
  // vlaggetje op de kaart; ze hier vooraan zetten zou "populair" iets anders
  // laten betekenen dan wat er staat.
  else kopie.sort((a, b) =>
    (Number(b.verkocht) || 0) - (Number(a.verkocht) || 0)
    || (b.createdAt || 0) - (a.createdAt || 0));
  return kopie;
}
function gefilterdeProducten(){
  const zoek = (state.__zoek || "").trim().toLowerCase();
  const cat = state.__cat || "alles";
  return sorteerProducten(zichtbareProducten()
    .filter(p => cat === "alles" ? true : (p.category || "").trim() === cat)
    .filter(p => {
      if (!zoek) return true;
      const hooi = [p.name, p.description, p.category, p.material, p.color]
        .filter(Boolean).join(" ").toLowerCase();
      // elk los woord moet ergens voorkomen: "vaas petg" vindt de petg-vaas
      return zoek.split(/\s+/).every(w => hooi.includes(w));
    }));
}

        ${discountOf(p) ? `<span class="flag" style="left:auto;right:10px;background:var(--accent);color:#fff;">&minus;${discountOf(p).pct}%</span>` : ``}
        <span class="hart ${bew ? "aan" : ""}" data-bewaar="${esc(p.id)}" role="button" tabindex="0"
              title="${esc(t(bew ? "bewaar.weghalen" : "bewaar.leggen"))}"

/* De collectie in stukken per categorie.
   Eén lange rij werkt tot een stuk of tien; daarna is het een muur en scrol je
   erlangs zonder te zien wat er staat. Koppen geven houvast. Alleen als het
   iets oplevert: bij weinig producten, tijdens het zoeken of als je zelf al op
   één categorie filtert blijft het één rij — dan zou een kop alleen ruis zijn. */
const BLOKKEN_VANAF = 7;
function collectieBlokken(lijst, filtert){
  const grid = (items) => `<div class="grid">${items.map(productKaart).join("")}</div>`;
  const cats = [...new Set(lijst.map(p => (p.category || "").trim()))].filter(Boolean);
  if (filtert || lijst.length < BLOKKEN_VANAF || cats.length < 2) return grid(lijst);
  const zonder = lijst.filter(p => !(p.category || "").trim());
  return cats.map(c => `
      <h3 class="collectie-kop">${esc(c)}
        <span class="muted font-mono">${lijst.filter(p => (p.category || "").trim() === c).length}</span>
      </h3>
      ${grid(lijst.filter(p => (p.category || "").trim() === c))}`).join("")
    + (zonder.length ? `<h3 class="collectie-kop">${t("shop.overig")}</h3>${grid(zonder)}` : ``);
}

/* =====================================================================
   Wat je eerder bekeek
   Je klikt op iets, gaat terug, klikt op iets anders — en dan weet je niet meer
   welk van de twee het ook alweer was. Dit rijtje staat onderaan de collectie
   en brengt je er in één klik terug. Het staat alleen in je eigen browser.
   ===================================================================== */
const BEKEKEN_SLEUTEL = "lc_bekeken";
const BEKEKEN_MAX = 8;
function bekeken(){
  try{
    const v = JSON.parse(localStorage.getItem(BEKEKEN_SLEUTEL) || "[]");
    return Array.isArray(v) ? v : [];
  }catch(e){ return []; }
}
function onthoudBekeken(id){
  if (!id) return;
  const uit = [id, ...bekeken().filter(x => x !== id)].slice(0, BEKEKEN_MAX);
  try{ localStorage.setItem(BEKEKEN_SLEUTEL, JSON.stringify(uit)); }catch(e){}
}
function eerderBekeken(){
  // Wat je bewaard hebt staat al bij Instellingen; dit gaat over wat je net zag.
  const lijst = bekeken().map(id => (state.products || []).find(p => p.id === id))
    .filter(p => p && !verborgen(p));
  if (lijst.length < 2) return ``;
  return `
    <h3 class="collectie-kop" style="margin-top:34px;">${t("shop.eerderBekeken")}</h3>
    <div class="grid grid-klein">${lijst.map(productKaart).join("")}</div>`;
}
